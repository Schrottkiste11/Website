<<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Soundboard – Schrottkiste</title>
<meta name="description" content="Schrottkiste Soundboard – Alle Sounds, Playlists und mehr">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
  :root {
    --bg-app: #0f0f13;
    --bg-sidebar: #09090c;
    --bg-card: #181820;
    --bg-card-hover: #22222f;
    --text-main: #f3f1ff;
    --text-muted: #a0a0b0;
    --accent: #ff0099;
    --accent-alt: #00ffff;
    --accent-green: #00ff66;
    --accent-yellow: #ffcc00;
    --accent-red: #ff0033;
    --border-color: #2a2a38;
    --shadow: 0 4px 15px rgba(0,0,0,0.3);
    --radius: 10px;
    --transition: 0.2s ease;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg-app);
    font-family: 'Poppins', sans-serif;
    color: var(--text-main);
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

  /* --- MOBILE BACKDROP --- */
  .sidebar-backdrop {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.7);
    z-index: 990;
    backdrop-filter: blur(2px);
  }
  .sidebar-backdrop.show { display: block; }

  /* --- SIDEBAR --- */
  .app-sidebar {
    width: 280px;
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border-color);
    display: flex;
    flex-direction: column;
    height: 100vh;
    padding: 25px 20px;
    flex-shrink: 0;
    z-index: 1000;
    transition: transform 0.3s ease;
  }

  .sidebar-logo {
    font-family: 'VT323', monospace;
    font-size: 2.2rem;
    color: var(--accent);
    text-shadow: 2px 2px 0px var(--accent-alt);
    margin-bottom: 25px;
    padding-left: 5px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .sidebar-menu {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 20px;
  }

  .sidebar-link {
    color: var(--text-muted);
    text-decoration: none;
    font-size: 1rem;
    padding: 12px 15px;
    border-radius: var(--radius);
    display: flex;
    align-items: center;
    gap: 12px;
    transition: var(--transition);
    font-weight: 500;
  }

  .sidebar-link:hover {
    background: var(--bg-card-hover);
    color: #fff;
    transform: translateX(3px);
  }

  .sidebar-link i {
    width: 20px;
    text-align: center;
    font-size: 1.1rem;
  }

  .sidebar-divider {
    height: 1px;
    background: var(--border-color);
    margin: 15px 0;
  }

  .sidebar-playlists-title {
    font-family: 'VT323', monospace;
    font-size: 1.4rem;
    color: var(--accent-alt);
    padding: 5px 10px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .sidebar-playlists-container {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding-right: 5px;
  }

  .sidebar-playlist-item {
    color: var(--text-muted);
    text-decoration: none;
    font-size: 0.95rem;
    padding: 10px 14px;
    border-radius: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: var(--transition);
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    border: 1px solid transparent;
  }

  .sidebar-playlist-item:hover { 
    background: var(--bg-card); 
    color: #fff;
    border-color: var(--border-color);
  }
  
  .sidebar-playlist-item.active-pl {
    background: rgba(255, 0, 153, 0.12);
    color: var(--accent);
    border-color: var(--accent);
    font-weight: 600;
  }

  .sidebar-del-btn {
    opacity: 0.3;
    transition: var(--transition);
    font-size: 0.85rem;
    padding: 4px;
  }
  .sidebar-del-btn:hover {
    opacity: 1;
    transform: scale(1.2);
    color: var(--accent-red);
  }

  .new-playlist-sidebar-btn {
    background: transparent;
    border: 2px dashed var(--accent);
    color: var(--accent);
    padding: 14px;
    border-radius: var(--radius);
    font-family: 'VT323', monospace;
    font-size: 1.3rem;
    cursor: pointer;
    margin-top: 15px;
    transition: var(--transition);
    text-align: center;
    font-weight: 600;
    letter-spacing: 0.05em;
  }
  .new-playlist-sidebar-btn:hover { 
    background: var(--accent); 
    color: #fff;
    border-style: solid;
    box-shadow: 0 4px 15px rgba(255,0,153,0.3);
  }

  /* --- MAIN CONTENT --- */
  .app-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow-y: auto;
    position: relative;
    padding-bottom: 110px;
  }

  .app-topbar {
    padding: 20px 30px;
    display: flex;
    gap: 20px;
    justify-content: space-between;
    align-items: center;
    background: rgba(15, 15, 19, 0.95);
    backdrop-filter: blur(10px);
    position: sticky;
    top: 0;
    z-index: 950;
    border-bottom: 1px solid var(--border-color);
  }

  .mobile-menu-btn {
    display: none;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    color: #fff;
    width: 44px;
    height: 44px;
    border-radius: var(--radius);
    cursor: pointer;
    align-items: center;
    justify-content: center;
    font-size: 1.3rem;
    flex-shrink: 0;
    transition: var(--transition);
  }
  .mobile-menu-btn:hover { border-color: var(--accent); color: var(--accent); }

  #searchBox {
    width: 100%;
    max-width: 450px;
    padding: 12px 20px;
    border-radius: 25px;
    border: 1px solid var(--border-color);
    background: var(--bg-card);
    color: white;
    font-size: 0.95rem;
    outline: none;
    transition: var(--transition);
  }
  #searchBox:focus { 
    border-color: var(--accent-alt); 
    box-shadow: 0 0 15px rgba(0,255,255,0.15);
  }
  #searchBox::placeholder { color: var(--text-muted); }

  .filter-bar {
    display: flex;
    gap: 8px;
    padding: 15px 30px;
    overflow-x: auto;
    flex-shrink: 0;
    background: rgba(15, 15, 19, 0.95);
    backdrop-filter: blur(10px);
    position: sticky;
    top: 81px; 
    z-index: 900;
    border-bottom: 1px solid var(--border-color);
  }
  .filter-bar::-webkit-scrollbar { height: 3px; }

  .nav-item {
    color: var(--text-muted);
    font-family: 'VT323', monospace;
    font-size: 1.2rem;
    cursor: pointer;
    padding: 8px 18px;
    border: 1px solid var(--border-color);
    border-radius: 20px;
    background: var(--bg-card);
    white-space: nowrap;
    flex-shrink: 0;
    transition: var(--transition);
    user-select: none;
  }
  .nav-item:hover {
    color: #fff;
    border-color: var(--accent-alt);
  }
  .nav-item.active {
    color: #fff;
    background: var(--accent);
    border-color: var(--accent);
    box-shadow: 0 2px 10px rgba(255,0,153,0.3);
  }

  /* --- SONG LISTE --- */
  #soundContainer { 
    padding: 20px 30px; 
    display: flex; 
    flex-direction: column; 
    gap: 6px; 
  }

  .sound-item {
    background: transparent;
    border-radius: var(--radius);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 16px;
    transition: var(--transition);
    border: 1px solid transparent;
  }
  .sound-item:hover { 
    background: var(--bg-card); 
    border-color: var(--border-color);
    box-shadow: var(--shadow);
  }

  .sound-item.playing-row {
    background: rgba(255, 0, 153, 0.08);
    border-color: rgba(255, 0, 153, 0.4);
    box-shadow: 0 0 15px rgba(255, 0, 153, 0.15);
  }

  .play-btn {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    color: #fff;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: var(--transition);
    font-size: 0.95rem;
  }
  .play-btn:hover { 
    border-color: var(--accent-alt); 
    color: var(--accent-alt);
    transform: scale(1.08);
  }
  .play-btn.playing { 
    background: var(--accent); 
    border-color: var(--accent); 
    color: #fff;
    box-shadow: 0 0 15px rgba(255,0,153,0.4);
  }

  .sound-details { 
    flex: 1; 
    display: flex; 
    flex-direction: column; 
    gap: 2px; 
    text-align: left; 
    min-width: 0; 
  }
  .sound-title { 
    font-size: 1rem; 
    font-weight: 500; 
    color: var(--text-main); 
    white-space: nowrap; 
    overflow: hidden; 
    text-overflow: ellipsis; 
  }
  .sound-item.playing-row .sound-title {
    color: #fff;
    font-weight: 600;
  }
  .sound-subtitle { 
    font-size: 0.8rem; 
    color: var(--text-muted); 
  }

  /* Options-Menü */
  .playlist-menu-wrapper { 
    position: relative; 
    display: inline-block; 
    flex-shrink: 0; 
  }
  .playlist-menu-btn {
    background: transparent;
    border: 1px solid var(--border-color);
    color: var(--text-muted);
    width: 34px;
    height: 34px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2rem;
    transition: var(--transition);
  }
  .playlist-menu-btn:hover { 
    border-color: var(--accent-alt); 
    color: var(--accent-alt);
    background: var(--bg-card-hover);
  }

  .playlist-dropdown {
    display: none;
    position: absolute;
    right: 0;
    bottom: 40px;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius);
    padding: 8px;
    z-index: 5000;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    min-width: 240px;
    text-align: left;
  }
  .playlist-dropdown.show { display: block; }
  
  .dropdown-item {
    font-size: 0.9rem;
    color: var(--text-main);
    padding: 10px 14px;
    cursor: pointer;
    border-radius: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: var(--transition);
  }
  .dropdown-item:hover { 
    background: var(--bg-card-hover); 
    color: var(--accent-alt); 
  }
  .dropdown-item.in-pl { 
    color: var(--accent-yellow); 
    font-weight: 600; 
  }

  /* --- FOOTER PLAYER --- */
  .app-bottom-bar {
    position: fixed;
    bottom: 0;
    left: 280px;
    right: 0;
    height: 90px;
    background: var(--bg-sidebar);
    border-top: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 30px;
    z-index: 1100;
    transition: left 0.3s ease;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.4);
  }

  .footer-left {
    display: flex;
    align-items: center;
    gap: 15px;
    min-width: 180px;
    max-width: 260px;
    cursor: pointer;
    transition: var(--transition);
  }
  .footer-left:hover { opacity: 0.85; }
  
  .footer-thumb {
    width: 48px;
    height: 48px;
    background: var(--bg-card);
    border-radius: 8px;
    border: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3rem;
    flex-shrink: 0;
    transition: var(--transition);
  }
  .footer-song-meta { 
    display: flex; 
    flex-direction: column; 
    overflow: hidden; 
    text-align: left; 
  }
  .footer-song-title { 
    font-size: 0.9rem; 
    font-weight: 600; 
    color: #fff; 
    white-space: nowrap; 
    overflow: hidden; 
    text-overflow: ellipsis; 
  }
  .footer-song-artist { 
    font-size: 0.78rem; 
    color: var(--text-muted); 
  }

  .footer-center {
    flex: 1;
    max-width: 500px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 0 20px;
  }
  .footer-controls { 
    display: flex; 
    align-items: center; 
    gap: 16px; 
  }
  
  .footer-ctrl-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-size: 1.1rem;
    cursor: pointer;
    transition: var(--transition);
    padding: 5px;
  }
  .footer-ctrl-btn:hover { 
    color: #fff; 
    transform: scale(1.15); 
  }
  .footer-ctrl-btn.active { 
    color: var(--accent); 
    text-shadow: 0 0 10px var(--accent); 
  }

  .footer-play-btn {
    background: #fff;
    color: #000;
    border: none;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    transition: var(--transition);
  }
  .footer-play-btn:hover { 
    transform: scale(1.08); 
    background: var(--accent-alt); 
  }

  .footer-progress-wrapper {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .time-info {
    font-family: 'VT323', monospace;
    font-size: 0.95rem;
    color: var(--text-muted);
    min-width: 35px;
    text-align: center;
  }

  .seek-slider {
    -webkit-appearance: none;
    flex: 1;
    height: 4px;
    border-radius: 2px;
    background: var(--border-color);
    outline: none;
    cursor: pointer;
  }
  .seek-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--accent-red);
    cursor: pointer;
    box-shadow: 0 0 8px rgba(255,0,51,0.6);
    transition: transform 0.2s;
  }
  .seek-slider::-webkit-slider-thumb:hover {
    transform: scale(1.3);
  }

  .footer-right {
    display: flex;
    align-items: center;
    gap: 15px;
    min-width: 180px;
    justify-content: flex-end;
  }

  #volumeControl {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    padding: 8px 14px;
    border-radius: 20px;
  }
  #muteToggleBtn {
    background: none;
    border: none;
    color: #fff;
    font-size: 1rem;
    cursor: pointer;
    transition: var(--transition);
  }
  #muteToggleBtn:hover {
    transform: scale(1.2);
  }
  
  #volume {
    -webkit-appearance: none;
    width: 80px;
    height: 4px;
    border-radius: 2px;
    background: var(--border-color);
    outline: none;
    cursor: pointer;
  }
  #volume::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--accent-alt);
    cursor: pointer;
    box-shadow: 0 0 6px rgba(0,255,255,0.5);
  }

  /* --- MODAL --- */
  #playlistModalOverlay {
    display: none;
    position: fixed; 
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.8);
    z-index: 30000;
    justify-content: center; 
    align-items: center;
    padding: 20px;
    backdrop-filter: blur(4px);
  }
  
  .modal-content {
    background: var(--bg-card);
    border: 2px solid var(--accent);
    border-radius: 16px;
    padding: 30px;
    width: 100%; 
    max-width: 400px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.7);
  }
  
  .modal-content h3 { 
    font-family: 'VT323', monospace; 
    font-size: 1.8rem; 
    color: var(--accent-alt); 
    margin: 0 0 20px; 
  }
  
  #newPlaylistInput {
    width: 100%;
    padding: 14px 18px;
    background: var(--bg-app);
    border: 1px solid var(--border-color);
    border-radius: var(--radius);
    color: white;
    font-size: 1rem;
    margin-bottom: 20px;
    outline: none;
    font-family: 'Poppins', sans-serif;
  }
  #newPlaylistInput:focus { border-color: var(--accent); }
  
  .modal-actions { 
    display: flex; 
    justify-content: center; 
    gap: 10px; 
  }
  
  .modal-btn { 
    background: var(--accent); 
    color: #fff; 
    border: none; 
    padding: 12px 24px; 
    border-radius: 25px; 
    font-weight: 600; 
    cursor: pointer; 
    transition: var(--transition);
    font-family: 'Poppins', sans-serif;
  }
  .modal-btn:hover { 
    background: #ff1a9e; 
    box-shadow: 0 4px 15px rgba(255,0,153,0.3);
  }
  
  .modal-btn-cancel { 
    background: var(--bg-card-hover); 
    color: var(--text-muted); 
  }
  .modal-btn-cancel:hover { 
    background: var(--border-color); 
    color: #fff; 
  }

  /* --- TOAST BENACHRICHTIGUNG --- */
  #toastNotification {
    position: fixed;
    bottom: 105px;
    right: 30px;
    background: var(--bg-card);
    border: 1px solid var(--accent);
    color: var(--text-main);
    padding: 12px 20px;
    border-radius: 25px;
    font-size: 0.9rem;
    box-shadow: 0 5px 20px rgba(0,0,0,0.5);
    z-index: 10000;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.3s ease;
    pointer-events: none;
  }
  #toastNotification.show {
    opacity: 1;
    transform: translateY(0);
  }

  /* --- RESPONSIVE --- */
  @media (max-width: 768px) {
    .app-sidebar {
      position: fixed;
      left: -280px;
      top: 0;
      bottom: 0;
      box-shadow: 10px 0 30px rgba(0,0,0,0.8);
      z-index: 2000;
      transition: transform 0.3s ease;
    }
    .app-sidebar.mobile-open {
      transform: translateX(280px);
    }

    .mobile-menu-btn {
      display: flex;
    }

    .app-bottom-bar {
      left: 0 !important;
      padding: 0 15px;
      height: 80px;
    }

    .app-topbar {
      padding: 15px;
    }

    .filter-bar {
      padding: 10px 15px;
      top: 71px;
    }

    #soundContainer {
      padding: 15px;
    }

    .footer-right {
      display: none;
    }

    .footer-left {
      min-width: unset;
      max-width: 140px;
    }

    .footer-center {
      max-width: unset;
      padding: 0 8px;
    }

    #toastNotification {
      right: 15px;
      bottom: 95px;
    }
  }
</style>
</head>

<body>

<!-- Mobile Sidebar Backdrop -->
<div class="sidebar-backdrop" id="sidebarBackdrop"></div>

<!-- Sidebar -->
<aside class="app-sidebar" id="appSidebar">
  <div class="sidebar-logo">⚡ Soundboard</div>
  
  <div class="sidebar-menu">
    <a href="index.html" class="sidebar-link"><i class="fas fa-home"></i> Startseite</a>
    <a href="ideen.html" class="sidebar-link"><i class="fas fa-list"></i> Content-Plan</a>
  </div>

  <div class="sidebar-divider"></div>

  <div class="sidebar-playlists-title">📂 Meine Playlists</div>
  <div class="sidebar-playlists-container" id="sidebarPlaylistLinks"></div>
  
  <button class="new-playlist-sidebar-btn" id="sidebarNewPlaylistBtn">+ Neue Playlist</button>
</aside>

<!-- Modal für neue Playlist -->
<div id="playlistModalOverlay">
  <div class="modal-content">
    <h3>🎵 Neue Playlist</h3>
    <input type="text" id="newPlaylistInput" placeholder="Name der Playlist..." maxlength="30" />
    <div class="modal-actions">
      <button id="modalCreateBtn" class="modal-btn">Erstellen</button>
      <button id="modalCancelBtn" class="modal-btn modal-btn-cancel">Abbrechen</button>
    </div>
  </div>
</div>

<!-- Toast Feedback -->
<div id="toastNotification"></div>

<!-- Hauptbereich -->
<main class="app-main">
  
  <div class="app-topbar">
    <button class="mobile-menu-btn" id="mobileMenuBtn" title="Menü">☰</button>
    <input type="text" id="searchBox" placeholder="🔍 Sounds durchsuchen..." />
  </div>

  <div class="filter-bar">
    <div class="nav-item active" data-cat="all">Alle</div>
    <div class="nav-item" data-cat="playlist">⭐ Playlist (<span id="playlistCount">0</span>)</div>
    <div class="nav-item" data-cat="minecraft">🎮 Minecraft</div>
    <div class="nav-item" data-cat="animal">🌿 Animal Crossing</div>
    <div class="nav-item" data-cat="series">📺 Serien</div>
    <div class="nav-item" data-cat="littlebigplanet">🧵 LBP</div>
    <div class="nav-item" data-cat="speedy">🐣 Speedy</div>
    <div class="nav-item" data-cat="lifeisstrange">🦋 LIS</div>
  </div>

  <div id="soundContainer">
    <div style="text-align:center; padding:40px; color:var(--text-muted);">Lade Sounds...</div>
  </div>

</main>

<!-- Footer Player -->
<footer class="app-bottom-bar">
  <div class="footer-left" id="footerExpandTrigger" title="Aktueller Track">
    <div class="footer-thumb">🎶</div>
    <div class="footer-song-meta">
      <div id="footerSongTitle" class="footer-song-title">Kein Titel</div>
      <div class="footer-song-artist">Schrottkiste</div>
    </div>
  </div>

  <div class="footer-center">
    <div class="footer-controls">
      <button id="footerShuffleBtn" class="footer-ctrl-btn" title="Shuffle (Strg+S)">🔀</button>
      <button id="footerPrevBtn" class="footer-ctrl-btn" title="Vorheriger (Strg+◄)">⏮</button>
      <button id="footerPlayBtn" class="footer-play-btn" title="Play/Pause (Leertaste)">▶</button>
      <button id="footerNextBtn" class="footer-ctrl-btn" title="Nächster (Strg+►)">⏭</button>
    </div>
    <div class="footer-progress-wrapper">
      <span id="footerCurrentTime" class="time-info">0:00</span>
      <input type="range" id="footerSeekBar" class="seek-slider" value="0" min="0" max="100" step="0.1">
      <span id="footerTotalTime" class="time-info">0:00</span>
    </div>
  </div>

  <div class="footer-right">
    <div id="volumeControl">
      <button id="muteToggleBtn" title="Stummschalten (M)">🔊</button>
      <input type="range" id="volume" min="0" max="1" step="0.01" value="0.5">
    </div>
  </div>
</footer>

<script>
// --- KONFIGURATION ---
const username = "Schrottkiste11";
const repo = "e";

// --- DOM ELEMENTE ---
const soundContainer = document.getElementById("soundContainer");
const volumeSlider = document.getElementById("volume");
const muteToggleBtn = document.getElementById("muteToggleBtn");
const searchBox = document.getElementById("searchBox");
const playlistCountSpan = document.getElementById("playlistCount");
const sidebarPlaylistLinks = document.getElementById("sidebarPlaylistLinks");
const sidebarNewPlaylistBtn = document.getElementById("sidebarNewPlaylistBtn");
const mobileMenuBtn = document.getElementById("mobileMenuBtn");
const appSidebar = document.getElementById("appSidebar");
const sidebarBackdrop = document.getElementById("sidebarBackdrop");
const footerSongTitle = document.getElementById("footerSongTitle");
const footerPlayBtn = document.getElementById("footerPlayBtn");
const footerSeekBar = document.getElementById("footerSeekBar");
const footerCurrentTime = document.getElementById("footerCurrentTime");
const footerTotalTime = document.getElementById("footerTotalTime");
const footerShuffleBtn = document.getElementById("footerShuffleBtn");
const footerPrevBtn = document.getElementById("footerPrevBtn");
const footerNextBtn = document.getElementById("footerNextBtn");
const playlistModalOverlay = document.getElementById("playlistModalOverlay");
const newPlaylistInput = document.getElementById("newPlaylistInput");
const modalCreateBtn = document.getElementById("modalCreateBtn");
const modalCancelBtn = document.getElementById("modalCancelBtn");
const toastNotification = document.getElementById("toastNotification");

// --- STATE ---
let globalVolume = parseFloat(localStorage.getItem("soundVolume")) || 0.5;
let previousVolume = globalVolume || 0.5;
let currentAudio = null;
let currentSongName = null;
let currentSongObj = null;
let isShuffle = false;
let currentCategory = "all";
let searchQuery = "";
let songHistory = [];
let forwardHistory = [];
let songQueue = JSON.parse(localStorage.getItem("soundboardQueue")) || [];
let soundboardPlaylists = JSON.parse(localStorage.getItem("soundboardPlaylists")) || { "Favoriten": [] };
let activePlaylistName = localStorage.getItem("soundboardActivePlaylist") || "Favoriten";
let hasUserSelectedPlaylist = false;
let allSongs = [];
let toastTimeout = null;

// Sicherstellen, dass die aktive Playlist existiert
if (!soundboardPlaylists[activePlaylistName]) {
  activePlaylistName = Object.keys(soundboardPlaylists)[0] || "Favoriten";
  if (!soundboardPlaylists[activePlaylistName]) {
    soundboardPlaylists[activePlaylistName] = [];
  }
}

// --- KATEGORIEN ---
const categoryMap = {
  "minecraft": ["Sweden", "Wet Hands", "Moog City", "Minecraft"],
  "animal": ["5 P.M.", "Kapp'n", "Title Screen", "Wild World", "Title Theme", "Animal Crossing"],
  "series": ["Cosmo", "Ducktales", "Gravity Falls", "Kim Possible", "Lauras", "LazyTown", "Phineas", "Spongebob", "Scooby", "Zoés", "ALF", "Ecce Homo", "Bean"],
  "littlebigplanet": ["LittleBigPlanet", "Victoria", "Gardens", "Wedding", "Wilderness"],
  "speedy": ["Speedy", "Eggbert", "Adventure", "Intro", "Level"],
  "lifeisstrange": ["Life is Strange", "LIS"]
};

// --- HILFSFUNKTIONEN ---
function showToast(message) {
  if (toastTimeout) clearTimeout(toastTimeout);
  toastNotification.textContent = message;
  toastNotification.classList.add("show");
  toastTimeout = setTimeout(() => {
    toastNotification.classList.remove("show");
  }, 2500);
}

function updateSeekBackground(slider) {
  const value = slider.value;
  const percentage = (value / 100) * 100;
  slider.style.background = `linear-gradient(to right, var(--accent-red) ${percentage}%, var(--border-color) ${percentage}%)`;
}

function savePlaylists() {
  localStorage.setItem("soundboardPlaylists", JSON.stringify(soundboardPlaylists));
  localStorage.setItem("soundboardActivePlaylist", activePlaylistName);
}

function saveQueue() {
  localStorage.setItem("soundboardQueue", JSON.stringify(songQueue));
}

function formatTime(seconds) {
  if (isNaN(seconds) || !isFinite(seconds)) return "0:00";
  const mins = Math.floor(seconds / 60);
  const secs = Math.floor(seconds % 60);
  return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
}

// --- MOBILE MENU ---
mobileMenuBtn.onclick = () => {
  appSidebar.classList.toggle("mobile-open");
  sidebarBackdrop.classList.toggle("show");
};

sidebarBackdrop.onclick = () => {
  appSidebar.classList.remove("mobile-open");
  sidebarBackdrop.classList.remove("show");
};

// --- SOUNDS LADEN ---
async function loadSounds() {
  try {
    const response = await fetch(`https://api.github.com/repos/${username}/${repo}/contents/`);
    if (!response.ok) throw new Error("Repo nicht gefunden");
    
    const files = await response.json();
    const audioFiles = files.filter(f => {
      const name = f.name.toLowerCase();
      return name.endsWith(".mp3") || name.endsWith(".wav") || name.endsWith(".ogg");
    });
    
    allSongs = audioFiles.map(file => ({
      name: file.name.replace(/\.[^/.]+$/, ""),
      url: `https://raw.githubusercontent.com/${username}/${repo}/main/${encodeURIComponent(file.name)}`
    }));
    
    if (allSongs.length === 0) {
      soundContainer.innerHTML = '<div style="text-align:center; padding:40px; color:var(--text-muted);">Keine Audio-Dateien gefunden 😢</div>';
    }
    
    updateSidebarPlaylists();
    updatePlaylistCount();
    renderList();
  } catch (error) {
    console.error("Fehler beim Laden:", error);
    soundContainer.innerHTML = '<div style="text-align:center; padding:40px; color:var(--accent-red);">Fehler beim Laden der Sounds 😢<br><small>Bitte Repo-Namen prüfen</small></div>';
  }
}

// --- PLAYLIST MANAGEMENT ---
function updateSidebarPlaylists() {
  sidebarPlaylistLinks.innerHTML = "";
  
  Object.keys(soundboardPlaylists).forEach(plName => {
    const isActive = hasUserSelectedPlaylist && (plName === activePlaylistName);
    const count = soundboardPlaylists[plName].length;
    
    const link = document.createElement("div");
    link.className = `sidebar-playlist-item ${isActive ? 'active-pl' : ''}`;
    link.innerHTML = `
      <span>🎵 ${plName}</span> 
      <div style="display:flex; align-items:center; gap:8px;">
        <span style="font-size:0.8rem; opacity:0.6;">${count}</span>
        <span class="sidebar-del-btn" title="Playlist löschen">🗑️</span>
      </div>
    `;
    
    // Playlist auswählen
    link.onclick = (e) => {
      if (e.target.closest('.sidebar-del-btn')) return;
      activePlaylistName = plName;
      hasUserSelectedPlaylist = true;
      savePlaylists();
      
      document.querySelectorAll(".nav-item").forEach(n => {
        n.classList.toggle("active", n.dataset.cat === "playlist");
      });
      currentCategory = "playlist";
      
      updateSidebarPlaylists();
      updatePlaylistCount();
      renderList();
      
      appSidebar.classList.remove("mobile-open");
      sidebarBackdrop.classList.remove("show");
    };
    
    // Playlist löschen
    link.querySelector(".sidebar-del-btn").onclick = (ev) => {
      ev.stopPropagation();
      const keys = Object.keys(soundboardPlaylists);
      if (keys.length <= 1) {
        showToast("Mindestens eine Playlist muss bleiben! 🛑");
        return;
      }
      if (confirm(`Playlist "${plName}" wirklich löschen?`)) {
        delete soundboardPlaylists[plName];
        if (activePlaylistName === plName) {
          activePlaylistName = Object.keys(soundboardPlaylists)[0];
          hasUserSelectedPlaylist = false;
        }
        savePlaylists();
        updateSidebarPlaylists();
        updatePlaylistCount();
        renderList();
        showToast(`Playlist "${plName}" gelöscht! 🗑️`);
      }
    };
    
    sidebarPlaylistLinks.appendChild(link);
  });
}

function updatePlaylistCount() {
  const count = (soundboardPlaylists[activePlaylistName] || []).length;
  playlistCountSpan.textContent = count;
}

// --- MODAL ---
sidebarNewPlaylistBtn.onclick = () => {
  newPlaylistInput.value = "";
  playlistModalOverlay.style.display = "flex";
  setTimeout(() => newPlaylistInput.focus(), 100);
};

modalCancelBtn.onclick = () => {
  playlistModalOverlay.style.display = "none";
};

modalCreateBtn.onclick = () => {
  const name = newPlaylistInput.value.trim();
  if (!name) return;
  
  if (soundboardPlaylists[name]) {
    alert("Playlist existiert bereits!");
    return;
  }
  
  soundboardPlaylists[name] = [];
  activePlaylistName = name;
  hasUserSelectedPlaylist = true;
  savePlaylists();
  
  document.querySelectorAll(".nav-item").forEach(n => {
    n.classList.toggle("active", n.dataset.cat === "playlist");
  });
  currentCategory = "playlist";
  
  updateSidebarPlaylists();
  updatePlaylistCount();
  renderList();
  playlistModalOverlay.style.display = "none";
  showToast(`Playlist "${name}" erstellt! ✨`);
};

newPlaylistInput.onkeydown = (e) => {
  if (e.key === "Enter") modalCreateBtn.click();
  if (e.key === "Escape") modalCancelBtn.click();
};

playlistModalOverlay.onclick = (e) => {
  if (e.target === playlistModalOverlay) {
    playlistModalOverlay.style.display = "none";
  }
};

// --- AUDIO PLAYER ---
function playSong(song, isNavigation = false) {
  // Gleicher Song = Pause/Play toggle
  if (currentSongName === song.name && currentAudio && !isNavigation) {
    if (currentAudio.paused) {
      currentAudio.play();
      updatePlayState(true);
    } else {
      currentAudio.pause();
      updatePlayState(false);
    }
    return;
  }

  // Alten Song stoppen
  if (currentAudio) {
    currentAudio.pause();
    currentAudio.currentTime = 0;
    currentAudio = null;
  }

  // History verwalten
  if (!isNavigation && currentSongObj) {
    songHistory.push(currentSongObj);
  }
  forwardHistory = [];

  // Neuen Song starten
  const audio = new Audio(song.url);
  audio.volume = globalVolume;
  currentAudio = audio;
  currentSongName = song.name;
  currentSongObj = song;

  footerSongTitle.textContent = song.name;
  updatePlayState(true);

  audio.play().catch(err => {
    console.log("Autoplay blockiert:", err);
    updatePlayState(false);
  });
  
  renderList();

  // Time-Update
  audio.ontimeupdate = () => {
    if (audio.duration && isFinite(audio.duration)) {
      const percent = (audio.currentTime / audio.duration) * 100;
      footerSeekBar.value = percent;
      updateSeekBackground(footerSeekBar);
      footerCurrentTime.textContent = formatTime(audio.currentTime);
      footerTotalTime.textContent = formatTime(audio.duration);
    }
  };

  // Song Ende -> Nächster Song
  audio.onended = () => {
    playNext();
  };
}

function updatePlayState(isPlaying) {
  footerPlayBtn.textContent = isPlaying ? "⏸" : "▶";
  const currentBtn = document.querySelector(`.play-btn[data-name="${CSS.escape(currentSongName || '')}"]`);
  
  document.querySelectorAll('.play-btn').forEach(btn => {
    btn.classList.remove('playing');
    btn.textContent = "▶";
  });
  document.querySelectorAll('.sound-item').forEach(item => {
    item.classList.remove('playing-row');
  });

  if (currentBtn && isPlaying) {
    currentBtn.classList.add('playing');
    currentBtn.textContent = "⏸";
    const row = currentBtn.closest('.sound-item');
    if (row) row.classList.add('playing-row');
  }
}

function playNext() {
  const currentList = getFilteredSongs();
  if (currentList.length === 0) return;

  let nextSong = null;

  if (songQueue.length > 0) {
    const queueItemName = songQueue.shift();
    saveQueue();
    nextSong = allSongs.find(s => s.name === queueItemName);
  }

  if (!nextSong) {
    if (forwardHistory.length > 0) {
      nextSong = forwardHistory.pop();
    } else if (isShuffle) {
      const randomIndex = Math.floor(Math.random() * currentList.length);
      nextSong = currentList[randomIndex];
    } else {
      const currentIndex = currentList.findIndex(s => s.name === currentSongName);
      if (currentIndex !== -1 && currentIndex < currentList.length - 1) {
        nextSong = currentList[currentIndex + 1];
      } else {
        nextSong = currentList[0];
      }
    }
  }

  if (nextSong) {
    playSong(nextSong, true);
  }
}

function playPrev() {
  const currentList = getFilteredSongs();
  if (currentList.length === 0) return;

  if (currentAudio && currentAudio.currentTime > 3) {
    currentAudio.currentTime = 0;
    return;
  }

  let prevSong = null;

  if (songHistory.length > 0) {
    if (currentSongObj) forwardHistory.push(currentSongObj);
    prevSong = songHistory.pop();
  } else {
    const currentIndex = currentList.findIndex(s => s.name === currentSongName);
    if (currentIndex > 0) {
      prevSong = currentList[currentIndex - 1];
    } else {
      prevSong = currentList[currentList.length - 1];
    }
  }

  if (prevSong) {
    playSong(prevSong, true);
  }
}

// --- FILTER & LISTING ---
function getFilteredSongs() {
  return allSongs.filter(song => {
    const songNameLower = song.name.toLowerCase();
    
    // Suchfilter
    if (searchQuery && !songNameLower.includes(searchQuery)) {
      return false;
    }

    // Kategoriefilter
    if (currentCategory === "all") return true;

    if (currentCategory === "playlist") {
      const activeList = soundboardPlaylists[activePlaylistName] || [];
      return activeList.includes(song.name);
    }

    const keywords = categoryMap[currentCategory];
    if (keywords) {
      return keywords.some(kw => songNameLower.includes(kw.toLowerCase()));
    }

    return true;
  });
}

function renderList() {
  const filtered = getFilteredSongs();
  soundContainer.innerHTML = "";

  if (filtered.length === 0) {
    soundContainer.innerHTML = '<div style="text-align:center; padding:40px; color:var(--text-muted);">Keine Sounds in dieser Kategorie 🔍</div>';
    return;
  }

  filtered.forEach(song => {
    const isPlaying = (currentSongName === song.name && currentAudio && !currentAudio.paused);
    const item = document.createElement("div");
    item.className = `sound-item ${currentSongName === song.name ? 'playing-row' : ''}`;

    // Prüfen in welchen Playlists der Song ist
    const playlistsWithSong = Object.keys(soundboardPlaylists).filter(p => soundboardPlaylists[p].includes(song.name));
    const isInActivePl = (soundboardPlaylists[activePlaylistName] || []).includes(song.name);

    item.innerHTML = `
      <button class="play-btn ${isPlaying ? 'playing' : ''}" data-name="${song.name}">
        ${isPlaying ? '⏸' : '▶'}
      </button>

      <div class="sound-details">
        <div class="sound-title" title="${song.name}">${song.name}</div>
        <div class="sound-subtitle">${playlistsWithSong.length > 0 ? '⭐ In Playlist' : 'Audio File'}</div>
      </div>

      <div class="playlist-menu-wrapper">
        <button class="playlist-menu-btn" title="Optionen">⋮</button>
        <div class="playlist-dropdown">
          <div style="font-size:0.75rem; color:var(--text-muted); padding:4px 10px; margin-bottom:4px; border-bottom:1px solid var(--border-color);">
            PLAYLISTS
          </div>
          ${Object.keys(soundboardPlaylists).map(plName => {
            const inThis = soundboardPlaylists[plName].includes(song.name);
            return `
              <div class="dropdown-item ${inThis ? 'in-pl' : ''}" data-pl="${plName}">
                <span>${inThis ? '★' : '☆'} ${plName}</span>
                <span style="font-size:0.75rem;">${inThis ? 'Entfernen' : 'Hinzufügen'}</span>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    `;

    // Play-Button Klick
    const playBtn = item.querySelector(".play-btn");
    playBtn.onclick = (e) => {
      e.stopPropagation();
      playSong(song);
    };

    // Zeile Klick = Abspielen
    item.onclick = (e) => {
      if (!e.target.closest('.playlist-menu-wrapper') && !e.target.closest('.play-btn')) {
        playSong(song);
      }
    };

    // Dropdown Toggle
    const menuBtn = item.querySelector(".playlist-menu-btn");
    const dropdown = item.querySelector(".playlist-dropdown");

    menuBtn.onclick = (e) => {
      e.stopPropagation();
      document.querySelectorAll(".playlist-dropdown.show").forEach(d => {
        if (d !== dropdown) d.classList.remove("show");
      });
      dropdown.classList.toggle("show");
    };

    // Playlist Item Toggle Klick
    dropdown.querySelectorAll(".dropdown-item").forEach(dItem => {
      dItem.onclick = (e) => {
        e.stopPropagation();
        const plTarget = dItem.dataset.pl;
        const list = soundboardPlaylists[plTarget] || [];
        const index = list.indexOf(song.name);

        if (index > -1) {
          list.splice(index, 1);
          showToast(`Aus "${plTarget}" entfernt! ❌`);
        } else {
          list.push(song.name);
          showToast(`Zu "${plTarget}" hinzugefügt! ⭐`);
        }

        savePlaylists();
        updateSidebarPlaylists();
        updatePlaylistCount();
        renderList();
      };
    });

    soundContainer.appendChild(item);
  });
}

// Dropdowns schließen bei Klick außerhalb
document.addEventListener("click", () => {
  document.querySelectorAll(".playlist-dropdown.show").forEach(d => d.classList.remove("show"));
});

// --- FILTER EVENT LISTENERS ---
document.querySelectorAll(".nav-item").forEach(item => {
  item.onclick = () => {
    document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));
    item.classList.add("active");
    currentCategory = item.dataset.cat;
    
    if (currentCategory !== "playlist") {
      hasUserSelectedPlaylist = false;
      updateSidebarPlaylists();
    }
    
    renderList();
  };
});

searchBox.oninput = (e) => {
  searchQuery = e.target.value.toLowerCase().trim();
  renderList();
};

// --- CONTROLS EVENT LISTENERS ---
footerPlayBtn.onclick = () => {
  if (!currentAudio && allSongs.length > 0) {
    playSong(allSongs[0]);
    return;
  }
  if (currentAudio) {
    if (currentAudio.paused) {
      currentAudio.play();
      updatePlayState(true);
    } else {
      currentAudio.pause();
      updatePlayState(false);
    }
  }
};

footerNextBtn.onclick = () => playNext();
footerPrevBtn.onclick = () => playPrev();

footerShuffleBtn.onclick = () => {
  isShuffle = !isShuffle;
  footerShuffleBtn.classList.toggle("active", isShuffle);
  showToast(isShuffle ? "Shuffle aktiv 🔀" : "Shuffle inaktiv 🔁");
};

// Seekbar Steuerung
footerSeekBar.oninput = (e) => {
  if (currentAudio && currentAudio.duration) {
    const targetTime = (e.target.value / 100) * currentAudio.duration;
    currentAudio.currentTime = targetTime;
    updateSeekBackground(footerSeekBar);
  }
};

// Lautstärke Steuerung
volumeSlider.oninput = (e) => {
  globalVolume = parseFloat(e.target.value);
  if (currentAudio) currentAudio.volume = globalVolume;
  localStorage.setItem("soundVolume", globalVolume);
  
  if (globalVolume === 0) {
    muteToggleBtn.textContent = "🔇";
  } else if (globalVolume < 0.5) {
    muteToggleBtn.textContent = "🔉";
  } else {
    muteToggleBtn.textContent = "🔊";
  }
};

muteToggleBtn.onclick = () => {
  if (globalVolume > 0) {
    previousVolume = globalVolume;
    globalVolume = 0;
    volumeSlider.value = 0;
    muteToggleBtn.textContent = "🔇";
  } else {
    globalVolume = previousVolume || 0.5;
    volumeSlider.value = globalVolume;
    muteToggleBtn.textContent = globalVolume < 0.5 ? "🔉" : "🔊";
  }
  if (currentAudio) currentAudio.volume = globalVolume;
  localStorage.setItem("soundVolume", globalVolume);
};

// Tastatur Shortcuts
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT") return;

  if (e.code === "Space") {
    e.preventDefault();
    footerPlayBtn.click();
  } else if (e.ctrlKey && e.code === "ArrowRight") {
    e.preventDefault();
    playNext();
  } else if (e.ctrlKey && e.code === "ArrowLeft") {
    e.preventDefault();
    playPrev();
  } else if (e.ctrlKey && e.code === "KeyS") {
    e.preventDefault();
    footerShuffleBtn.click();
  } else if (e.code === "KeyM") {
    e.preventDefault();
    muteToggleBtn.click();
  }
});

// Initialisierung
volumeSlider.value = globalVolume;
if (globalVolume === 0) muteToggleBtn.textContent = "🔇";
loadSounds();
</script>

</body>
</html>
