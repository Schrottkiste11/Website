<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Soundboard – Schrottkiste</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=VT323&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-app: #0f0f13;
    --bg-sidebar: #09090c;
    --bg-card: #181820;
    --bg-card-hover: #22222f;
    --text-main: #f3f1ff;
    --text-muted: #a0a0b0;
    --accent: #ff0099;
    --accent-alt: #00ffff;
    --accent-green: #00ff66;
    --accent-yellow: #ffcc00;
    --border-color: #2a2a38;
  }

  * { box-sizing: border-box; }

  body {
    background: var(--bg-app);
    font-family: 'Poppins', sans-serif;
    color: var(--text-main);
    margin: 0;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* --- MOBILE BACKDROP --- */
  .sidebar-backdrop {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.6);
    z-index: 990;
  }
  .sidebar-backdrop.show { display: block; }

  /* --- LINKER BEREICH: SIDEBAR --- */
  .app-sidebar {
    width: 260px;
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border-color);
    display: flex;
    flex-direction: column;
    height: 100vh;
    padding: 20px 15px;
    flex-shrink: 0;
    z-index: 1000;
    transition: transform 0.3s ease;
  }

  .sidebar-logo {
    font-family: 'VT323', monospace;
    font-size: 2rem;
    color: var(--accent);
    text-shadow: 2px 2px 0px var(--accent-alt);
    margin-bottom: 25px;
    padding-left: 10px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .sidebar-menu {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 20px;
  }

  .sidebar-link {
    color: var(--text-muted);
    text-decoration: none;
    font-size: 1.05rem;
    padding: 10px 12px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: 0.2s;
    font-weight: 400;
  }

  .sidebar-link:hover, .sidebar-link.active {
    background: var(--bg-card-hover);
    color: var(--text-main);
  }

  .sidebar-divider {
    height: 1px;
    background: var(--border-color);
    margin: 10px 0;
  }

  .sidebar-playlists-title {
    font-family: 'VT323', monospace;
    font-size: 1.2rem;
    color: var(--accent-alt);
    padding: 5px 10px;
    margin-bottom: 5px;
  }

  .sidebar-playlists-container {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding-right: 5px;
  }

  .sidebar-playlists-container::-webkit-scrollbar { width: 5px; }
  .sidebar-playlists-container::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }

  .sidebar-playlist-item {
    color: var(--text-muted);
    text-decoration: none;
    font-size: 0.95rem;
    padding: 8px 12px;
    border-radius: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: 0.2s;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .sidebar-playlist-item:hover { background: var(--bg-card); color: #fff; }
  .sidebar-playlist-item.active-pl {
    background: rgba(255, 0, 153, 0.15);
    color: var(--accent);
    border-left: 3px solid var(--accent);
  }

  .sidebar-del-btn {
    opacity: 0.4;
    transition: 0.2s;
  }
  .sidebar-del-btn:hover {
    opacity: 1;
    transform: scale(1.1);
  }

  .new-playlist-sidebar-btn {
    background: transparent;
    border: 2px dashed var(--accent);
    color: var(--accent);
    padding: 10px;
    border-radius: 8px;
    font-family: 'VT323', monospace;
    font-size: 1.2rem;
    cursor: pointer;
    margin-top: 10px;
    transition: 0.2s;
    text-align: center;
  }
  .new-playlist-sidebar-btn:hover { background: var(--accent); color: #fff; }

  /* --- RECHTER BEREICH: HAUPTINHALT --- */
  .app-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow-y: auto;
    position: relative;
    padding-bottom: 120px;
  }

  .app-topbar {
    padding: 15px 40px;
    display: flex;
    gap: 15px;
    justify-content: space-between;
    align-items: center;
    background: rgba(15, 15, 19, 0.95);
    backdrop-filter: blur(10px);
    position: sticky;
    top: 0;
    z-index: 950;
    border-bottom: 1px solid var(--border-color);
  }

  .mobile-menu-btn {
    display: none;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    color: #fff;
    width: 40px;
    height: 40px;
    border-radius: 8px;
    cursor: pointer;
    align-items: center;
    justify-content: center;
    font-size: 1.2rem;
    flex-shrink: 0;
  }

  #searchBox {
    width: 100%;
    max-width: 450px;
    padding: 10px 20px;
    border-radius: 20px;
    border: 1px solid var(--border-color);
    background: var(--bg-card);
    color: white;
    font-size: 0.95rem;
    outline: none;
    transition: 0.2s;
  }
  #searchBox:focus { border-color: var(--accent-alt); }

  .filter-bar {
    display: flex;
    gap: 8px;
    padding: 12px 40px;
    overflow-x: auto;
    flex-shrink: 0;
    background: rgba(15, 15, 19, 0.95);
    backdrop-filter: blur(10px);
    position: sticky;
    top: 69px; 
    z-index: 900;
    border-bottom: 1px solid var(--border-color);
  }
  .filter-bar::-webkit-scrollbar { height: 4px; }
  .filter-bar::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }

  .nav-item {
    color: var(--text-muted);
    font-family: 'VT323', monospace;
    font-size: 1.1rem;
    cursor: pointer;
    padding: 4px 14px;
    border: 1px solid var(--border-color);
    border-radius: 20px;
    background: var(--bg-card);
    white-space: nowrap;
    flex-shrink: 0;
    transition: 0.2s;
  }
  .nav-item.active, .nav-item:hover {
    color: #fff;
    border-color: var(--accent-alt);
    background: var(--bg-card-hover);
  }

  /* --- EMPFEHLUNGEN --- */
  #recommendationSection {
    display: none;
    margin: 25px 40px 10px 40px;
    background: rgba(0, 255, 255, 0.03);
    border: 1px dashed var(--accent-alt);
    border-radius: 12px;
    padding: 20px;
    text-align: left;
  }
  .rec-header { font-family: 'VT323', monospace; font-size: 1.3rem; color: var(--accent-alt); margin-bottom: 12px; }
  .rec-list { display: flex; flex-direction: column; gap: 8px; }
  .rec-card {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--bg-card);
    padding: 8px 15px;
    border-radius: 8px;
    border: 1px solid var(--border-color);
  }
  .rec-info-group { display: flex; align-items: center; gap: 12px; }
  .rec-song-title { font-size: 0.9rem; font-weight: 500; }
  
  .rec-actions { display: flex; align-items: center; gap: 10px; }
  .rec-add-btn {
    background: transparent;
    border: 1px solid var(--accent-yellow);
    color: var(--accent-yellow);
    padding: 4px 12px;
    border-radius: 15px;
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 600;
  }
  .rec-add-btn.added { background: var(--accent-yellow); color: #000; }

  /* --- SONG LISTE --- */
  #soundContainer { padding: 20px 40px; display: flex; flex-direction: column; gap: 6px; }

  .sound-item {
    background: transparent;
    border-radius: 8px;
    padding: 10px 15px;
    display: flex;
    align-items: center;
    gap: 15px;
    transition: 0.2s;
    border: 1px solid transparent;
  }
  .sound-item:hover { background: var(--bg-card); border-color: var(--border-color); }

  .play-btn {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    color: #fff;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: 0.2s;
  }
  .play-btn:hover { border-color: var(--accent-alt); color: var(--accent-alt); }
  .play-btn.playing { background: var(--accent); border-color: var(--accent); color: #fff; }

  .sound-details { flex: 1; display: flex; flex-direction: column; gap: 2px; text-align: left; min-width: 0; }
  .sound-title { font-size: 0.95rem; font-weight: 500; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sound-subtitle { font-size: 0.8rem; color: var(--text-muted); }

  /* Playlist-Menü Button & Dropdown */
  .playlist-menu-wrapper { position: relative; display: inline-block; flex-shrink: 0; }
  .playlist-menu-btn {
    background: transparent;
    border: 1px solid var(--border-color);
    color: var(--text-muted);
    width: 32px;
    height: 32px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.2s;
  }
  .playlist-menu-btn.has-playlist {
    border-color: var(--accent-yellow);
    color: var(--accent-yellow);
    background: rgba(255, 204, 0, 0.08);
  }
  .playlist-menu-btn:hover { border-color: var(--accent-yellow); color: var(--accent-yellow); }

  .playlist-dropdown {
    display: none;
    position: absolute;
    right: 0;
    bottom: 40px;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 6px;
    z-index: 5000;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    min-width: 180px;
    text-align: left;
  }
  .playlist-dropdown.show { display: block; }
  .dropdown-item {
    font-size: 0.9rem;
    color: var(--text-main);
    padding: 8px 12px;
    cursor: pointer;
    border-radius: 4px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .dropdown-item:hover { background: var(--bg-card-hover); color: var(--accent-alt); }
  .dropdown-item.in-pl { color: var(--accent-yellow); font-weight: 600; }

  /* --- FOOTER PLAYER LEISTE --- */
  .app-bottom-bar {
    position: fixed;
    bottom: 0;
    left: 260px;
    right: 0;
    height: 90px;
    background: var(--bg-sidebar);
    border-top: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 30px;
    z-index: 1100;
    transition: left 0.3s ease;
  }

  .footer-left {
    display: flex;
    align-items: center;
    gap: 15px;
    min-width: 180px;
    max-width: 250px;
    cursor: pointer;
  }
  .footer-left:hover .footer-thumb { border-color: var(--accent-alt); }
  
  .footer-thumb {
    width: 45px;
    height: 45px;
    background: var(--bg-card);
    border-radius: 6px;
    border: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2rem;
    flex-shrink: 0;
    transition: 0.2s;
  }
  .footer-song-meta { display: flex; flex-direction: column; overflow: hidden; text-align: left; }
  .footer-song-title { font-size: 0.85rem; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .footer-song-artist { font-size: 0.75rem; color: var(--text-muted); }

  .footer-center {
    flex: 1;
    max-width: 500px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 0 15px;
  }
  .footer-controls { display: flex; align-items: center; gap: 15px; }
  
  .footer-ctrl-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-size: 1.1rem;
    cursor: pointer;
    transition: 0.2s;
  }
  .footer-ctrl-btn:hover { color: #fff; transform: scale(1.1); }
  .footer-ctrl-btn.active { color: var(--accent); text-shadow: 0 0 10px var(--accent); }

  .footer-play-btn {
    background: #fff;
    color: #000;
    border: none;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.95rem;
    transition: 0.2s;
  }
  .footer-play-btn:hover { transform: scale(1.05); background: var(--accent-alt); }

  .footer-progress-wrapper {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .time-info {
    font-family: 'VT323', monospace;
    font-size: 0.85rem;
    color: var(--text-muted);
    min-width: 30px;
    text-align: center;
  }

  .seek-slider {
    -webkit-appearance: none;
    flex: 1;
    height: 5px;
    border-radius: 3px;
    background: var(--border-color);
    outline: none;
    cursor: pointer;
  }
  .seek-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #fff;
    cursor: pointer;
  }

  .footer-right {
    display: flex;
    align-items: center;
    gap: 15px;
    min-width: 180px;
    justify-content: flex-end;
  }
  #volumeControl { display: flex; align-items: center; gap: 8px; }
  #volumeControl span { font-size: 1rem; }
  #volume { accent-color: var(--accent); cursor: pointer; width: 90px; }

  /* --- ERWEITERTER PLAYER OVERLAY --- */
  #expandedPlayerOverlay {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: var(--bg-app);
    z-index: 50000;
    flex-direction: column;
    padding: 20px;
    animation: fadeInOverlay 0.2s ease-in-out;
  }
  @keyframes fadeInOverlay {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .expanded-top-bar {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    margin-bottom: 15px;
  }

  .expanded-close-btn {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    color: #fff;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2rem;
    transition: 0.2s;
  }
  .expanded-close-btn:hover { background: var(--accent); border-color: var(--accent); }

  .expanded-body {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    padding-bottom: 20px;
  }

  .expanded-center-container {
    width: 100%;
    max-width: 700px;
    background: rgba(24, 24, 32, 0.5);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    height: 100%;
    max-height: 550px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .expanded-tabs-header {
    display: flex;
    border-bottom: 1px solid var(--border-color);
    padding: 0 15px;
    background: var(--bg-card);
  }
  .expanded-tab {
    padding: 12px 20px;
    font-family: 'VT323', monospace;
    font-size: 1.1rem;
    color: var(--text-muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: 0.2s;
  }
  .expanded-tab.active {
    color: var(--accent-alt);
    border-bottom-color: var(--accent-alt);
  }

  .expanded-tab-content {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
    display: none;
    flex-direction: column;
    gap: 8px;
  }
  .expanded-tab-content.active { display: flex; }
  .expanded-tab-content::-webkit-scrollbar { width: 5px; }
  .expanded-tab-content::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }

  .queue-item-exp {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--bg-card);
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    font-size: 0.85rem;
  }

  /* --- POPUP MODAL --- */
  #playlistModalOverlay {
    display: none;
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.8);
    z-index: 30000;
    justify-content: center; align-items: center;
    padding: 15px;
  }
  .modal-content {
    background: var(--bg-card);
    border: 2px solid var(--accent);
    border-radius: 16px;
    padding: 20px;
    width: 100%; max-width: 400px;
    text-align: center;
    box-shadow: 0 15px 35px rgba(0,0,0,0.6);
  }
  .modal-content h3 { font-family: 'VT323', monospace; font-size: 1.6rem; color: var(--accent-alt); margin-top: 0; margin-bottom: 15px; }
  #newPlaylistInput {
    width: 100%;
    padding: 10px 15px;
    background: var(--bg-app);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    color: white;
    font-size: 1rem;
    margin-bottom: 20px;
    outline: none;
  }
  #newPlaylistInput:focus { border-color: var(--accent); }
  .modal-actions { display: flex; justify-content: center; gap: 10px; }
  .modal-btn { background: var(--accent); color: #fff; border: none; padding: 8px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; }
  .modal-btn-cancel { background: var(--bg-card-hover); color: var(--text-muted); }

  /* --- RESPONSIVE MEDIA QUERIES (MOBILE OPTIMIZATION) --- */
  @media (max-width: 768px) {
    .sidebar-backdrop { display: none; }
    .sidebar-backdrop.show { display: block; }
    
    .app-sidebar {
      position: fixed;
      left: -260px;
      top: 0;
      bottom: 0;
      box-shadow: 10px 0 30px rgba(0,0,0,0.8);
      z-index: 2000;
    }
    .app-sidebar.mobile-open {
      transform: translateX(260px);
    }

    .mobile-menu-btn {
      display: flex;
    }

    .app-bottom-bar {
      left: 0 !important;
      padding: 0 12px;
      height: 80px;
    }

    .app-topbar {
      padding: 12px 15px;
    }

    .filter-bar {
      padding: 10px 15px;
      top: 65px;
    }

    #soundContainer {
      padding: 15px;
    }

    #recommendationSection {
      margin: 15px;
      padding: 15px;
    }

    .footer-right {
      display: none;
    }

    .footer-left {
      min-width: unset;
      max-width: 150px;
    }

    .footer-center {
      max-width: unset;
      padding: 0 5px;
    }

    .footer-controls {
      gap: 12px;
    }

    #expandedPlayerOverlay {
      padding: 10px;
    }
  }
</style>
</head>

<body>

<!-- Mobile Sidebar Backdrop -->
<div class="sidebar-backdrop" id="sidebarBackdrop"></div>

<!-- Linker App-Bereich (Sidebar) -->
<aside class="app-sidebar">
  <div class="sidebar-logo">⚡ Soundboard</div>
  
  <div class="sidebar-menu">
    <a href="index.html" class="sidebar-link">🏠 Startseite</a>
    <a href="ideen.html" class="sidebar-link">📋 Content-Plan</a>
  </div>

  <div class="sidebar-divider"></div>

  <div class="sidebar-playlists-title">📂 Playlists</div>
  <div class="sidebar-playlists-container" id="sidebarPlaylistLinks"></div>
  
  <button class="new-playlist-sidebar-btn" id="sidebarNewPlaylistBtn">➕ Neue Playlist</button>
</aside>

<!-- Modal für neue Playlist -->
<div id="playlistModalOverlay">
  <div class="modal-content">
    <h3>Neue Playlist erstellen 🎵</h3>
    <input type="text" id="newPlaylistInput" placeholder="Name der Playlist..." />
    <div class="modal-actions">
      <button id="modalCreateBtn" class="modal-btn">Erstellen</button>
      <button id="modalCancelBtn" class="modal-btn modal-btn-cancel">Abbrechen</button>
    </div>
  </div>
</div>

<!-- Rechter Hauptbereich -->
<main class="app-main">
  
  <div class="app-topbar">
    <button class="mobile-menu-btn" id="mobileMenuBtn" title="Menü öffnen">☰</button>
    <input type="text" id="searchBox" placeholder="🔍 Nach Sound-Titeln suchen..." />
  </div>

  <div class="filter-bar">
    <div class="nav-item active" data-cat="all">🌐 Alle</div>
    <div class="nav-item" data-cat="playlist">⭐ Aktive Playlist (<span id="playlistCount">0</span>)</div>
    <div class="nav-item" data-cat="minecraft">🎮 Minecraft</div>
    <div class="nav-item" data-cat="animal">🌿 Animal Crossing</div>
    <div class="nav-item" data-cat="series">📺 Serien</div>
    <div class="nav-item" data-cat="littlebigplanet">🧵 LBP</div>
    <div class="nav-item" data-cat="speedy">🐣 Speedy</div>
    <div class="nav-item" data-cat="lifeisstrange">🦋 LIS</div>
  </div>

  <!-- Empfehlungen -->
  <div id="recommendationSection">
    <div class="rec-header">💡 Ähnliche Tracks für dich:</div>
    <div id="recommendationList" class="rec-list"></div>
  </div>

  <div id="soundContainer">Lade Sounds...</div>

</main>

<!-- Unterer Footer-Player -->
<footer class="app-bottom-bar">
  <div class="footer-left" id="footerExpandTrigger" title="Erweiterte Ansicht öffnen">
    <div class="footer-thumb">🎶</div>
    <div class="footer-song-meta">
      <div id="footerSongTitle" class="footer-song-title">Kein Titel ausgewählt</div>
      <div class="footer-song-artist">Schrottkiste</div>
    </div>
  </div>

  <div class="footer-center">
    <div class="footer-controls">
      <button id="footerShuffleBtn" class="footer-ctrl-btn" title="Shuffle an/aus">🔀</button>
      <button id="footerPrevBtn" class="footer-ctrl-btn" title="Vorheriger Song (Zuletzt gespielt)">⏮</button>
      <button id="footerPlayBtn" class="footer-play-btn">▶</button>
      <button id="footerNextBtn" class="footer-ctrl-btn" title="Nächster Song (Skip)">⏭</button>
    </div>
    <div class="footer-progress-wrapper">
      <span id="footerCurrentTime" class="time-info">0:00</span>
      <input type="range" id="footerSeekBar" class="seek-slider" value="0" min="0" max="100" step="0.1">
      <span id="footerTotalTime" class="time-info">0:00</span>
    </div>
  </div>

  <div class="footer-right">
    <div id="volumeControl">
      <span>🔊</span>
      <input type="range" id="volume" min="0" max="1" step="0.01" value="0.5">
    </div>
  </div>
</footer>

<!-- ERWEITERTER PLAYER OVERLAY -->
<div id="expandedPlayerOverlay">
  <div class="expanded-top-bar">
    <button class="expanded-close-btn" id="expandedCloseBtn">✕</button>
  </div>

  <div class="expanded-body">
    <div class="expanded-center-container">
      <div class="expanded-tabs-header">
        <div class="expanded-tab active" data-tab="next">NÄCHSTER TITEL</div>
        <div class="expanded-tab" data-tab="similar">ÄHNLICHE TITEL</div>
      </div>

      <div class="expanded-tab-content active" id="tabContentNext"></div>
      <div class="expanded-tab-content" id="tabContentSimilar"></div>
    </div>
  </div>
</div>

<script>
const username = "Schrottkiste11";
const repo = "e";
const soundContainer = document.getElementById("soundContainer");
const volumeSlider = document.getElementById("volume");
const searchBox = document.getElementById("searchBox");
const playlistCountSpan = document.getElementById("playlistCount");
const sidebarPlaylistLinks = document.getElementById("sidebarPlaylistLinks");
const sidebarNewPlaylistBtn = document.getElementById("sidebarNewPlaylistBtn");

const mobileMenuBtn = document.getElementById("mobileMenuBtn");
const appSidebar = document.querySelector(".app-sidebar");
const sidebarBackdrop = document.getElementById("sidebarBackdrop");

const footerSongTitle = document.getElementById("footerSongTitle");
const footerPlayBtn = document.getElementById("footerPlayBtn");
const footerSeekBar = document.getElementById("footerSeekBar");
const footerCurrentTime = document.getElementById("footerCurrentTime");
const footerTotalTime = document.getElementById("footerTotalTime");
const footerExpandTrigger = document.getElementById("footerExpandTrigger");

const expandedPlayerOverlay = document.getElementById("expandedPlayerOverlay");
const expandedCloseBtn = document.getElementById("expandedCloseBtn");
const tabContentNext = document.getElementById("tabContentNext");
const tabContentSimilar = document.getElementById("tabContentSimilar");

const playlistModalOverlay = document.getElementById("playlistModalOverlay");
const newPlaylistInput = document.getElementById("newPlaylistInput");
const modalCreateBtn = document.getElementById("modalCreateBtn");
const modalCancelBtn = document.getElementById("modalCancelBtn");

const recommendationSection = document.getElementById("recommendationSection");
const recommendationList = document.getElementById("recommendationList");

const footerShuffleBtn = document.getElementById("footerShuffleBtn");
const footerPrevBtn = document.getElementById("footerPrevBtn");
const footerNextBtn = document.getElementById("footerNextBtn");

let globalVolume = parseFloat(localStorage.getItem("soundVolume")) || 0.5;
let currentAudio = null;
let currentSongName = null;
let currentSongObj = null;
let activePlayBtnElement = null;
let isShuffle = false;
let currentCategory = "all";
let searchQuery = "";

// Verlaufshistorie für Zurück- und Vorwärts-Navigation
let songHistory = [];
let forwardHistory = [];

let soundboardPlaylists = JSON.parse(localStorage.getItem("soundboardPlaylists")) || { "Favoriten": [] };
let activePlaylistName = localStorage.getItem("soundboardActivePlaylist") || "Favoriten";
let hasUserSelectedPlaylist = false;

if (!soundboardPlaylists[activePlaylistName]) {
  activePlaylistName = Object.keys(soundboardPlaylists)[0];
}

const categoryMap = {
  "minecraft": ["Sweden", "Wet Hands", "Moog City 2 Minecraft"],
  "animal": ["5 P.M.", "Kapp'n", "Title Screen", "Wild World", "Title Theme"],
  "series": ["Cosmo", "Ducktales", "Gravity Falls", "Kim Possible", "Lauras", "LazyTown", "Phineas", "Spongebob", "Scooby", "Zoés", "ALF"],
  "littlebigplanet": ["LittleBigPlanet", "Victoria", "Gardens", "Wedding", "Wilderness"],
  "speedy": ["Speedy", "Eggbert", "Adventure", "Intro", "Level"],
  "lifeisstrange": ["Life is Strange", "LIS"],
  "other": ["8 Bit", "AU SCHWARTE", "alf theme"]
};

let allSongs = [];

// Mobile Menu Toggle
mobileMenuBtn.onclick = () => {
  appSidebar.classList.toggle("mobile-open");
  sidebarBackdrop.classList.toggle("show");
};

sidebarBackdrop.onclick = () => {
  appSidebar.classList.remove("mobile-open");
  sidebarBackdrop.classList.remove("show");
};

async function loadSounds() {
  try {
    const response = await fetch(`https://api.github.com/repos/${username}/${repo}/contents/`);
    const files = await response.json();
    const mp3Files = files.filter(f => f.name.toLowerCase().endsWith(".mp3") || f.name.toLowerCase().endsWith(".wav"));
    allSongs = mp3Files.map(file => ({
      name: file.name.replace(/\.[^/.]+$/, ""),
      url: `https://raw.githubusercontent.com/${username}/${repo}/main/${encodeURIComponent(file.name)}`
    }));
    updateSidebarPlaylists();
    updatePlaylistCount();
    renderList();
  } catch {
    soundContainer.innerHTML = "Fehler beim Laden 😢";
  }
}

function savePlaylists() {
  localStorage.setItem("soundboardPlaylists", JSON.stringify(soundboardPlaylists));
  localStorage.setItem("soundboardActivePlaylist", activePlaylistName);
}

function updateSidebarPlaylists() {
  sidebarPlaylistLinks.innerHTML = "";
  for (const plName of Object.keys(soundboardPlaylists)) {
    const link = document.createElement("div");
    
    const isActive = hasUserSelectedPlaylist && (plName === activePlaylistName);
    link.className = `sidebar-playlist-item ${isActive ? 'active-pl' : ''}`;
    
    link.innerHTML = `
      <span>🎵 ${plName}</span> 
      <div style="display:flex; align-items:center; gap:8px;">
        <span style="font-size:0.8rem; opacity:0.7;">(${soundboardPlaylists[plName].length})</span>
        <span class="sidebar-del-btn" title="Playlist löschen" style="font-size:0.8rem;">🗑️</span>
      </div>
    `;
    
    const delBtn = link.querySelector(".sidebar-del-btn");
    delBtn.onclick = (ev) => {
      ev.stopPropagation();
      const keys = Object.keys(soundboardPlaylists);
      if (keys.length <= 1) {
        alert("Du musst mindestens eine Playlist behalten! 🛑");
        return;
      }
      if (confirm(`Möchtest du die Playlist "${plName}" wirklich löschen? 🗑️`)) {
        delete soundboardPlaylists[plName];
        if (activePlaylistName === plName) {
          activePlaylistName = Object.keys(soundboardPlaylists)[0];
          hasUserSelectedPlaylist = false;
        }
        savePlaylists();
        updateSidebarPlaylists();
        updatePlaylistCount();
        renderList();
      }
    };
    
    link.onclick = () => {
      activePlaylistName = plName;
      hasUserSelectedPlaylist = true;
      savePlaylists();
      
      document.querySelectorAll(".nav-item").forEach(n => {
        if (n.dataset.cat === "playlist") n.classList.add("active");
        else n.classList.remove("active");
      });

      updateSidebarPlaylists();
      updatePlaylistCount();
      renderList();

      appSidebar.classList.remove("mobile-open");
      sidebarBackdrop.classList.remove("show");
    };
    sidebarPlaylistLinks.appendChild(link);
  }
}

function updatePlaylistCount() {
  const currentList = soundboardPlaylists[activePlaylistName] || [];
  playlistCountSpan.textContent = currentList.length;
  savePlaylists();
  updateSidebarPlaylists();
}

sidebarNewPlaylistBtn.onclick = () => {
  newPlaylistInput.value = "";
  playlistModalOverlay.style.display = "flex";
  newPlaylistInput.focus();
};

modalCancelBtn.onclick = () => {
  playlistModalOverlay.style.display = "none";
};

modalCreateBtn.onclick = () => {
  const name = newPlaylistInput.value.trim();
  if (name !== "") {
    if (soundboardPlaylists[name]) {
      alert("Diese Playlist existiert bereits! ⚠️");
      return;
    }
    soundboardPlaylists[name] = [];
    activePlaylistName = name;
    hasUserSelectedPlaylist = true;
    savePlaylists();
    
    document.querySelectorAll(".nav-item").forEach(n => {
      if (n.dataset.cat === "playlist") n.classList.add("active");
      else n.classList.remove("active");
    });

    updateSidebarPlaylists();
    updatePlaylistCount();
    renderList();
    playlistModalOverlay.style.display = "none";
  }
};

newPlaylistInput.onkeydown = (e) => {
  if (e.key === "Enter") modalCreateBtn.click();
};

function formatTime(seconds) {
  const mins = Math.floor(seconds / 60);
  const secs = Math.floor(seconds % 60);
  return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
}

function getCurrentListForPlayback() {
  if (currentCategory === "playlist") {
    const activePlSongs = soundboardPlaylists[activePlaylistName] || [];
    const filtered = allSongs.filter(s => activePlSongs.includes(s.name));
    return filtered.length > 0 ? filtered : allSongs;
  }
  return allSongs;
}

function playNextSong() {
  // Wenn es einen Vorwärts-Verlauf gibt (weil man vorher zurückgeklickt hat), diesen bedienen
  if (forwardHistory.length > 0) {
    if (currentSongObj) {
      songHistory.push(currentSongObj);
    }
    const nextSong = forwardHistory.pop();
    playSong(nextSong, null, true);
    return;
  }

  const list = getCurrentListForPlayback();
  if (list.length === 0) return;

  let nextSong;
  if (isShuffle) {
    let pool = list.filter(s => s.name !== currentSongName);
    if (pool.length === 0) pool = list;
    nextSong = pool[Math.floor(Math.random() * pool.length)];
  } else {
    const currentIndex = list.findIndex(s => s.name === currentSongName);
    const nextIndex = (currentIndex + 1) % list.length;
    nextSong = list[nextIndex];
  }
  playSong(nextSong, null);
}

function playPrevSong() {
  if (songHistory.length === 0) return;

  // Aktuellen Song in den Vorwärts-Verlauf schieben
  if (currentSongObj) {
    forwardHistory.push(currentSongObj);
  }

  const prevSong = songHistory.pop();
  playSong(prevSong, null, true);
}

function playSong(song, btnElement, isNavigation = false) {
  if (currentSongName === song.name && currentAudio && !isNavigation) {
    if (currentAudio.paused) {
      currentAudio.play();
      if (btnElement) { btnElement.textContent = "⏸"; btnElement.classList.add("playing"); }
      footerPlayBtn.textContent = "⏸";
    } else {
      currentAudio.pause();
      if (btnElement) { btnElement.textContent = "▶"; btnElement.classList.remove("playing"); }
      footerPlayBtn.textContent = "▶";
    }
    return;
  }

  if (currentAudio) {
    currentAudio.pause();
    currentAudio.currentTime = 0;
  }

  if (activePlayBtnElement) {
    activePlayBtnElement.textContent = "▶";
    activePlayBtnElement.classList.remove("playing");
  }

  // Historie verwalten bei neuer Song-Wahl (außer bei Direkt-Navigation per Zurück/Vor)
  if (!isNavigation) {
    if (currentSongObj) {
      songHistory.push(currentSongObj);
    }
    forwardHistory = []; // Vorwärts-Verlauf bei neuer Song-Auswahl leeren
  }

  const audio = new Audio(song.url);
  audio.volume = globalVolume;
  currentAudio = audio;
  currentSongName = song.name;
  currentSongObj = song;
  activePlayBtnElement = btnElement || null;

  footerSongTitle.textContent = song.name;
  footerPlayBtn.textContent = "⏸";
  if (btnElement) {
    btnElement.textContent = "⏸";
    btnElement.classList.add("playing");
  }

  audio.play();
  updateRecommendations(song.name);
  updateExpandedViews(song.name);
  renderList();

  audio.ontimeupdate = () => {
    if (audio.duration) {
      const percent = (audio.currentTime / audio.duration) * 100;
      footerSeekBar.value = percent;
      footerCurrentTime.textContent = formatTime(audio.currentTime);
      footerTotalTime.textContent = formatTime(audio.duration);
    }
  };

  audio.onended = () => {
    if (btnElement) {
      btnElement.textContent = "▶";
      btnElement.classList.remove("playing");
    }
    footerPlayBtn.textContent = "▶";
    footerSeekBar.value = 0;
    footerCurrentTime.textContent = "0:00";
    footerTotalTime.textContent = "0:00";
    renderList();
    playNextSong();
  };
}

function updateExpandedViews(songName) {
  tabContentNext.innerHTML = "";
  const currentList = soundboardPlaylists[activePlaylistName] || allSongs;
  const targetSongs = currentList.length > 0 ? allSongs.filter(s => currentList.includes(s.name)) : allSongs;
  
  targetSongs.forEach(s => {
    const item = document.createElement("div");
    item.className = "queue-item-exp";
    const isPlayingThis = (currentSongName === s.name && currentAudio && !currentAudio.paused);
    
    item.innerHTML = `
      <div style="display:flex; align-items:center; gap:10px; min-width:0; flex:1;">
        <button class="play-btn" style="width:30px; height:30px; font-size:0.8rem;">${isPlayingThis ? '⏸' : '▶'}</button>
        <span style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">🎵 ${s.name}</span>
      </div>
      <span style="font-size:0.8rem; color:var(--text-muted); flex-shrink:0; margin-left:10px;">Schrottkiste</span>
    `;
    
    const playBtn = item.querySelector(".play-btn");
    playBtn.onclick = () => {
      playSong(s, playBtn);
      updateExpandedViews(songName);
    };
    tabContentNext.appendChild(item);
  });

  tabContentSimilar.innerHTML = "";
  const shuffled = allSongs.filter(s => s.name !== songName).sort(() => 0.5 - Math.random()).slice(0, 5);
  shuffled.forEach(s => {
    const item = document.createElement("div");
    item.className = "queue-item-exp";
    const isPlayingThis = (currentSongName === s.name && currentAudio && !currentAudio.paused);

    item.innerHTML = `
      <div style="display:flex; align-items:center; gap:10px; min-width:0; flex:1;">
        <button class="play-btn" style="width:30px; height:30px; font-size:0.8rem;">${isPlayingThis ? '⏸' : '▶'}</button>
        <span style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">⚡ ${s.name}</span>
      </div>
      <span style="font-size:0.8rem; color:var(--accent-alt); flex-shrink:0; margin-left:10px;">Empfohlen</span>
    `;

    const playBtn = item.querySelector(".play-btn");
    playBtn.onclick = () => {
      playSong(s, playBtn);
      updateExpandedViews(songName);
    };
    tabContentSimilar.appendChild(item);
  });
}

function updateRecommendations(currentSongName) {
  if (allSongs.length <= 1) {
    recommendationSection.style.display = "none";
    return;
  }

  let pool = allSongs.filter(s => s.name !== currentSongName);
  
  let currentCategoryKey = null;
  for (const [catKey, keywords] of Object.entries(categoryMap)) {
    if (keywords.some(k => currentSongName.toLowerCase().includes(k.toLowerCase()))) {
      currentCategoryKey = catKey;
      break;
    }
  }

  if (currentCategoryKey) {
    const sameCat = pool.filter(s => categoryMap[currentCategoryKey].some(k => s.name.toLowerCase().includes(k.toLowerCase())));
    if (sameCat.length >= 3) pool = sameCat;
  }

  const shuffled = pool.sort(() => 0.5 - Math.random());
  const recommendations = shuffled.slice(0, 3);

  recommendationSection.style.display = "block";
  recommendationList.innerHTML = "";
  recommendations.forEach(recSong => {
    const currentList = soundboardPlaylists[activePlaylistName] || [];
    const isAdded = currentList.includes(recSong.name);
    const isPlayingThis = (currentSongName === recSong.name && currentAudio && !currentAudio.paused);

    const card = document.createElement("div");
    card.className = "rec-card";
    card.innerHTML = `
      <div class="rec-info-group" style="min-width:0; flex:1;">
        <button class="play-btn" style="width:30px; height:30px; font-size:0.8rem;">${isPlayingThis ? '⏸' : '▶'}</button>
        <div class="rec-song-title" style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">🎵 ${recSong.name}</div>
      </div>
      <div class="rec-actions">
        <button class="rec-add-btn ${isAdded ? 'added' : ''}">${isAdded ? '✓ In' : '+ Playlist'}</button>
      </div>
    `;

    const playBtn = card.querySelector(".play-btn");
    playBtn.onclick = () => playSong(recSong, playBtn);

    const addBtn = card.querySelector(".rec-add-btn");
    addBtn.onclick = () => {
      const list = soundboardPlaylists[activePlaylistName];
      const idx = list.indexOf(recSong.name);
      if (idx > -1) {
        list.splice(idx, 1);
        addBtn.textContent = "+ Playlist";
        addBtn.classList.remove("added");
      } else {
        list.push(recSong.name);
        addBtn.textContent = "✓ In";
        addBtn.classList.add("added");
      }
      savePlaylists();
      updatePlaylistCount();
      renderList();
    };

    recommendationList.appendChild(card);
  });
}

searchBox.oninput = (e) => {
  searchQuery = e.target.value.toLowerCase();
  renderList();
};

document.querySelectorAll(".nav-item").forEach(item => {
  item.onclick = () => {
    document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));
    item.classList.add("active");
    currentCategory = item.dataset.cat;
    if (currentCategory === "playlist") {
      hasUserSelectedPlaylist = true;
      updateSidebarPlaylists();
    }
    renderList();
  };
});

function renderList() {
  soundContainer.innerHTML = "";
  let listToRender = allSongs;

  if (currentCategory === "playlist") {
    const activePlSongs = soundboardPlaylists[activePlaylistName] || [];
    listToRender = allSongs.filter(s => activePlSongs.includes(s.name));
  } else if (currentCategory !== "all") {
    const keywords = categoryMap[currentCategory] || [];
    listToRender = allSongs.filter(s => keywords.some(k => s.name.toLowerCase().includes(k.toLowerCase())));
  }

  if (searchQuery) {
    listToRender = listToRender.filter(s => s.name.toLowerCase().includes(searchQuery));
  }

  if (listToRender.length === 0) {
    soundContainer.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 40px;">Keine Sounds gefunden 😢</div>`;
    return;
  }

  listToRender.forEach(song => {
    const soundItem = document.createElement("div");
    soundItem.className = "sound-item";
    
    const isPlayingThis = (currentSongName === song.name && currentAudio && !currentAudio.paused);
    const currentPlSongs = soundboardPlaylists[activePlaylistName] || [];
    const isInActivePl = currentPlSongs.includes(song.name);

    soundItem.innerHTML = `
      <button class="play-btn ${isPlayingThis ? 'playing' : ''}">${isPlayingThis ? '⏸' : '▶'}</button>
      <div class="sound-details">
        <div class="sound-title">🎵 ${song.name}</div>
        <div class="sound-subtitle">Schrottkiste • Audio-Datei</div>
      </div>
      <div class="playlist-menu-wrapper">
        <button class="playlist-menu-btn ${isInActivePl ? 'has-playlist' : ''}" title="Zu Playlist hinzufügen">⭐</button>
        <div class="playlist-dropdown">
          <div style="font-size:0.8rem; color:var(--text-muted); padding:4px 8px; border-bottom:1px solid var(--border-color); margin-bottom:4px;">Zu Playlist hinzufügen:</div>
          ${Object.keys(soundboardPlaylists).map(plName => {
            const inPl = (soundboardPlaylists[plName] || []).includes(song.name);
            return `<div class="dropdown-item ${inPl ? 'in-pl' : ''}" data-pl="${plName}">
                      <span>${plName}</span>
                      <span>${inPl ? '✓' : '+'}</span>
                    </div>`;
          }).join('')}
        </div>
      </div>
    `;

    const playBtn = soundItem.querySelector(".play-btn");
    playBtn.onclick = () => playSong(song, playBtn);

    const menuBtn = soundItem.querySelector(".playlist-menu-btn");
    const dropdown = soundItem.querySelector(".playlist-dropdown");

    menuBtn.onclick = (e) => {
      e.stopPropagation();
      document.querySelectorAll(".playlist-dropdown").forEach(d => {
        if (d !== dropdown) d.classList.remove("show");
      });
      dropdown.classList.toggle("show");
    };

    dropdown.querySelectorAll(".dropdown-item").forEach(item => {
      item.onclick = (e) => {
        e.stopPropagation();
        const plName = item.dataset.pl;
        const index = soundboardPlaylists[plName].indexOf(song.name);
        if (index > -1) {
          soundboardPlaylists[plName].splice(index, 1);
        } else {
          soundboardPlaylists[plName].push(song.name);
        }
        savePlaylists();
        updatePlaylistCount();
        renderList();
        dropdown.classList.remove("show");
      };
    });

    soundContainer.appendChild(soundItem);
  });
}

window.onclick = () => {
  document.querySelectorAll(".playlist-dropdown").forEach(d => d.classList.remove("show"));
};

volumeSlider.oninput = (e) => {
  globalVolume = parseFloat(e.target.value);
  localStorage.setItem("soundVolume", globalVolume);
  if (currentAudio) currentAudio.volume = globalVolume;
};
volumeSlider.value = globalVolume;

footerSeekBar.oninput = (e) => {
  if (currentAudio && currentAudio.duration) {
    const time = (e.target.value / 100) * currentAudio.duration;
    currentAudio.currentTime = time;
  }
};

footerPlayBtn.onclick = () => {
  if (!currentAudio && allSongs.length > 0) {
    playSong(allSongs[0], null);
    return;
  }
  if (currentAudio) {
    if (currentAudio.paused) {
      currentAudio.play();
      footerPlayBtn.textContent = "⏸";
      if (activePlayBtnElement) {
        activePlayBtnElement.textContent = "⏸";
        activePlayBtnElement.classList.add("playing");
      }
    } else {
      currentAudio.pause();
      footerPlayBtn.textContent = "▶";
      if (activePlayBtnElement) {
        activePlayBtnElement.textContent = "▶";
        activePlayBtnElement.classList.remove("playing");
      }
    }
  }
};

footerShuffleBtn.onclick = () => {
  isShuffle = !isShuffle;
  footerShuffleBtn.classList.toggle("active", isShuffle);
};

footerNextBtn.onclick = () => playNextSong();
footerPrevBtn.onclick = () => playPrevSong();

footerExpandTrigger.onclick = () => {
  expandedPlayerOverlay.style.display = "flex";
  if (currentSongName) updateExpandedViews(currentSongName);
};

expandedCloseBtn.onclick = () => {
  expandedPlayerOverlay.style.display = "none";
};

document.querySelectorAll(".expanded-tab").forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll(".expanded-tab").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".expanded-tab-content").forEach(c => c.classList.remove("active"));
    tab.classList.add("active");
    const target = tab.dataset.tab === "next" ? tabContentNext : tabContentSimilar;
    target.classList.add("active");
  };
});

loadSounds();
</script>

</body>
</html>
