<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Soundboard – Schrottkiste</title>

<link href="https://fonts.googleapis.com/css2?family=Chewy&family=Poppins:wght@300;400;600&family=VT323&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-main: #1a1a24;
    --bg-deep: #101014;
    --text-main: #f3f1ff;
    --accent: #ff0099;
    --accent-alt: #00ffff;
    --card-soft: rgba(36, 36, 48, 0.96);
  }

  body {
    background: linear-gradient(to bottom, var(--bg-main), var(--bg-deep));
    font-family: 'Poppins', sans-serif;
    color: var(--text-main);
    margin: 0;
    padding-top: 100px;
    padding-bottom: 90px;
    text-align: center;
  }

  /* --- SIDEBAR STYLING --- */
  #menuToggle { display: none; }
  .hamburger-btn {
    position: fixed; top: 20px; left: 20px; z-index: 20000;
    background: var(--accent); border: 2px solid #fff;
    border-radius: 4px; color: #fff; font-size: 20px;
    padding: 8px 14px; cursor: pointer;
    box-shadow: 4px 4px 0px var(--accent-alt);
    font-family: 'VT323', monospace;
  }

  .custom-sidebar {
    position: fixed; top: 0; left: 0; width: 280px; height: 100vh;
    background: #111; border-right: 4px solid var(--accent);
    transform: translateX(-100%); transition: 0.4s;
    padding-top: 100px; z-index: 9000;
  }
  #menuToggle:checked ~ .custom-sidebar { transform: translateX(0); }

  .custom-sidebar nav { display: flex; flex-direction: column; gap: 15px; padding: 0 25px; }
  .custom-sidebar nav a {
    color: #fff; text-decoration: none; font-size: 1.8rem; font-family: 'VT323', monospace;
    padding: 10px; border: 1px solid #333; transition: 0.1s;
  }
  .custom-sidebar nav a:hover { background: var(--accent-alt); color: #000; transform: translateX(10px); }

  /* --- SOUNDBOARD DESIGN --- */
  h1 { font-family: 'Chewy', cursive; color: #fff; text-shadow: 4px 4px 0px var(--accent); font-size: 3.5rem; }

  #searchBox {
    margin: 20px auto; width: 80%; max-width: 400px; padding: 12px 20px;
    border-radius: 25px; border: 2px solid var(--accent);
    background: var(--bg-deep); color: white; font-family: 'VT323', monospace; font-size: 1.2rem;
  }

  .filter-bar {
    display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-bottom: 30px;
  }
  .nav-item {
    color: var(--text-main); font-family: 'VT323', monospace; font-size: 1.2rem;
    cursor: pointer; padding: 5px 15px; border: 1px solid #444; border-radius: 6px;
  }
  .nav-item.active, .nav-item:hover { color: var(--accent-alt); border-color: var(--accent-alt); }

  #soundContainer { max-width: 900px; margin: 40px auto; padding: 20px; }
  
  .sound-item {
    background: var(--card-soft); border-radius: 16px; padding: 15px;
    margin: 10px; display: flex; align-items: center; gap: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  }
  
  .play-btn {
    background: #000; border: 2px solid var(--accent-alt); color: #fff;
    width: 44px; height: 44px; border-radius: 50%; cursor: pointer;
  }
  .play-btn.playing { background: var(--accent); }

  #volumeControl {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: rgba(26, 26, 36, 0.9); padding: 10px 20px; border-radius: 10px; z-index: 999;
  }
</style>
</head>

<body>

<input type="checkbox" id="menuToggle" hidden>
<label for="menuToggle" class="hamburger-btn">☰ Menü</label>

<aside class="custom-sidebar">
  <nav>
    <a href="index.html">Startseite</a>
    <a href="ideen.html">Content-Plan</a>
  </nav>
</aside>

<h1>Nostalgie Soundboard ⚡</h1>

<input type="text" id="searchBox" placeholder="🔍 Suche..." />

<div class="filter-bar">
  <div class="nav-item active" data-cat="all">🌐 Alle</div>
  <div class="nav-item" data-cat="minecraft">🎮 Minecraft</div>
  <div class="nav-item" data-cat="animal">🌿 Animal Crossing</div>
  <div class="nav-item" data-cat="series">📺 Serien</div>
  <div class="nav-item" data-cat="littlebigplanet">🧵 LBP</div>
  <div class="nav-item" data-cat="speedy">🐣 Speedy</div>
  <div class="nav-item" data-cat="lifeisstrange">🦋 LIS</div>
</div>

<div id="soundContainer">Lade Sounds...</div>

<div id="volumeControl">
  <label style="font-family:'VT323'; color:var(--accent-alt);">🔊 LAUTSTÄRKE:</label>
  <input type="range" id="volume" min="0" max="1" step="0.01" value="0.5">
</div>

<script>
const username = "Schrottkiste11";
const repo = "e";
const soundContainer = document.getElementById("soundContainer");
const volumeSlider = document.getElementById("volume");
const searchBox = document.getElementById("searchBox");

let globalVolume = parseFloat(localStorage.getItem("soundVolume")) || 0.5;
let currentAudio = null;
let currentButton = null;

const categoryMap = {
  "minecraft": ["Sweden", "Wet Hands", "Moog City 2 Minecraft"],
  "animal": ["5 P.M.", "Kapp'n", "Title Screen", "Wild World", "Title Theme"],
  "series": ["Cosmo", "Ducktales", "Gravity Falls", "Kim Possible", "Lauras", "LazyTown", "Phineas", "Spongebob", "Scooby", "Zoés", "ALF"],
  "littlebigplanet": ["LittleBigPlanet", "Victoria", "Gardens", "Wedding", "Wilderness"],
  "speedy": ["Speedy", "Eggbert", "Adventure", "Intro", "Level"],
  "lifeisstrange": ["Life is Strange", "LIS"],
  "other": ["8 Bit", "AU SCHWARTE", "alf theme"]
};

let allSongs = [];

async function loadSounds() {
  try {
    const response = await fetch(`https://api.github.com/repos/${username}/${repo}/contents/`);
    const files = await response.json();
    const mp3Files = files.filter(f => f.name.toLowerCase().endsWith(".mp3") || f.name.toLowerCase().endsWith(".wav"));
    allSongs = mp3Files.map(file => ({
      name: file.name.replace(/\.[^/.]+$/, ""),
      url: `https://raw.githubusercontent.com/${username}/${repo}/main/${encodeURIComponent(file.name)}`
    }));
    renderList();
  } catch {
    soundContainer.innerHTML = "Fehler beim Laden 😢";
  }
}

function renderList() {
  const activeNavItem = document.querySelector(".nav-item.active");
  const activeCat = activeNavItem ? activeNavItem.dataset.cat : "all";
  const searchTerm = searchBox.value.toLowerCase();

  let songs = (activeCat === "all") ? allSongs : allSongs.filter(s => categoryMap[activeCat].some(k => s.name.toLowerCase().includes(k.toLowerCase())));
  if (searchTerm) songs = songs.filter(s => s.name.toLowerCase().includes(searchTerm));

  soundContainer.innerHTML = "";
  songs.forEach(song => {
    const item = document.createElement("div");
    item.className = "sound-item";
    item.innerHTML = `<button class="play-btn">▶</button><div class="sound-title">${song.name}</div>`;
    const btn = item.querySelector("button");
    const audio = new Audio(song.url);
    
    btn.onclick = () => {
      if (currentAudio && currentAudio !== audio) { currentAudio.pause(); currentAudio.currentTime = 0; currentButton.classList.remove("playing"); currentButton.textContent = "▶"; }
      if (audio.paused) { audio.volume = globalVolume; audio.play(); btn.textContent = "⏸"; btn.classList.add("playing"); currentAudio = audio; currentButton = btn; }
      else { audio.pause(); audio.currentTime = 0; btn.textContent = "▶"; btn.classList.remove("playing"); }
    };
    soundContainer.appendChild(item);
  });
}

volumeSlider.oninput = () => { globalVolume = volumeSlider.value; localStorage.setItem("soundVolume", globalVolume); if(currentAudio) currentAudio.volume = globalVolume; };
searchBox.oninput = renderList;
document.querySelectorAll(".nav-item").forEach(nav => nav.onclick = () => {
  document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));
  nav.classList.add("active");
  renderList();
});

loadSounds();
</script>

</body>
</html>
