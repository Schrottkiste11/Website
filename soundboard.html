<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Soundboard – Schrottkiste</title>

<link href="https://fonts.googleapis.com/css2?family=Chewy&family=Poppins:wght@300;400;600&family=VT323&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-main: #1a1a24;
    --bg-top: #242430;
    --bg-deep: #101014;

    --text-main: #f3f1ff;

    --accent: #ff0099;
    --accent-alt: #00ffff;

    --card: #242430;
    --card-soft: rgba(36, 36, 48, 0.96);

    --border-soft: rgba(255, 0, 153, 0.3);
  }

  body {
    background: radial-gradient(circle at top, var(--bg-top) 0%, var(--bg-main) 55%, var(--bg-deep) 100%);
    font-family: 'Poppins', sans-serif;
    color: var(--text-main);
    margin: 0;
    padding-top: 110px;
    padding-bottom: 90px;
    text-align: center;
  }

  h1 {
    font-family: 'Chewy', cursive;
    color: #fff;
    text-shadow: 4px 4px 0px var(--accent);
    font-size: 3.5rem;
  }

  /* =====================
        NAVBAR / SIDEBAR
     ===================== */
  #menuToggle {
    display: none;
  }

  .hamburger-btn {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 10000;
    background: #000;
    border: 2px solid var(--accent-alt);
    box-shadow: 4px 4px 0px var(--accent-alt);
    border-radius: 8px;
    color: #fff;
    font-size: 24px;
    padding: 6px 14px;
    cursor: pointer;
    transition: 0.2s ease;
  }

  .hamburger-btn:hover {
    transform: translate(-2px, -2px);
    box-shadow: 6px 6px 0px var(--accent);
    background: var(--accent-alt);
    color: #000;
  }

  .custom-sidebar {
    position: fixed;
    top: 0;
    left: 0;
    width: 250px;
    height: 100vh;
    background: linear-gradient(160deg, rgba(26,26,36,0.98), rgba(16,16,20,0.99));
    border-right: 3px solid var(--accent);
    box-shadow: 18px 0 40px rgba(0,0,0,0.5);
    backdrop-filter: blur(14px);
    transform: translateX(-100%);
    transition: transform 0.35s ease;
    padding-top: 80px;
    z-index: 9000;
  }

  #menuToggle:checked ~ .custom-sidebar {
    transform: translateX(0);
  }

  #menuToggle:checked + .hamburger-btn {
    left: 260px;
  }

  .custom-sidebar nav {
    display: flex;
    flex-direction: column;
    gap: 18px;
    padding: 0 18px 24px;
  }

  .custom-sidebar nav a {
    color: #fff;
    font-family: 'VT323', monospace;
    text-decoration: none;
    font-size: 1.6rem;
    padding: 6px 12px;
    transition: 0.2s ease;
    border-radius: 8px;
    text-align: left;
  }

  .custom-sidebar nav a:hover {
    transform: translateX(6px);
    background: rgba(0, 255, 255, 0.1);
    color: var(--accent-alt);
  }

  /* NAVBAR (KATEGORIEN) */
  #navbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    background: rgba(26, 26, 36, 0.96);
    backdrop-filter: blur(14px);
    border-bottom: 3px solid var(--accent);
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px 16px;
    padding: 12px 20px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    z-index: 1000;
  }

  .nav-item {
    color: var(--text-main);
    font-family: 'VT323', monospace;
    font-size: 1.3rem;
    text-decoration: none;
    cursor: pointer;
    padding: 2px 8px;
    transition: all 0.2s ease;
    position: relative;
    border-radius: 6px;
    white-space: nowrap;
  }

  .nav-item::after {
    content: "";
    position: absolute;
    bottom: -2px; left: 50%;
    width: 0%;
    height: 2px;
    background: var(--accent-alt);
    box-shadow: 0 0 12px var(--accent-alt);
    transition: width 0.28s ease, left 0.28s ease;
  }

  .nav-item.active,
  .nav-item:hover {
    background: rgba(0, 255, 255, 0.08);
    color: var(--accent-alt);
  }

  .nav-item.active::after,
  .nav-item:hover::after {
    width: 100%;
    left: 0;
  }

  /* TIMELINE SOUND LIST */
  #soundContainer {
    position: relative;
    max-width: 900px;
    margin: 40px auto;
    padding: 20px 10px;
  }

  #soundContainer::before {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: 50%;
    width: 3px;
    background: linear-gradient(
      180deg,
      rgba(255, 0, 153, 0.2),
      var(--accent-alt),
      rgba(255, 0, 153, 0.2)
    );
    box-shadow: 0 0 14px var(--accent-alt);
    border-radius: 999px;
    pointer-events: none;
  }

  .sound-item {
    position: relative;
    display: flex;
    align-items: center;
    gap: 15px;
    background: var(--card-soft);
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-radius: 16px;
    padding: 14px 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    backdrop-filter: blur(10px);
    transition: all 0.18s ease;
    width: 48%;
    margin: 25px 0;
  }

  .sound-item::before {
    content: "";
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--bg-main);
    border: 3px solid var(--accent-alt);
    box-shadow: 0 0 12px var(--accent-alt);
  }

  .sound-item.left {
    margin-right: auto;
    flex-direction: row-reverse;
    text-align: right;
  }

  .sound-item.left::before {
    right: -31px;
  }

  .sound-item.right {
    margin-left: auto;
    text-align: left;
  }

  .sound-item.right::before {
    left: -31px;
  }

  .sound-item:hover {
    border-color: var(--accent);
    box-shadow: 0 16px 34px rgba(0,0,0,0.4), 0 0 16px rgba(255, 0, 153, 0.2);
    transform: translateY(-2px);
  }

  .sound-title {
    font-family: 'VT323', monospace;
    font-size: 1.6rem;
    text-align: inherit;
    flex-grow: 1;
    word-break: break-word;
    color: #fff;
  }

  .play-btn {
    background: #000;
    border: 2px solid var(--accent-alt);
    border-radius: 50%;
    color: #fff;
    width: 44px;
    height: 44px;
    font-size: 1.1rem;
    cursor: pointer;
    transition: all 0.2s;
    flex-shrink: 0;
    box-shadow: 4px 4px 0px var(--accent-alt);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .play-btn:hover {
    transform: scale(1.05);
    background: var(--accent-alt);
    color: #000;
    box-shadow: 4px 4px 0px var(--accent);
  }

  .play-btn.playing {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    box-shadow: 0 0 15px var(--accent);
    animation: pulseGlow 1s infinite alternate;
  }

  @keyframes pulseGlow {
    0% { transform: scale(1); filter: drop-shadow(0 0 2px var(--accent)); }
    100% { transform: scale(1.05); filter: drop-shadow(0 0 12px var(--accent)); }
  }

  /* VOLUME CONTROL — schwebt fixiert am unteren Bildschirmrand */
  #volumeControl {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 15px;
    background: rgba(26, 26, 36, 0.92);
    border: 2px dashed var(--accent-alt);
    border-radius: 10px;
    padding: 12px 25px;
    width: fit-content;
    backdrop-filter: blur(14px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    z-index: 999;
  }

  #volumeControl label {
    font-family: 'VT323', monospace;
    font-size: 1.4rem;
    color: var(--accent-alt);
  }

  input[type="range"] {
    -webkit-appearance: none;
    width: 240px;
    height: 10px;
    border-radius: 999px;
    background: linear-gradient(90deg, #101018, #242430);
    outline: none;
    box-shadow: inset 0 0 6px rgba(0,0,0,0.5);
    accent-color: var(--accent-alt);
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 20px;
    height: 20px;
    background: #f3f1ff;
    border-radius: 50%;
    border: 1px solid rgba(0,0,0,0.45);
    box-shadow: 0 0 8px rgba(0,0,0,0.8);
    cursor: pointer;
  }

  /* Mobile Layout */
  @media (max-width: 768px) {
    body { padding-top: 140px; }
    
    #soundContainer {
      padding-left: 32px;
    }

    #soundContainer::before {
      left: 18px;
    }

    .sound-item {
      width: 100%;
      margin: 18px 0;
      flex-direction: row;
      text-align: left;
    }

    .sound-item::before {
      left: -24px;
      right: auto;
    }

    .sound-item.left,
    .sound-item.right {
      margin-left: 0;
      margin-right: 0;
    }

    #volumeControl {
      width: calc(100% - 40px);
      padding: 10px 16px;
    }

    input[type="range"] {
      width: 100%;
    }
  }
</style>
</head>

<body>

<input type="checkbox" id="menuToggle" hidden>
<label for="menuToggle" class="hamburger-btn">☰</label>

<div class="custom-sidebar">
  <nav>
    <a href="index.html">🏠 Startseite</a>
    <a href="ideen.html">💡 Ideen Liste</a>
    <a href="soundboard.html">🎵 Soundboard</a>
    <a href="radio.html">📻 Radioplayer</a>
    <a href="config.html">⚙️ Einstellungen</a>
  </nav>
</div>

<div id="navbar">
  <div class="nav-item active" data-cat="all">🌐 Alle</div>
  <div class="nav-item" data-cat="minecraft">🎮 Minecraft</div>
  <div class="nav-item" data-cat="animal">🌿 Animal Crossing</div>
  <div class="nav-item" data-cat="series">📺 Serien & Intros</div>
  <div class="nav-item" data-cat="littlebigplanet">🧵 LittleBigPlanet</div>
  <div class="nav-item" data-cat="speedy">🐣 Speedy Eggbert</div>
  <div class="nav-item" data-cat="lifeisstrange">🦋 Life is Strange</div>
  <div class="nav-item" data-cat="other">🎵 Sonstiges</div>
</div>

<h1 style="margin-top: 40px;">Nostalgie Soundboard ⚡</h1>
<div id="soundContainer">Lade Sounds...</div>

<div id="volumeControl">
  <label for="volume">🔊 LAUTSTÄRKE:</label>
  <input type="range" id="volume" min="0" max="1" step="0.01" value="0.5">
</div>

<script>
const username = "Schrottkiste11";
const repo = "e";

const soundContainer = document.getElementById("soundContainer");
const volumeSlider = document.getElementById("volume");

let globalVolume = parseFloat(localStorage.getItem("soundVolume")) || 0.5;
let currentAudio = null;
let currentButton = null;

volumeSlider.value = globalVolume;

const categoryMap = {
  "minecraft": ["Sweden", "Wet Hands", "Moog City 2 Minecraft"],
  "animal": ["5 P.M.", "Kapp'n", "Title Screen", "Wild World", "Title Theme"],
  "series": ["Cosmo", "Ducktales", "Gravity Falls", "Kim Possible", "Lauras", "LazyTown", "Phineas", "Spongebob", "Scooby", "Zoés", "ALF"],
  "littlebigplanet": ["LittleBigPlanet", "Victoria", "Gardens", "Wedding", "Wilderness"],
  "speedy": ["Speedy", "Eggbert", "Adventure", "Intro", "Level"],
  "lifeisstrange": ["Life is Strange", "LIS"],
  "other": ["8 Bit", "AU SCHWARTE", "alf theme"]
};

let allSongs = [];

async function loadSounds() {
  try {
    const response = await fetch(`https://api.github.com/repos/${username}/${repo}/contents/`);
    const files = await response.json();

    const mp3Files = files.filter(f =>
      f.name.toLowerCase().endsWith(".mp3") || f.name.toLowerCase().endsWith(".wav")
    );

    allSongs = mp3Files.map(file => ({
      name: file.name.replace(/\.[^/.]+$/, ""),
      url: `https://raw.githubusercontent.com/${username}/${repo}/main/${encodeURIComponent(file.name)}`
    }));

    renderList("all");
  } catch {
    soundContainer.innerHTML = "<p style='font-family:\"VT323\"; font-size:1.8rem; color:red;'>Fehler beim Laden 😢</p>";
  }
}

function renderList(cat) {
  soundContainer.innerHTML = "";

  let songs = allSongs;

  if (cat !== "all") {
    songs = songs.filter(song =>
      categoryMap[cat].some(k => song.name.toLowerCase().includes(k.toLowerCase()))
    );
  }

  if (songs.length === 0) {
    soundContainer.innerHTML = "<p style='font-family:\"VT323\"; font-size:1.8rem;'>Keine Songs in dieser Kategorie 😢</p>";
    return;
  }

  songs.forEach((song, index) => {
    const item = document.createElement("div");
    item.classList.add("sound-item");

    if (index % 2 === 0) {
      item.classList.add("left");
    } else {
      item.classList.add("right");
    }

    const btn = document.createElement("button");
    btn.classList.add("play-btn");
    btn.textContent = "▶";

    const title = document.createElement("div");
    title.classList.add("sound-title");
    title.textContent = song.name;

    const audio = new Audio(song.url);
    audio.volume = globalVolume;

    btn.addEventListener("click", async () => {
      if (currentAudio && currentAudio !== audio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;

        if (currentButton) {
          currentButton.textContent = "▶";
          currentButton.classList.remove("playing");
        }
      }

      if (audio.paused) {
        try {
          await audio.play();
          btn.textContent = "⏸";
          btn.classList.add("playing");
          currentAudio = audio;
          currentButton = btn;
        } catch(e) { console.log(e); }
      } else {
        audio.pause();
        audio.currentTime = 0;
        btn.textContent = "▶";
        btn.classList.remove("playing");
      }
    });

    audio.addEventListener("ended", () => {
      btn.textContent = "▶";
      btn.classList.remove("playing");
      if (currentAudio === audio) {
        currentAudio = null;
        currentButton = null;
      }
    });

    item.appendChild(btn);
    item.appendChild(title);
    soundContainer.appendChild(item);
  });
}

volumeSlider.addEventListener("input", () => {
  const v = parseFloat(volumeSlider.value);
  globalVolume = v;
  localStorage.setItem("soundVolume", v);
  if (currentAudio) currentAudio.volume = v;
});

document.querySelectorAll(".nav-item").forEach(nav => {
  nav.addEventListener("click", () => {
    document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));
    nav.classList.add("active");
    renderList(nav.dataset.cat);
  });
});

loadSounds();
</script>

</body>
</html>
