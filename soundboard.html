<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Soundboard – Schrottkiste</title>

<link href="https://fonts.googleapis.com/css2?family=Chewy&family=Poppins:wght@300;400;600&family=VT323&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-main: #1a1a24;
    --bg-top: #1a1a24;
    --bg-deep: #101014;
    --text-main: #f3f1ff;
    --accent: #ff0099;
    --accent-alt: #00ffff;
    --card: #242430;
    --card-soft: rgba(36, 36, 48, 0.96);
  }

  body {
    background: linear-gradient(to bottom, var(--bg-top), var(--bg-main) 50%, var(--bg-deep) 100%);
    font-family: 'Poppins', sans-serif;
    color: var(--text-main);
    margin: 0;
    padding-top: 180px;
    padding-bottom: 90px;
    text-align: center;
  }

  .logo-link {
    position: absolute;
    top: 75px; 
    left: 20px;
    font-family: 'Chewy', cursive;
    font-size: 2rem;
    color: #fff;
    text-decoration: none;
    z-index: 2000;
    transition: 0.3s;
  }
  .logo-link:hover { color: var(--accent); }

  h1 {
    font-family: 'Chewy', cursive;
    color: #fff;
    text-shadow: 4px 4px 0px var(--accent);
    font-size: 3.5rem;
  }

  /* Suchfeld Design */
  #searchBox {
    margin: 20px auto;
    width: 80%;
    max-width: 400px;
    padding: 12px 20px;
    border-radius: 25px;
    border: 2px solid var(--accent);
    background: var(--bg-deep);
    color: white;
    font-family: 'VT323', monospace;
    font-size: 1.2rem;
    outline: none;
  }

  #navbar {
    position: absolute;
    top: 75px; 
    left: 0; 
    right: 0;
    height: 60px;
    background: rgba(26, 26, 36, 0.96);
    backdrop-filter: blur(14px);
    border-bottom: 3px solid var(--accent);
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    z-index: 1000;
  }

  .nav-item {
    color: var(--text-main);
    font-family: 'VT323', monospace;
    font-size: 1.3rem;
    text-decoration: none;
    cursor: pointer;
    transition: all 0.2s ease;
    padding: 5px 10px;
    border-radius: 6px;
  }

  .nav-item.active,
  .nav-item:hover { 
    color: var(--accent-alt); 
    background: rgba(0, 255, 255, 0.08);
  }

  #volume {
    -webkit-appearance: none;
    width: 200px;
    height: 8px;
    border-radius: 5px;
    background: linear-gradient(to right, var(--accent) 0%, var(--accent-alt) 100%);
    background-size: var(--val, 50%) 100%;
    background-repeat: no-repeat;
    background-color: #444;
  }
  #volume::-webkit-slider-thumb {
    -webkit-appearance: none;
    height: 20px;
    width: 20px;
    border-radius: 50%;
    background: #fff;
    cursor: pointer;
    border: 3px solid var(--accent-alt);
  }

  #soundContainer {
    position: relative;
    max-width: 900px;
    margin: 40px auto;
    padding: 20px 10px;
  }

  #soundContainer::before {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: 50%;
    width: 3px;
    background: linear-gradient(180deg, rgba(255, 0, 153, 0.2), var(--accent-alt), rgba(255, 0, 153, 0.2));
    box-shadow: 0 0 14px var(--accent-alt);
    border-radius: 999px;
    pointer-events: none;
  }

  .sound-item {
    position: relative;
    display: flex;
    align-items: center;
    gap: 15px;
    background: var(--card-soft);
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-radius: 16px;
    padding: 14px 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    backdrop-filter: blur(10px);
    transition: all 0.18s ease;
    width: 48%;
    margin: 25px 0;
  }

  .sound-item::before {
    content: "";
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--bg-main);
    border: 3px solid var(--accent-alt);
    box-shadow: 0 0 12px var(--accent-alt);
  }

  .sound-item.left { margin-right: auto; flex-direction: row-reverse; text-align: right; }
  .sound-item.left::before { right: -31px; }
  .sound-item.right { margin-left: auto; text-align: left; }
  .sound-item.right::before { left: -31px; }

  .sound-item:hover {
    border-color: var(--accent);
    box-shadow: 0 16px 34px rgba(0,0,0,0.4), 0 0 16px rgba(255, 0, 153, 0.2);
    transform: translateY(-2px);
  }

  .sound-title { font-family: 'VT323', monospace; font-size: 1.6rem; text-align: inherit; flex-grow: 1; color: #fff; }

  .play-btn {
    background: #000;
    border: 2px solid var(--accent-alt);
    border-radius: 50%;
    color: #fff;
    width: 44px;
    height: 44px;
    font-size: 1.1rem;
    cursor: pointer;
    transition: all 0.2s;
    flex-shrink: 0;
    box-shadow: 4px 4px 0px var(--accent-alt);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .play-btn:hover { transform: scale(1.05); background: var(--accent-alt); color: #000; box-shadow: 4px 4px 0px var(--accent); }
  .play-btn.playing { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 0 15px var(--accent); animation: pulseGlow 1s infinite alternate; }

  @keyframes pulseGlow {
    0% { transform: scale(1); filter: drop-shadow(0 0 2px var(--accent)); }
    100% { transform: scale(1.05); filter: drop-shadow(0 0 12px var(--accent)); }
  }

  #volumeControl {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 15px;
    background: rgba(26, 26, 36, 0.92);
    border: 2px dashed var(--accent-alt);
    border-radius: 10px;
    padding: 12px 25px;
    width: fit-content;
    backdrop-filter: blur(14px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    z-index: 999;
  }

  @media (max-width: 768px) {
    body { padding-top: 200px; }
    #navbar { top: 120px; padding-left: 0; justify-content: center; flex-wrap: wrap; height: auto; padding: 10px; }
    .logo-link { position: static; display: block; margin-bottom: 20px; }
  }
</style>
</head>

<body>

<a href="index.html" class="logo-link">Schrottkiste</a>

<div id="navbar">
  <div class="nav-item active" data-cat="all">🌐 Alle</div>
  <div class="nav-item" data-cat="minecraft">🎮 Minecraft</div>
  <div class="nav-item" data-cat="animal">🌿 Animal Crossing</div>
  <div class="nav-item" data-cat="series">📺 Serien & Intros</div>
  <div class="nav-item" data-cat="littlebigplanet">🧵 LittleBigPlanet</div>
  <div class="nav-item" data-cat="speedy">🐣 Speedy Eggbert</div>
  <div class="nav-item" data-cat="lifeisstrange">🦋 Life is Strange</div>
  <div class="nav-item" data-cat="other">🎵 Sonstiges</div>
</div>

<h1 style="margin-top: 60px;">Nostalgie Soundboard ⚡</h1>

<input type="text" id="searchBox" placeholder="🔍 Suche nach einem Song..." />

<div id="soundContainer">Lade Sounds...</div>

<div id="volumeControl">
  <label for="volume" style="font-family:'VT323'; color:var(--accent-alt); font-size:1.4rem;">🔊 LAUTSTÄRKE:</label>
  <input type="range" id="volume" min="0" max="1" step="0.01" value="0.5">
</div>

<script>
const username = "Schrottkiste11";
const repo = "e";
const soundContainer = document.getElementById("soundContainer");
const volumeSlider = document.getElementById("volume");
const searchBox = document.getElementById("searchBox");

let globalVolume = parseFloat(localStorage.getItem("soundVolume")) || 0.5;
let currentAudio = null;
let currentButton = null;

volumeSlider.value = globalVolume;
volumeSlider.style.setProperty('--val', (globalVolume * 100) + '%');

const categoryMap = {
  "minecraft": ["Sweden", "Wet Hands", "Moog City 2 Minecraft"],
  "animal": ["5 P.M.", "Kapp'n", "Title Screen", "Wild World", "Title Theme"],
  "series": ["Cosmo", "Ducktales", "Gravity Falls", "Kim Possible", "Lauras", "LazyTown", "Phineas", "Spongebob", "Scooby", "Zoés", "ALF"],
  "littlebigplanet": ["LittleBigPlanet", "Victoria", "Gardens", "Wedding", "Wilderness"],
  "speedy": ["Speedy", "Eggbert", "Adventure", "Intro", "Level"],
  "lifeisstrange": ["Life is Strange", "LIS"],
  "other": ["8 Bit", "AU SCHWARTE", "alf theme"]
};

let allSongs = [];

async function loadSounds() {
  try {
    const response = await fetch(`https://api.github.com/repos/${username}/${repo}/contents/`);
    const files = await response.json();
    const mp3Files = files.filter(f => f.name.toLowerCase().endsWith(".mp3") || f.name.toLowerCase().endsWith(".wav"));

    allSongs = mp3Files.map(file => ({
      name: file.name.replace(/\.[^/.]+$/, ""),
      url: `https://raw.githubusercontent.com/${username}/${repo}/main/${encodeURIComponent(file.name)}`
    }));
    renderList();
  } catch {
    soundContainer.innerHTML = "<p style='font-family:\"VT323\"; font-size:1.8rem; color:red;'>Fehler beim Laden 😢</p>";
  }
}

function renderList() {
  const activeCat = document.querySelector(".nav-item.active").dataset.cat;
  const searchTerm = searchBox.value.toLowerCase();

  let songs = (activeCat === "all") ? allSongs : allSongs.filter(s => categoryMap[activeCat].some(k => s.name.toLowerCase().includes(k.toLowerCase())));
  
  // Suche filtern
  if (searchTerm) {
    songs = songs.filter(s => s.name.toLowerCase().includes(searchTerm));
  }

  soundContainer.innerHTML = "";
  if (songs.length === 0) { soundContainer.innerHTML = "<p style='font-family:\"VT323\"; font-size:1.8rem;'>Keine Songs gefunden 😢</p>"; return; }

  songs.forEach((song, index) => {
    const item = document.createElement("div");
    item.classList.add("sound-item", index % 2 === 0 ? "left" : "right");
    const btn = document.createElement("button");
    btn.classList.add("play-btn");
    btn.textContent = "▶";
    const title = document.createElement("div");
    title.classList.add("sound-title");
    title.textContent = song.name;
    const audio = new Audio(song.url);
    audio.volume = globalVolume;

    btn.addEventListener("click", async () => {
      if (currentAudio && currentAudio !== audio) { currentAudio.pause(); currentAudio.currentTime = 0; currentButton.textContent = "▶"; currentButton.classList.remove("playing"); }
      if (audio.paused) { await audio.play(); btn.textContent = "⏸"; btn.classList.add("playing"); currentAudio = audio; currentButton = btn; }
      else { audio.pause(); audio.currentTime = 0; btn.textContent = "▶"; btn.classList.remove("playing"); }
    });
    audio.addEventListener("ended", () => { btn.textContent = "▶"; btn.classList.remove("playing"); });
    item.appendChild(btn); item.appendChild(title); soundContainer.appendChild(item);
  });
}

volumeSlider.addEventListener("input", () => { 
  globalVolume = volumeSlider.value; 
  volumeSlider.style.setProperty('--val', (globalVolume * 100) + '%');
  localStorage.setItem("soundVolume", globalVolume); 
  if (currentAudio) currentAudio.volume = globalVolume; 
});

// Event Listener für Suche
searchBox.addEventListener("input", renderList);

document.querySelectorAll(".nav-item").forEach(nav => {
  nav.addEventListener("click", () => {
    document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));
    nav.classList.add("active");
    renderList();
  });
});

loadSounds();
</script>

</body>
</html>
