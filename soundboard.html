<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Soundboard – Schrottkiste</title>
<meta name="description" content="Schrottkiste Soundboard – Alle Sounds, Playlists und mehr">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
  :root {
    --bg-app: #0f0f13;
    --bg-sidebar: #09090c;
    --bg-card: #181820;
    --bg-card-hover: #22222f;
    --text-main: #f3f1ff;
    --text-muted: #a0a0b0;
    --accent: #ff0099;
    --accent-alt: #00ffff;
    --accent-green: #00ff66;
    --accent-yellow: #ffcc00;
    --accent-red: #ff0033;
    --border-color: #2a2a38;
    --shadow: 0 4px 15px rgba(0,0,0,0.3);
    --radius: 10px;
    --transition: 0.2s ease;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg-app);
    font-family: 'Poppins', sans-serif;
    color: var(--text-main);
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

  /* --- MOBILE BACKDROP --- */
  .sidebar-backdrop {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.7);
    z-index: 990;
    backdrop-filter: blur(2px);
  }
  .sidebar-backdrop.show { display: block; }

  /* --- SIDEBAR --- */
  .app-sidebar {
    width: 280px;
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border-color);
    display: flex;
    flex-direction: column;
    height: 100vh;
    padding: 25px 20px;
    flex-shrink: 0;
    z-index: 1000;
    transition: transform 0.3s ease;
  }

  .sidebar-logo {
    font-family: 'VT323', monospace;
    font-size: 2.2rem;
    color: var(--accent);
    text-shadow: 2px 2px 0px var(--accent-alt);
    margin-bottom: 25px;
    padding-left: 5px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .sidebar-menu {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 20px;
  }

  .sidebar-link {
    color: var(--text-muted);
    text-decoration: none;
    font-size: 1rem;
    padding: 12px 15px;
    border-radius: var(--radius);
    display: flex;
    align-items: center;
    gap: 12px;
    transition: var(--transition);
    font-weight: 500;
  }

  .sidebar-link:hover {
    background: var(--bg-card-hover);
    color: #fff;
    transform: translateX(3px);
  }

  .sidebar-link i {
    width: 20px;
    text-align: center;
    font-size: 1.1rem;
  }

  .sidebar-divider {
    height: 1px;
    background: var(--border-color);
    margin: 15px 0;
  }

  .sidebar-playlists-title {
    font-family: 'VT323', monospace;
    font-size: 1.4rem;
    color: var(--accent-alt);
    padding: 5px 10px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .sidebar-playlists-container {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding-right: 5px;
  }

  .sidebar-playlist-item {
    color: var(--text-muted);
    text-decoration: none;
    font-size: 0.95rem;
    padding: 10px 14px;
    border-radius: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: var(--transition);
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    border: 1px solid transparent;
  }

  .sidebar-playlist-item:hover { 
    background: var(--bg-card); 
    color: #fff;
    border-color: var(--border-color);
  }
  
  .sidebar-playlist-item.active-pl {
    background: rgba(255, 0, 153, 0.12);
    color: var(--accent);
    border-color: var(--accent);
    font-weight: 600;
  }

  .sidebar-del-btn {
    opacity: 0.3;
    transition: var(--transition);
    font-size: 0.85rem;
    padding: 4px;
  }
  .sidebar-del-btn:hover {
    opacity: 1;
    transform: scale(1.2);
    color: var(--accent-red);
  }

  .new-playlist-sidebar-btn {
    background: transparent;
    border: 2px dashed var(--accent);
    color: var(--accent);
    padding: 14px;
    border-radius: var(--radius);
    font-family: 'VT323', monospace;
    font-size: 1.3rem;
    cursor: pointer;
    margin-top: 15px;
    transition: var(--transition);
    text-align: center;
    font-weight: 600;
    letter-spacing: 0.05em;
  }
  .new-playlist-sidebar-btn:hover { 
    background: var(--accent); 
    color: #fff;
    border-style: solid;
    box-shadow: 0 4px 15px rgba(255,0,153,0.3);
  }

  /* --- MAIN CONTENT --- */
  .app-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow-y: auto;
    position: relative;
    padding-bottom: 110px;
  }

  .app-topbar {
    padding: 20px 30px;
    display: flex;
    gap: 20px;
    justify-content: space-between;
    align-items: center;
    background: rgba(15, 15, 19, 0.95);
    backdrop-filter: blur(10px);
    position: sticky;
    top: 0;
    z-index: 950;
    border-bottom: 1px solid var(--border-color);
  }

  .mobile-menu-btn {
    display: none;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    color: #fff;
    width: 44px;
    height: 44px;
    border-radius: var(--radius);
    cursor: pointer;
    align-items: center;
    justify-content: center;
    font-size: 1.3rem;
    flex-shrink: 0;
    transition: var(--transition);
  }
  .mobile-menu-btn:hover { border-color: var(--accent); color: var(--accent); }

  #searchBox {
    width: 100%;
    max-width: 450px;
    padding: 12px 20px;
    border-radius: 25px;
    border: 1px solid var(--border-color);
    background: var(--bg-card);
    color: white;
    font-size: 0.95rem;
    outline: none;
    transition: var(--transition);
  }
  #searchBox:focus { 
    border-color: var(--accent-alt); 
    box-shadow: 0 0 15px rgba(0,255,255,0.15);
  }
  #searchBox::placeholder { color: var(--text-muted); }

  .filter-bar {
    display: flex;
    gap: 8px;
    padding: 15px 30px;
    overflow-x: auto;
    flex-shrink: 0;
    background: rgba(15, 15, 19, 0.95);
    backdrop-filter: blur(10px);
    position: sticky;
    top: 81px; 
    z-index: 900;
    border-bottom: 1px solid var(--border-color);
  }
  .filter-bar::-webkit-scrollbar { height: 3px; }

  .nav-item {
    color: var(--text-muted);
    font-family: 'VT323', monospace;
    font-size: 1.2rem;
    cursor: pointer;
    padding: 8px 18px;
    border: 1px solid var(--border-color);
    border-radius: 20px;
    background: var(--bg-card);
    white-space: nowrap;
    flex-shrink: 0;
    transition: var(--transition);
    user-select: none;
  }
  .nav-item:hover {
    color: #fff;
    border-color: var(--accent-alt);
  }
  .nav-item.active {
    color: #fff;
    background: var(--accent);
    border-color: var(--accent);
    box-shadow: 0 2px 10px rgba(255,0,153,0.3);
  }

  /* --- SONG LISTE --- */
  #soundContainer { 
    padding: 20px 30px; 
    display: flex; 
    flex-direction: column; 
    gap: 6px; 
  }

  .sound-item {
    background: transparent;
    border-radius: var(--radius);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 16px;
    transition: var(--transition);
    border: 1px solid transparent;
  }
  .sound-item:hover { 
    background: var(--bg-card); 
    border-color: var(--border-color);
    box-shadow: var(--shadow);
  }

  .sound-item.playing-row {
    background: rgba(255, 0, 153, 0.08);
    border-color: rgba(255, 0, 153, 0.4);
    box-shadow: 0 0 15px rgba(255, 0, 153, 0.15);
  }

  .play-btn {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    color: #fff;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: var(--transition);
    font-size: 0.95rem;
  }
  .play-btn:hover { 
    border-color: var(--accent-alt); 
    color: var(--accent-alt);
    transform: scale(1.08);
  }
  .play-btn.playing { 
    background: var(--accent); 
    border-color: var(--accent); 
    color: #fff;
    box-shadow: 0 0 15px rgba(255,0,153,0.4);
  }

  .sound-details { 
    flex: 1; 
    display: flex; 
    flex-direction: column; 
    gap: 2px; 
    text-align: left; 
    min-width: 0; 
  }
  .sound-title { 
    font-size: 1rem; 
    font-weight: 500; 
    color: var(--text-main); 
    white-space: nowrap; 
    overflow: hidden; 
    text-overflow: ellipsis; 
  }
  .sound-item.playing-row .sound-title {
    color: #fff;
    font-weight: 600;
  }
  .sound-subtitle { 
    font-size: 0.8rem; 
    color: var(--text-muted); 
  }

  /* Options-Menü */
  .playlist-menu-wrapper { 
    position: relative; 
    display: inline-block; 
    flex-shrink: 0; 
  }
  .playlist-menu-btn {
    background: transparent;
    border: 1px solid var(--border-color);
    color: var(--text-muted);
    width: 34px;
    height: 34px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2rem;
    transition: var(--transition);
  }
  .playlist-menu-btn:hover { 
    border-color: var(--accent-alt); 
    color: var(--accent-alt);
    background: var(--bg-card-hover);
  }

  .playlist-dropdown {
    display: none;
    position: absolute;
    right: 0;
    bottom: 40px;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius);
    padding: 8px;
    z-index: 5000;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    min-width: 240px;
    text-align: left;
  }
  .playlist-dropdown.show { display: block; }
  
  .dropdown-item {
    font-size: 0.9rem;
    color: var(--text-main);
    padding: 10px 14px;
    cursor: pointer;
    border-radius: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: var(--transition);
  }
  .dropdown-item:hover { 
    background: var(--bg-card-hover); 
    color: var(--accent-alt); 
  }
  .dropdown-item.in-pl { 
    color: var(--accent-yellow); 
    font-weight: 600; 
  }

  /* --- FOOTER PLAYER --- */
  .app-bottom-bar {
    position: fixed;
    bottom: 0;
    left: 280px;
    right: 0;
    height: 90px;
    background: var(--bg-sidebar);
    border-top: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 30px;
    z-index: 1100;
    transition: left 0.3s ease;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.4);
  }

  .footer-left {
    display: flex;
    align-items: center;
    gap: 15px;
    min-width: 180px;
    max-width: 260px;
    cursor: pointer;
    transition: var(--transition);
  }
  .footer-left:hover { opacity: 0.85; }
  
  .footer-thumb {
    width: 48px;
    height: 48px;
    background: var(--bg-card);
    border-radius: 8px;
    border: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3rem;
    flex-shrink: 0;
    transition: var(--transition);
  }
  .footer-song-meta { 
    display: flex; 
    flex-direction: column; 
    overflow: hidden; 
    text-align: left; 
  }
  .footer-song-title { 
    font-size: 0.9rem; 
    font-weight: 600; 
    color: #fff; 
    white-space: nowrap; 
    overflow: hidden; 
    text-overflow: ellipsis; 
  }
  .footer-song-artist { 
    font-size: 0.78rem; 
    color: var(--text-muted); 
  }

  .footer-center {
    flex: 1;
    max-width: 500px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 0 20px;
  }
  .footer-controls { 
    display: flex; 
    align-items: center; 
    gap: 16px; 
  }
  
  .footer-ctrl-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-size: 1.1rem;
    cursor: pointer;
    transition: var(--transition);
    padding: 5px;
  }
  .footer-ctrl-btn:hover { 
    color: #fff; 
    transform: scale(1.15); 
  }
  .footer-ctrl-btn.active { 
    color: var(--accent); 
    text-shadow: 0 0 10px var(--accent); 
  }

  .footer-play-btn {
    background: #fff;
    color: #000;
    border: none;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    transition: var(--transition);
  }
  .footer-play-btn:hover { 
    transform: scale(1.08); 
    background: var(--accent-alt); 
  }

  .footer-progress-wrapper {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .time-info {
    font-family: 'VT323', monospace;
    font-size: 0.95rem;
    color: var(--text-muted);
    min-width: 35px;
    text-align: center;
  }

  .seek-slider {
    -webkit-appearance: none;
    flex: 1;
    height: 4px;
    border-radius: 2px;
    background: var(--border-color);
    outline: none;
    cursor: pointer;
  }
  .seek-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--accent-red);
    cursor: pointer;
    box-shadow: 0 0 8px rgba(255,0,51,0.6);
    transition: transform 0.2s;
  }
  .seek-slider::-webkit-slider-thumb:hover {
    transform: scale(1.3);
  }

  .footer-right {
    display: flex;
    align-items: center;
    gap: 15px;
    min-width: 180px;
    justify-content: flex-end;
  }

  #volumeControl {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    padding: 8px 14px;
    border-radius: 20px;
  }
  #muteToggleBtn {
    background: none;
    border: none;
    color: #fff;
    font-size: 1rem;
    cursor: pointer;
    transition: var(--transition);
  }
  #muteToggleBtn:hover {
    transform: scale(1.2);
  }
  
  #volume {
    -webkit-appearance: none;
    width: 80px;
    height: 4px;
    border-radius: 2px;
    background: var(--border-color);
    outline: none;
    cursor: pointer;
  }
  #volume::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--accent-alt);
    cursor: pointer;
    box-shadow: 0 0 6px rgba(0,255,255,0.5);
  }

  /* --- MODAL --- */
  #playlistModalOverlay {
    display: none;
    position: fixed; 
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.8);
    z-index: 30000;
    justify-content: center; 
    align-items: center;
    padding: 20px;
    backdrop-filter: blur(4px);
  }
  
  .modal-content {
    background: var(--bg-card);
    border: 2px solid var(--accent);
    border-radius: 16px;
    padding: 30px;
    width: 100%; 
    max-width: 400px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.7);
  }
  
  .modal-content h3 { 
    font-family: 'VT323', monospace; 
    font-size: 1.8rem; 
    color: var(--accent-alt); 
    margin: 0 0 20px; 
  }
  
  #newPlaylistInput {
    width: 100%;
    padding: 14px 18px;
    background: var(--bg-app);
    border: 1px solid var(--border-color);
    border-radius: var(--radius);
    color: white;
    font-size: 1rem;
    margin-bottom: 20px;
    outline: none;
    font-family: 'Poppins', sans-serif;
  }
  #newPlaylistInput:focus { border-color: var(--accent); }
  
  .modal-actions { 
    display: flex; 
    justify-content: center; 
    gap: 10px; 
  }
  
  .modal-btn { 
    background: var(--accent); 
    color: #fff; 
    border: none; 
    padding: 12px 24px; 
    border-radius: 25px; 
    font-weight: 600; 
    cursor: pointer; 
    transition: var(--transition);
    font-family: 'Poppins', sans-serif;
  }
  .modal-btn:hover { 
    background: #ff1a9e; 
    box-shadow: 0 4px 15px rgba(255,0,153,0.3);
  }
  
  .modal-btn-cancel { 
    background: var(--bg-card-hover); 
    color: var(--text-muted); 
  }
  .modal-btn-cancel:hover { 
    background: var(--border-color); 
    color: #fff; 
  }

  /* --- TOAST BENACHRICHTIGUNG --- */
  #toastNotification {
    position: fixed;
    bottom: 105px;
    right: 30px;
    background: var(--bg-card);
    border: 1px solid var(--accent);
    color: var(--text-main);
    padding: 12px 20px;
    border-radius: 25px;
    font-size: 0.9rem;
    box-shadow: 0 5px 20px rgba(0,0,0,0.5);
    z-index: 10000;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.3s ease;
    pointer-events: none;
  }
  #toastNotification.show {
    opacity: 1;
    transform: translateY(0);
  }

  /* --- RESPONSIVE --- */
  @media (max-width: 768px) {
    .app-sidebar {
      position: fixed;
      left: -280px;
      top: 0;
      bottom: 0;
      box-shadow: 10px 0 30px rgba(0,0,0,0.8);
      z-index: 2000;
      transition: transform 0.3s ease;
    }
    .app-sidebar.mobile-open {
      transform: translateX(280px);
    }

    .mobile-menu-btn {
      display: flex;
    }

    .app-bottom-bar {
      left: 0 !important;
      padding: 0 15px;
      height: 80px;
    }

    .app-topbar {
      padding: 15px;
    }

    .filter-bar {
      padding: 10px 15px;
      top: 71px;
    }

    #soundContainer {
      padding: 15px;
    }

    .footer-right {
      display: none;
    }

    .footer-left {
      min-width: unset;
      max-width: 140px;
    }

    .footer-center {
      max-width: unset;
      padding: 0 8px;
    }

    #toastNotification {
      right: 15px;
      bottom: 95px;
    }
  }
</style>
</head>

<body>

<!-- Mobile Sidebar Backdrop -->
<div class="sidebar-backdrop" id="sidebarBackdrop"></div>

<!-- Sidebar -->
<aside class="app-sidebar" id="appSidebar">
  <div class="sidebar-logo">⚡ Soundboard</div>
  
  <div class="sidebar-menu">
    <a href="index.html" class="sidebar-link"><i class="fas fa-home"></i> Startseite</a>
    <a href="ideen.html" class="sidebar-link"><i class="fas fa-list"></i> Content-Plan</a>
  </div>

  <div class="sidebar-divider"></div>

  <div class="sidebar-playlists-title">📂 Meine Playlists</div>
  <div class="sidebar-playlists-container" id="sidebarPlaylistLinks"></div>
  
  <button class="new-playlist-sidebar-btn" id="sidebarNewPlaylistBtn">+ Neue Playlist</button>
</aside>

<!-- Modal für neue Playlist -->
<div id="playlistModalOverlay">
  <div class="modal-content">
    <h3>🎵 Neue Playlist</h3>
    <input type="text" id="newPlaylistInput" placeholder="Name der Playlist..." maxlength="30" />
    <div class="modal-actions">
      <button id="modalCreateBtn" class="modal-btn">Erstellen</button>
      <button id="modalCancelBtn" class="modal-btn modal-btn-cancel">Abbrechen</button>
    </div>
  </div>
</div>

<!-- Toast Feedback -->
<div id="toastNotification"></div>

<!-- Hauptbereich -->
<main class="app-main">
  <header class="app-topbar">
    <button class="mobile-menu-btn" id="mobileMenuBtn">
      <i class="fas fa-bars"></i>
    </button>
    <input type="text" id="searchBox" placeholder="🔍 Sound oder Artist suchen..." />
  </header>

  <nav class="filter-bar" id="filterBar">
    <div class="nav-item active" data-category="all">Alle</div>
    <div class="nav-item" data-category="serien">Serien</div>
    <div class="nav-item" data-category="filme">Filme</div>
    <div class="nav-item" data-category="gaming">Gaming</div>
    <div class="nav-item" data-category="meme">Memes</div>
  </nav>

  <section id="soundContainer"></section>
</main>

<!-- Footer Player -->
<footer class="app-bottom-bar">
  <div class="footer-left" id="footerMeta">
    <div class="footer-thumb" id="footerThumb">🎵</div>
    <div class="footer-song-meta">
      <span class="footer-song-title" id="footerTitle">Kein Song ausgewählt</span>
      <span class="footer-song-artist" id="footerArtist">Wähle einen Track aus</span>
    </div>
  </div>

  <div class="footer-center">
    <div class="footer-controls">
      <button class="footer-ctrl-btn" id="shuffleBtn" title="Zufallswiedergabe"><i class="fas fa-random"></i></button>
      <button class="footer-ctrl-btn" id="prevBtn" title="Vorheriger Track"><i class="fas fa-step-backward"></i></button>
      <button class="footer-play-btn" id="footerPlayBtn" title="Play/Pause"><i class="fas fa-play"></i></button>
      <button class="footer-ctrl-btn" id="nextBtn" title="Nächster Track"><i class="fas fa-step-forward"></i></button>
      <button class="footer-ctrl-btn" id="repeatBtn" title="Wiederholen"><i class="fas fa-redo"></i></button>
    </div>
    <div class="footer-progress-wrapper">
      <span class="time-info" id="currentTime">0:00</span>
      <input type="range" id="seekSlider" class="seek-slider" value="0" min="0" max="100" />
      <span class="time-info" id="durationTime">0:00</span>
    </div>
  </div>

  <div class="footer-right">
    <div id="volumeControl">
      <button id="muteToggleBtn" title="Stumm schalten"><i class="fas fa-volume-up"></i></button>
      <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8" />
    </div>
  </div>
</footer>

<script>
  // --- SOUND DATENBANK ---
  const sounds = [
    {
      id: "ecce_homo_mr_bean",
      title: "Ecce Homo (Mr. Bean Theme)",
      subtitle: "The Choirboys with Lyrics",
      category: "serien",
      file: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" // Platzhalter Audio-URL
    }
  ];

  // --- STATE ---
  let userPlaylists = JSON.parse(localStorage.getItem('schrottkiste_playlists')) || {};
  let currentCategory = 'all';
  let activePlaylistKey = null;
  let currentPlayingIndex = -1;
  let isPlaying = false;
  let isShuffle = false;
  let isRepeat = false;

  const audio = new Audio();

  // --- DOM ELEM ---
  const soundContainer = document.getElementById('soundContainer');
  const searchBox = document.getElementById('searchBox');
  const filterBar = document.getElementById('filterBar');
  const sidebarPlaylistLinks = document.getElementById('sidebarPlaylistLinks');
  const sidebarNewPlaylistBtn = document.getElementById('sidebarNewPlaylistBtn');
  const playlistModalOverlay = document.getElementById('playlistModalOverlay');
  const newPlaylistInput = document.getElementById('newPlaylistInput');
  const modalCreateBtn = document.getElementById('modalCreateBtn');
  const modalCancelBtn = document.getElementById('modalCancelBtn');
  const toastNotification = document.getElementById('toastNotification');

  const appSidebar = document.getElementById('appSidebar');
  const mobileMenuBtn = document.getElementById('mobileMenuBtn');
  const sidebarBackdrop = document.getElementById('sidebarBackdrop');

  const footerPlayBtn = document.getElementById('footerPlayBtn');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const repeatBtn = document.getElementById('repeatBtn');
  const footerTitle = document.getElementById('footerTitle');
  const footerArtist = document.getElementById('footerArtist');
  const seekSlider = document.getElementById('seekSlider');
  const currentTimeEl = document.getElementById('currentTime');
  const durationTimeEl = document.getElementById('durationTime');
  const volumeSlider = document.getElementById('volume');
  const muteToggleBtn = document.getElementById('muteToggleBtn');

  // --- INITIALISIERUNG ---
  function init() {
    renderSidebarPlaylists();
    renderSounds();
    setupEventListeners();
  }

  // --- SOUNDS RENDERN ---
  function getFilteredSounds() {
    let list = [];
    if (activePlaylistKey && userPlaylists[activePlaylistKey]) {
      const ids = userPlaylists[activePlaylistKey];
      list = sounds.filter(s => ids.includes(s.id));
    } else {
      list = sounds.filter(s => currentCategory === 'all' || s.category === currentCategory);
    }

    const searchTerm = searchBox.value.toLowerCase().trim();
    if (searchTerm) {
      list = list.filter(s => 
        s.title.toLowerCase().includes(searchTerm) || 
        s.subtitle.toLowerCase().includes(searchTerm)
      );
    }
    return list;
  }

  function renderSounds() {
    soundContainer.innerHTML = '';
    const currentList = getFilteredSounds();

    if (currentList.length === 0) {
      soundContainer.innerHTML = `<div style="text-align:center; padding:40px; color:var(--text-muted);">Keine Sounds gefunden 🤖</div>`;
      return;
    }

    currentList.forEach((s) => {
      const isCurrent = (sounds[currentPlayingIndex] && sounds[currentPlayingIndex].id === s.id);
      
      const item = document.createElement('div');
      item.className = `sound-item ${isCurrent ? 'playing-row' : ''}`;
      
      item.innerHTML = `
        <button class="play-btn ${isCurrent && isPlaying ? 'playing' : ''}" onclick="playSoundById('${s.id}')">
          <i class="fas ${isCurrent && isPlaying ? 'fa-pause' : 'fa-play'}"></i>
        </button>
        <div class="sound-details">
          <span class="sound-title">${s.title}</span>
          <span class="sound-subtitle">${s.subtitle}</span>
        </div>
        <div class="playlist-menu-wrapper">
          <button class="playlist-menu-btn" onclick="toggleDropdown(event, '${s.id}')">
            <i class="fas fa-ellipsis-v"></i>
          </button>
          <div class="playlist-dropdown" id="dropdown-${s.id}">
            ${renderDropdownItems(s.id)}
          </div>
        </div>
      `;
      soundContainer.appendChild(item);
    });
  }

  function renderDropdownItems(soundId) {
    const keys = Object.keys(userPlaylists);
    if (keys.length === 0) {
      return `<div style="padding:8px 12px; font-size:0.85rem; color:var(--text-muted);">Keine Playlists vorhanden</div>`;
    }
    return keys.map(pName => {
      const inPl = userPlaylists[pName].includes(soundId);
      return `
        <div class="dropdown-item ${inPl ? 'in-pl' : ''}" onclick="toggleSongInPlaylist('${pName}', '${soundId}')">
          <span>${pName}</span>
          <i class="fas ${inPl ? 'fa-check' : 'fa-plus'}"></i>
        </div>
      `;
    }).join('');
  }

  // --- PLAYBACK LOGIK ---
  function playSoundById(id) {
    const targetIdx = sounds.findIndex(s => s.id === id);
    if (targetIdx === -1) return;

    if (currentPlayingIndex === targetIdx) {
      togglePlayPause();
    } else {
      currentPlayingIndex = targetIdx;
      loadAndPlay(sounds[currentPlayingIndex]);
    }
  }

  function loadAndPlay(sound) {
    audio.src = sound.file;
    audio.play();
    isPlaying = true;
    updatePlayerUI();
    renderSounds();
  }

  function togglePlayPause() {
    if (currentPlayingIndex === -1) {
      const list = getFilteredSounds();
      if (list.length > 0) playSoundById(list[0].id);
      return;
    }

    if (audio.paused) {
      audio.play();
      isPlaying = true;
    } else {
      audio.pause();
      isPlaying = false;
    }
    updatePlayerUI();
    renderSounds();
  }

  function updatePlayerUI() {
    const s = sounds[currentPlayingIndex];
    if (s) {
      footerTitle.textContent = s.title;
      footerArtist.textContent = s.subtitle;
      footerPlayBtn.innerHTML = `<i class="fas ${isPlaying ? 'fa-pause' : 'fa-play'}"></i>`;
    } else {
      footerTitle.textContent = "Kein Song ausgewählt";
      footerArtist.textContent = "Wähle einen Track aus";
      footerPlayBtn.innerHTML = `<i class="fas fa-play"></i>`;
    }
  }

  function playNext() {
    const list = getFilteredSounds();
    if (list.length === 0) return;

    if (isShuffle) {
      const randIdx = Math.floor(Math.random() * list.length);
      playSoundById(list[randIdx].id);
      return;
    }

    let currentInFiltered = list.findIndex(s => s.id === sounds[currentPlayingIndex]?.id);
    let nextIdx = (currentInFiltered + 1) % list.length;
    playSoundById(list[nextIdx].id);
  }

  function playPrev() {
    const list = getFilteredSounds();
    if (list.length === 0) return;

    let currentInFiltered = list.findIndex(s => s.id === sounds[currentPlayingIndex]?.id);
    let prevIdx = (currentInFiltered - 1 + list.length) % list.length;
    playSoundById(list[prevIdx].id);
  }

  // --- EVENT LISTENERS & HELPER ---
  function setupEventListeners() {
    // Filter Bar Category Click
    filterBar.querySelectorAll('.nav-item').forEach(item => {
      item.addEventListener('click', () => {
        filterBar.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        item.classList.add('active');
        currentCategory = item.dataset.category;
        activePlaylistKey = null;
        renderSidebarPlaylists();
        renderSounds();
      });
    });

    // Search Input
    searchBox.addEventListener('input', renderSounds);

    // Audio Timeline Updates
    audio.addEventListener('timeupdate', () => {
      if (!isNaN(audio.duration)) {
        seekSlider.value = (audio.currentTime / audio.duration) * 100;
        currentTimeEl.textContent = formatTime(audio.currentTime);
        durationTimeEl.textContent = formatTime(audio.duration);
      }
    });

    audio.addEventListener('ended', () => {
      if (isRepeat) {
        audio.currentTime = 0;
        audio.play();
      } else {
        playNext();
      }
    });

    seekSlider.addEventListener('input', () => {
      if (!isNaN(audio.duration)) {
        audio.currentTime = (seekSlider.value / 100) * audio.duration;
      }
    });

    // Player Controls
    footerPlayBtn.addEventListener('click', togglePlayPause);
    nextBtn.addEventListener('click', playNext);
    prevBtn.addEventListener('click', playPrev);

    shuffleBtn.addEventListener('click', () => {
      isShuffle = !isShuffle;
      shuffleBtn.classList.toggle('active', isShuffle);
      showToast(isShuffle ? "Zufallswiedergabe AN" : "Zufallswiedergabe AUS");
    });

    repeatBtn.addEventListener('click', () => {
      isRepeat = !isRepeat;
      repeatBtn.classList.toggle('active', isRepeat);
      showToast(isRepeat ? "Wiederholung AN" : "Wiederholung AUS");
    });

    // Volume
    volumeSlider.addEventListener('input', (e) => {
      audio.volume = e.target.value;
      muteToggleBtn.innerHTML = audio.volume == 0 ? '<i class="fas fa-volume-mute"></i>' : '<i class="fas fa-volume-up"></i>';
    });

    muteToggleBtn.addEventListener('click', () => {
      if (audio.volume > 0) {
        audio.volume = 0;
        volumeSlider.value = 0;
        muteToggleBtn.innerHTML = '<i class="fas fa-volume-mute"></i>';
      } else {
        audio.volume = 0.8;
        volumeSlider.value = 0.8;
        muteToggleBtn.innerHTML = '<i class="fas fa-volume-up"></i>';
      }
    });

    // Sidebar & Mobile Navigation
    mobileMenuBtn.addEventListener('click', () => {
      appSidebar.classList.add('mobile-open');
      sidebarBackdrop.classList.add('show');
    });

    sidebarBackdrop.addEventListener('click', closeMobileSidebar);

    // Modal
    sidebarNewPlaylistBtn.addEventListener('click', () => {
      playlistModalOverlay.style.display = 'flex';
      newPlaylistInput.focus();
    });

    modalCancelBtn.addEventListener('click', () => {
      playlistModalOverlay.style.display = 'none';
      newPlaylistInput.value = '';
    });

    modalCreateBtn.addEventListener('click', createPlaylist);

    // Global Click Handler zum Schließen von Dropdowns
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.playlist-menu-wrapper')) {
        document.querySelectorAll('.playlist-dropdown').forEach(d => d.classList.remove('show'));
      }
    });
  }

  function closeMobileSidebar() {
    appSidebar.classList.remove('mobile-open');
    sidebarBackdrop.classList.remove('show');
  }

  function formatTime(seconds) {
    const min = Math.floor(seconds / 60);
    const sec = Math.floor(seconds % 60);
    return `${min}:${sec < 10 ? '0' : ''}${sec}`;
  }

  function showToast(msg) {
    toastNotification.textContent = msg;
    toastNotification.classList.add('show');
    setTimeout(() => toastNotification.classList.remove('show'), 2500);
  }

  // --- PLAYLIST MANAGING ---
  function renderSidebarPlaylists() {
    sidebarPlaylistLinks.innerHTML = '';
    Object.keys(userPlaylists).forEach(pName => {
      const item = document.createElement('div');
      item.className = `sidebar-playlist-item ${activePlaylistKey === pName ? 'active-pl' : ''}`;
      item.innerHTML = `
        <span onclick="selectPlaylist('${pName}')">🎵 ${pName}</span>
        <i class="fas fa-trash sidebar-del-btn" onclick="deletePlaylist(event, '${pName}')"></i>
      `;
      sidebarPlaylistLinks.appendChild(item);
    });
  }

  function selectPlaylist(pName) {
    activePlaylistKey = pName;
    filterBar.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
    renderSidebarPlaylists();
    renderSounds();
    closeMobileSidebar();
  }

  function createPlaylist() {
    const name = newPlaylistInput.value.trim();
    if (!name) return;
    if (userPlaylists[name]) {
      showToast("Playlist existiert bereits! ⚠️");
      return;
    }

    userPlaylists[name] = [];
    savePlaylists();
    renderSidebarPlaylists();
    playlistModalOverlay.style.display = 'none';
    newPlaylistInput.value = '';
    showToast(`Playlist "${name}" erstellt! 🎉`);
  }

  function deletePlaylist(e, pName) {
    e.stopPropagation();
    delete userPlaylists[pName];
    if (activePlaylistKey === pName) activePlaylistKey = null;
    savePlaylists();
    renderSidebarPlaylists();
    renderSounds();
    showToast(`Playlist "${pName}" gelöscht.`);
  }

  function toggleSongInPlaylist(pName, soundId) {
    const idx = userPlaylists[pName].indexOf(soundId);
    if (idx > -1) {
      userPlaylists[pName].splice(idx, 1);
      showToast(`Aus "${pName}" entfernt`);
    } else {
      userPlaylists[pName].push(soundId);
      showToast(`Zu "${pName}" hinzugefügt! 🎶`);
    }
    savePlaylists();
    renderSounds();
  }

  function toggleDropdown(e, soundId) {
    e.stopPropagation();
    document.querySelectorAll('.playlist-dropdown').forEach(d => {
      if (d.id !== `dropdown-${soundId}`) d.classList.remove('show');
    });
    const dropdown = document.getElementById(`dropdown-${soundId}`);
    if (dropdown) dropdown.classList.toggle('show');
  }

  function savePlaylists() {
    localStorage.setItem('schrottkiste_playlists', JSON.stringify(userPlaylists));
  }

  // App starten
  window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
