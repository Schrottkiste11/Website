<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Command Center | Schrottkiste</title>
  <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Poppins:wght@300;400;600&family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent: #ff0099;
      --accent-alt: #00ffff;
      --bg: #020205;
      --card: rgba(15, 15, 20, 0.98);
      --text: #ffffff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      font-family: 'Poppins', sans-serif;
      color: var(--text);
      display: flex;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* --- SIDEBAR --- */
    .sidebar-nav {
      width: 240px; background: #000; border-right: 1px solid #111;
      display: flex; flex-direction: column; padding: 30px 20px;
      position: sticky; top: 0; height: 100vh; flex-shrink: 0;
    }
    .logo-area { font-family: 'Chewy'; font-size: 2rem; color: var(--accent); margin-bottom: 40px; text-align: center; }
    .sidebar-nav a {
      color: #666; text-decoration: none; font-family: 'VT323'; font-size: 1.5rem;
      margin-bottom: 12px; padding: 12px; border-radius: 8px; transition: 0.2s;
    }
    .sidebar-nav a:hover, .sidebar-nav a.active { color: #fff; background: #111; box-shadow: inset 4px 0 0 var(--accent-alt); }

    /* --- MAIN CONTENT --- */
    .main-content { flex: 1; padding: 25px; background: radial-gradient(circle at top right, #100820 0%, #020205 70%); }
    .dashboard-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }

    .card { background: var(--card); border: 1px solid rgba(255,255,255,0.03); border-radius: 12px; padding: 20px; }
    .section-title { font-family: 'VT323'; font-size: 1.2rem; color: var(--accent-alt); margin-bottom: 15px; display: block; letter-spacing: 1px; }

    /* --- PLAYER BOX --- */
    .radio-box { grid-column: span 1; display: flex; flex-direction: column; }
    .mini-cover { width: 100%; aspect-ratio: 1/1; border-radius: 6px; border: 1px solid var(--accent); margin-bottom: 15px; }
    #song-display { font-family: 'VT323'; font-size: 1.3rem; color: #fff; margin-bottom: 10px; height: 3.2rem; overflow: hidden; }
    .btn-play { background: var(--accent); color: white; border: none; padding: 12px; border-radius: 6px; font-family: 'VT323'; font-size: 1.4rem; cursor: pointer; transition: 0.2s; }
    .btn-play:hover { filter: brightness(1.2); box-shadow: 0 0 15px var(--accent); }

    /* --- TWITCH SPOTLIGHT --- */
    .twitch-box { grid-column: span 2; padding: 0; background: #000; overflow: hidden; height: fit-content; border: 1px solid #6441a5; }
    .video-container { position: relative; padding-bottom: 56.25%; height: 0; }
    .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

    /* --- LOG & INTERACTION --- */
    .log-box { grid-column: span 1; display: flex; flex-direction: column; height: 480px; }
    #event-log { flex: 1; overflow-y: auto; font-family: 'VT323'; font-size: 1rem; color: #aaa; margin-bottom: 10px; }
    .log-entry { margin-bottom: 6px; padding-bottom: 4px; border-bottom: 1px solid #111; }
    .log-time { color: #444; margin-right: 8px; font-size: 0.8rem; }
    .log-sys { color: var(--accent-alt); }
    .log-user { color: var(--accent); }
    
    .input-group { display: flex; gap: 5px; }
    #user-input { background: #000; border: 1px solid #222; color: #fff; padding: 10px; flex: 1; border-radius: 4px; font-family: 'VT323'; }
    #send-btn { background: #222; color: var(--accent-alt); border: none; padding: 0 15px; border-radius: 4px; cursor: pointer; font-family: 'VT323'; }

    /* --- BOTTOM ROW --- */
    .info-card { grid-column: span 1; text-align: left; }
    .info-val { font-family: 'VT323'; font-size: 2rem; color: #fff; }

    @media (max-width: 1200px) {
      .dashboard-grid { grid-template-columns: 1fr; }
      .radio-box, .twitch-box, .log-box { grid-column: span 1; }
      .sidebar-nav { display: none; }
    }
  </style>
</head>
<body>

  <aside class="sidebar-nav">
    <div class="logo-area">SK RADIO</div>
    <nav>
      <a href="index.html">🏠 HOME</a>
      <a href="radio.html" class="active">📻 DASHBOARD</a>
      <a href="ideen.html">💡 PROJEKTE</a>
      <a href="minecrafttahin.html">⚔️ TAHIN</a>
      <a href="app.html">📱 APP</a>
    </nav>
  </aside>

  <main class="main-content">
    <div class="dashboard-grid">
      
      <section class="card radio-box">
        <span class="section-title">RADIO_TUNER</span>
        <img src="channels4_profile Schrottkiste.jpg" class="mini-cover" alt="Cover">
        <div id="song-display">INITIALISIERUNG...</div>
        <button class="btn-play" id="play-btn">START STREAM</button>
        <input type="range" id="vol" min="0" max="1" step="0.1" value="0.5" style="width: 100%; margin-top: 15px; accent-color: var(--accent-alt);">
      </section>

      <section class="card twitch-box">
        <div class="video-container">
          <iframe 
            src="https://player.twitch.tv/?video=2720744141&parent=localhost&parent=127.0.0.1" 
            frameborder="0" allowfullscreen="true" scrolling="no">
          </iframe>
        </div>
      </section>

      <section class="card log-box">
        <span class="section-title">SYSTEM_LOG & CHAT</span>
        <div id="event-log"></div>
        <div class="input-group">
          <input type="text" id="user-input" placeholder="Nachricht...">
          <button id="send-btn">SEND</button>
        </div>
      </section>

      <section class="card info-card">
        <span class="section-title">AKTUELL IM RADIO</span>
        <p id="next-show" style="font-family: 'VT323'; color: #fff; font-size: 1.4rem;">Lade...</p>
      </section>

      <section class="card info-card" style="grid-column: span 2;">
        <span class="section-title">PROJECT_STATUS</span>
        <p style="font-family: 'VT323'; font-size: 0.9rem; color: #aaa; margin-bottom: 5px;">Zelda: Ocarina of Time Adventures</p>
        <div style="width: 100%; height: 4px; background: #111; border-radius: 2px;">
          <div style="width: 85%; height: 100%; background: var(--accent); box-shadow: 0 0 10px var(--accent);"></div>
        </div>
      </section>

      <section class="card info-card">
        <span class="section-title">UPTIME</span>
        <div class="info-val" id="uptime-display">00:00:00</div>
      </section>

    </div>
  </main>

  <audio id="radio-stream" src="https://stream.laut.fm/treasure_radio"></audio>

  <script>
    const audio = document.getElementById('radio-stream');
    const playBtn = document.getElementById('play-btn');
    const songDisplay = document.getElementById('song-display');
    const logContainer = document.getElementById('event-log');
    const nextShowDisplay = document.getElementById('next-show');

    // Sendeplan Daten
    const schedule = [
      { h: 6, title: "Morning Show" },
      { h: 12, title: "immer ab 12! Live" },
      { h: 18, title: "Retro Hits" },
      { h: 23, title: "Nachteulen Party" }
    ];

    function addLog(msg, type = 'sys') {
      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const entry = document.createElement('div');
      entry.className = 'log-entry';
      const typeClass = type === 'sys' ? 'log-sys' : 'log-user';
      const prefix = type === 'sys' ? '[SYSTEM]' : '[USER]';
      entry.innerHTML = `<span class="log-time">${time}</span><span class="${typeClass}">${prefix}</span> ${msg}`;
      logContainer.appendChild(entry);
      logContainer.scrollTop = logContainer.scrollHeight;
    }

    // Sendeplan Logik & Anzeige
    function updateSchedule() {
      const now = new Date().getHours();
      let current = schedule[schedule.length - 1]; // Fallback auf Nacht
      
      for (let s of schedule) {
        if (now >= s.h) current = s;
      }
      
      nextShowDisplay.innerText = current.title;
      return current.title;
    }

    // Radio Steuerung
    playBtn.addEventListener('click', () => {
      if (audio.paused) {
        audio.play();
        playBtn.innerText = "STOP STREAM";
        addLog("Radio-Stream gestartet.", "sys");
      } else {
        audio.pause();
        playBtn.innerText = "START STREAM";
        addLog("Radio-Stream angehalten.", "sys");
      }
    });

    // Chat
    document.getElementById('send-btn').addEventListener('click', () => {
      const input = document.getElementById('user-input');
      if (input.value.trim()) {
        addLog(input.value, 'user');
        input.value = "";
      }
    });

    // Song Update
    let currentTrack = "";
    async function updateSong() {
      try {
        const res = await fetch('https://api.laut.fm/station/treasure_radio/current_song');
        const data = await res.json();
        const newTrack = data.title.toUpperCase();
        
        if (newTrack !== currentTrack) {
          currentTrack = newTrack;
          songDisplay.innerText = currentTrack;
          addLog(`New Track: ${currentTrack}`, "sys");
        }
      } catch (e) { songDisplay.innerText = "TREASURE RADIO LIVE"; }
    }

    // Initialisierung
    addLog("System-Kernel geladen.");
    updateSchedule();
    updateSong();
    setInterval(updateSong, 20000);
    setInterval(updateSchedule, 60000);

    // Uptime
    let sec = 0;
    setInterval(() => {
      sec++;
      const h = Math.floor(sec/3600).toString().padStart(2, '0');
      const m = Math.floor((sec%3600)/60).toString().padStart(2, '0');
      const s = (sec%60).toString().padStart(2, '0');
      document.getElementById('uptime-display').innerText = `${h}:${m}:${s}`;
    }, 1000);
  </script>
</body>
</html>
