<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Schrottkiste Start</title>
    <meta name="description" content="Schrottkiste, Twitch- und YouTube-Content von Luka, Streams, Blog-Updates und Playlists.">
    <meta name="theme-color" content="#1a1a24">
    <meta name="color-scheme" content="dark">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231a1a24'/%3E%3Ctext x='50' y='70' font-family='Arial,sans-serif' font-weight='900' font-size='58' fill='%23ff0099' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Schrottkiste">
    <meta property="og:description" content="Twitch- und YouTube-Content von Luka, Streams, Blog-Updates und Playlists.">
    <meta property="og:image" content="images/image.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Schrottkiste">
    <meta name="twitter:description" content="Twitch- und YouTube-Content von Luka, Streams, Blog-Updates und Playlists.">
    <meta name="twitter:image" content="images/image.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Poppins:wght@400;600;700&family=VT323&display=swap" rel="stylesheet">

    <style>
        :root {
            --accent: #ff0099;
            --accent-alt: #00ffff;
            --bg: #1a1a24;
            --card-bg: #242430;
            --text: #f3f1ff;
            --text-secondary: #b0b0c0;
            --line-color: #3a3a4a;
            --shadow: 0 4px 20px rgba(0, 0, 0, .3);
            --radius: 12px;
            --transition: .3s cubic-bezier(.4, 0, .2, 1);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: Poppins, sans-serif;
            line-height: 1.6;
            overflow-wrap: break-word;
            top: 0 !important;
        }

        #google_translate_element,
        .skiptranslate,
        .goog-te-banner-frame {
            display: none !important;
        }

        button,
        a,
        select {
            font: inherit;
        }

        :focus-visible {
            outline: 3px solid var(--accent-alt);
            outline-offset: 3px;
            border-radius: 4px;
        }

        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 5px;
        }

        .icon {
            width: 1.1em;
            height: 1.1em;
            fill: currentColor;
            vertical-align: -.15em;
        }

        .nav-header {
            position: relative;
            top: 0;
            z-index: 1000;
            padding: 15px 5% 20px;
            background: color-mix(in srgb, var(--card-bg) 90%, transparent);
            border-bottom: 1px solid var(--line-color);
            box-shadow: 0 2px 20px rgba(0, 0, 0, .2);
            backdrop-filter: blur(10px);
        }

        .brand-row {
            display: flex;
            justify-content: center;
            margin-bottom: 15px;
        }

        .nav-brand {
            color: #fff;
            font-family: Chewy, cursive;
            font-size: 3.5rem;
            line-height: 1;
            text-decoration: none;
            text-shadow: 0 0 20px rgba(255, 0, 153, .3);
            transition: var(--transition);
        }

        .nav-brand:hover {
            transform: scale(1.05);
            text-shadow: 0 0 30px rgba(255, 0, 153, .5);
        }

        .menu-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
            padding-top: 15px;
            border-top: 1px solid var(--line-color);
        }

        .nav-links {
            display: flex;
            gap: 30px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .nav-links a {
            position: relative;
            display: inline-block;
            padding: 5px 0;
            color: #fff;
            font-size: .95rem;
            font-weight: 600;
            letter-spacing: .1em;
            text-decoration: none;
            transition: var(--transition);
        }

        .nav-links a::after {
            position: absolute;
            right: 0;
            bottom: -2px;
            left: 0;
            height: 2px;
            background: var(--accent);
            content: "";
            transform: scaleX(0);
            transform-origin: left;
            transition: transform var(--transition);
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--accent);
        }
        .nav-links a:hover::after,
        .nav-links a.active::after {
            transform: scaleX(1);
        }

        .language-select {
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--line-color);
            border-radius: 20px;
            padding: 8px 16px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            transition: var(--transition);
        }

        .language-select:hover,
        .language-select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(255, 0, 153, .4);
            color: #fff;
        }

        .language-select option {
            background: var(--card-bg);
            color: var(--text);
        }

        .mini-player {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
            padding: 12px 20px;
            background: linear-gradient(135deg, #1a1a24, #242430);
            border: 1px solid var(--line-color);
            border-radius: 30px;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }

        .mini-player:hover {
            border-color: var(--accent);
            box-shadow: 0 6px 25px rgba(255, 0, 153, .2);
        }
        .player-label {
            color: var(--accent);
            font-size: .7rem;
            font-weight: 700;
            letter-spacing: .1em;
            text-transform: uppercase;
        }

        .player-controls {
            display: flex;
            gap: 8px;
        }

        .player-controls button {
            display: grid;
            width: 36px;
            height: 36px;
            padding: 0;
            place-items: center;
            color: #fff;
            background: var(--accent);
            border: 0;
            border-radius: 50%;
            cursor: pointer;
            transition: var(--transition);
        }

        .player-controls button:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(255, 0, 153, .5);
        }
        .track-info-mini {
            min-width: 120px;
            max-width: 150px;
        }
        #song-title,
        #artist-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        #song-title {
            color: var(--accent-alt);
            font-size: .8rem;
            font-weight: 700;
        }
        #artist-name {
            color: var(--text-secondary);
            font-size: .7rem;
        }

        .visualizer {
            display: flex;
            align-items: flex-end;
            gap: 2px;
            height: 20px;
            opacity: .3;
            transition: opacity var(--transition);
        }
        .visualizer.is-playing {
            opacity: 1;
        }
        .visualizer-bar {
            width: 3px;
            height: 8px;
            background: var(--accent);
            border-radius: 2px;
            animation: visualize 1s ease-in-out infinite;
            animation-play-state: paused;
        }
        .visualizer.is-playing .visualizer-bar {
            animation-play-state: running;
        }
        .visualizer-bar:nth-child(2) { animation-delay: .1s; }
        .visualizer-bar:nth-child(3) { animation-delay: .2s; }
        .visualizer-bar:nth-child(4) { animation-delay: .3s; }
        .visualizer-bar:nth-child(5) { animation-delay: .4s; }

        @keyframes visualize {
            0%, 100% { height: 8px; }
            50% { height: 20px; }
        }

        .social-btns,
        .footer-social {
            display: flex;
            gap: 20px;
        }
        .social-btn {
            color: #fff;
            text-decoration: none;
            transition: var(--transition);
        }
        .social-btn:hover {
            transform: translateY(-3px);
        }
        .social-btn.twitch:hover {
            color: #9146ff;
            filter: drop-shadow(0 0 10px rgba(145, 70, 255, .5));
        }
        .social-btn.youtube:hover {
            color: #f00;
            filter: drop-shadow(0 0 10px rgba(255, 0, 0, .5));
        }
        .social-btn .icon {
            width: 1.8rem;
            height: 1.8rem;
        }

        .container {
            display: flex;
            align-items: flex-start;
            gap: 40px;
            max-width: 1400px;
            margin: 0 auto;
            padding: 60px 5%;
        }

        .gif-container {
            display: flex;
            flex: 0 0 200px;
            flex-direction: column;
            gap: 20px;
            position: sticky;
            top: 20px;
        }

        .gif-box {
            position: relative;
            display: block;
            width: 100%;
            aspect-ratio: 1;
            padding: 0;
            overflow: hidden;
            background: var(--card-bg);
            border: 2px solid transparent;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            cursor: pointer;
            isolation: isolate;
            transition: var(--transition);
        }

        .gif-box:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
            box-shadow: 0 8px 30px rgba(255, 0, 153, .3);
        }
        .gif-box.static-link:hover {
            border-color: var(--accent-alt);
            box-shadow: 0 8px 30px rgba(0, 255, 255, .3);
        }
        .gif-box:active {
            transform: scale(.98);
        }

        .gif-image {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity var(--transition);
        }
        .gif-image--still {
            opacity: 0;
        }
        .gif-box.is-paused .gif-image--animated {
            opacity: 0;
        }
        .gif-box.is-paused .gif-image--still {
            opacity: 1;
        }
        .gif-box::after {
            position: absolute;
            inset: 0;
            z-index: 1;
            background: linear-gradient(135deg, rgba(255, 0, 153, .2), transparent);
            content: "";
            opacity: 0;
            transition: opacity var(--transition);
        }
        .gif-box:hover::after {
            opacity: 1;
        }

        .gif-status {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 2;
            width: 12px;
            height: 12px;
            border: 2px solid #fff;
            border-radius: 50%;
        }
        .gif-status.playing {
            background: #0f0;
            box-shadow: 0 0 10px rgba(0, 255, 0, .5);
        }
        .gif-status.paused {
            background: #f00;
            box-shadow: 0 0 10px rgba(255, 0, 0, .5);
        }

        .blog-section {
            display: flex;
            flex: 2;
            flex-direction: column;
            gap: 30px;
            min-width: 0;
        }

        .blog-post {
            position: relative;
            overflow: hidden;
            padding: 35px;
            background: var(--card-bg);
            border-left: 4px solid var(--accent);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            transition: var(--transition);
        }

        .blog-post::before {
            position: absolute;
            inset: 0 auto 0 0;
            width: 4px;
            background: linear-gradient(to bottom, var(--accent), var(--accent-alt));
            content: "";
            opacity: 0;
            transition: opacity var(--transition);
        }
        .blog-post:hover {
            transform: translateX(5px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, .4);
        }
        .blog-post:hover::before {
            opacity: 1;
        }

        .post-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 15px;
        }
        .post-time,
        .reading-time {
            padding: 5px 15px;
            background: var(--bg);
            border-radius: 20px;
            font-family: VT323, monospace;
            font-size: 1.3rem;
        }
        .post-time {
            color: var(--accent-alt);
        }
        .reading-time {
            margin-left: auto;
            color: var(--accent);
        }
        .post-title {
            margin: 0 0 20px;
            color: var(--accent-alt);
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -.02em;
            line-height: 1.2;
        }

        .post-text {
            max-width: 65ch;
            margin-bottom: 20px;
            color: var(--text);
            font-size: 1.1rem;
            line-height: 1.8;
            overflow: hidden;
            transition: max-height .6s cubic-bezier(.4, 0, .2, 1), mask-image .6s cubic-bezier(.4, 0, .2, 1);
        }
        .post-text p {
            margin: 0 0 1.2em;
        }
        .post-text ul {
            margin: 0 0 1.2em;
            padding-left: 25px;
        }
        .post-text li {
            margin-bottom: .8em;
        }
        .post-text.collapsed {
            max-height: 8.5em;
            mask-image: linear-gradient(to bottom, #000 60%, transparent 100%);
        }
        .post-text:not(.collapsed) {
            mask-image: none;
        }

        .read-more {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 30px;
            color: #fff;
            background: linear-gradient(135deg, var(--accent), #cc0077);
            border: 0;
            border-radius: 25px;
            box-shadow: 0 4px 15px rgba(255, 0, 153, .3);
            cursor: pointer;
            font-size: .95rem;
            font-weight: 600;
            transition: var(--transition);
        }

        .read-more:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 0, 153, .5);
        }
        .read-more:active {
            transform: translateY(0);
        }
        .read-more .icon {
            transition: transform var(--transition);
        }
        .read-more.expanded .icon {
            transform: rotate(180deg);
        }

        .interactive-area {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 25px;
            padding-top: 25px;
            border-top: 1px solid var(--line-color);
        }
        .share-buttons {
            display: flex;
            gap: 10px;
        }
        .share-btn {
            display: grid;
            width: 40px;
            height: 40px;
            padding: 0;
            place-items: center;
            color: var(--text);
            background: var(--bg);
            border: 0;
            border-radius: 50%;
            cursor: pointer;
            transition: var(--transition);
        }
        .share-btn:hover {
            color: #fff;
            background: var(--accent);
            transform: translateY(-3px);
        }

        .sentinel {
            height: 1px;
        }

        .sidebar {
            display: flex;
            flex: 0 0 300px;
            flex-direction: column;
            position: sticky;
            top: 20px;
            max-height: calc(100vh - 160px);
            padding-left: 40px;
            border-left: 2px solid var(--line-color);
        }
        .sidebar-title {
            position: relative;
            flex-shrink: 0;
            margin: 0 0 20px;
            padding-bottom: 15px;
            color: var(--accent-alt);
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: .05em;
            text-transform: uppercase;
        }
        .sidebar-title::after {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 50px;
            height: 3px;
            background: var(--accent);
            border-radius: 2px;
            content: "";
        }
        .playlist-container {
            display: grid;
            flex: 1;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            align-content: start;
            gap: 20px;
            overflow-y: auto;
            padding-right: 8px;
        }
        .playlist-container::-webkit-scrollbar {
            width: 6px;
        }
        .playlist-container::-webkit-scrollbar-track {
            background: var(--bg);
            border-radius: 3px;
        }
        .playlist-container::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 3px;
        }
        .playlist-item {
            margin-bottom: 10px;
            text-align: center;
            transition: var(--transition);
        }
        .playlist-item:hover {
            transform: translateY(-5px);
        }
        .playlist-item a {
            display: block;
            color: inherit;
            text-decoration: none;
        }
        .playlist-title {
            display: block;
            margin-top: 8px;
            color: var(--text);
            font-size: .85rem;
            font-weight: 600;
            transition: var(--transition);
        }
        .playlist-item:hover .playlist-title {
            color: var(--accent);
        }
        .cover-img {
            display: block;
            width: 100%;
            max-width: 200px;
            margin: 0 auto;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            transition: var(--transition);
        }
        .playlist-item:hover .cover-img {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(0, 255, 255, .3);
        }

        .site-footer {
            margin-top: 80px;
            padding: 30px 5%;
            background: var(--card-bg);
            border-top: 1px solid var(--line-color);
            box-shadow: 0 -2px 20px rgba(0, 0, 0, .2);
        }
        .footer-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
            flex-wrap: wrap;
        }
        .footer-brand {
            color: #fff;
            font-family: Chewy, cursive;
            font-size: 1.5rem;
        }
        .footer-links {
            display: flex;
            gap: 15px;
        }
        .footer-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: .85rem;
            transition: var(--transition);
        }
        .footer-links a:hover {
            color: var(--accent-alt);
        }
        .footer-copy {
            color: var(--text-secondary);
            font-size: .85rem;
        }

        .scroll-to-top {
            display: none;
            position: fixed;
            right: 30px;
            bottom: 30px;
            z-index: 1000;
            width: 50px;
            height: 50px;
            padding: 0;
            place-items: center;
            color: #fff;
            background: var(--accent);
            border: 0;
            border-radius: 50%;
            box-shadow: 0 4px 15px rgba(255, 0, 153, .3);
            cursor: pointer;
            transition: var(--transition);
        }
        .scroll-to-top.visible {
            display: grid;
        }
        .scroll-to-top:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 20px rgba(255, 0, 153, .5);
        }

        .notification {
            position: fixed;
            right: 30px;
            bottom: 100px;
            z-index: 10000;
            max-width: min(90vw, 360px);
            padding: 15px 25px;
            color: #fff;
            background: var(--accent);
            border-radius: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, .3);
            font-weight: 600;
            animation: slideIn .3s ease;
        }
        .notification.error {
            background: #d33;
        }
        .notification.is-leaving {
            animation: slideOut .3s ease forwards;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes slideOut {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100%); opacity: 0; }
        }

        @media (max-width: 1024px) {
            .container {
                flex-direction: column;
                gap: 40px;
                padding: 40px 5%;
            }
            .gif-container {
                position: static;
                flex: none;
                flex-direction: row;
                justify-content: center;
                width: 100%;
                flex-wrap: wrap;
            }
            .gif-box {
                flex: 0 1 180px;
            }
            .sidebar {
                position: static;
                flex: none;
                width: 100%;
                max-height: 400px;
                padding: 30px 0 0;
                border-top: 2px solid var(--line-color);
                border-left: 0;
            }
            .playlist-container {
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
                gap: 15px;
            }
            .menu-row {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
            .nav-links {
                justify-content: center;
            }
        }

        @media (max-width: 640px) {
            .nav-brand { font-size: 2.5rem; }
            .post-title { font-size: 1.8rem; }
            .blog-post { padding: 25px; }
            .mini-player { width: 100%; }
            .footer-inner { flex-direction: column; text-align: center; }
            .scroll-to-top {
                right: 20px;
                bottom: 20px;
                width: 45px;
                height: 45px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
            }
            .gif-box:not(.is-playing) .gif-image--animated {
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <svg aria-hidden="true" width="0" height="0" style="position:absolute">
        <symbol id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></symbol>
        <symbol id="icon-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></symbol>

    <script>
        (() => {
            'use strict';

            // 0. ÜBERSETZUNG: Google Translate wird erst geladen, wenn eine Sprache gewählt wird
            let translateLoader = null;

            function loadTranslate() {
                if (translateLoader) return translateLoader;
                translateLoader = new Promise((resolve, reject) => {
                    window.googleTranslateElementInit = () => {
                        new google.translate.TranslateElement({ pageLanguage: 'de', autoDisplay: false }, 'google_translate_element');
                        resolve();
                    };
                    const script = document.createElement('script');
                    script.src = 'https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit';
                    script.async = true;
                    script.onerror = () => { translateLoader = null; reject(new Error('Translate nicht ladbar')); };
                    document.head.appendChild(script);
                });
                return translateLoader;
            }

            function waitForTranslateCombo(tries = 50) {
                return new Promise((resolve, reject) => {
                    const check = () => {
                        const combo = document.querySelector('.goog-te-combo');
                        if (combo) return resolve(combo);
                        if (--tries <= 0) return reject(new Error('Sprachauswahl nicht gefunden'));
                        setTimeout(check, 100);
                    };
                    check();
                });
            }

            async function translatePage(languageCode) {
                if (!languageCode || (languageCode === 'de' && !translateLoader)) return;
                try {
                    await loadTranslate();
                    const combo = await waitForTranslateCombo();
                    combo.value = languageCode;
                    combo.dispatchEvent(new Event('change'));
                } catch (error) {
                    showNotification('Übersetzung nicht verfügbar.', 'error');
                }
            }

            document.getElementById('language-selector').addEventListener('change', (e) => translatePage(e.target.value));

            const audio = document.getElementById('audio-player');
            const playPauseBtn = document.getElementById('play-pause-btn');
            const visualizer = document.getElementById('visualizer');
            const songTitleEl = document.getElementById('song-title');
            const artistNameEl = document.getElementById('artist-name');
            const scrollToTopBtn = document.getElementById('scrollToTop');
            const notificationRegion = document.getElementById('notification-region');
            const blogPostsContainer = document.getElementById('blog-posts-container');
            const sentinel = document.getElementById('sentinel');

            const playIcon = '<svg class="icon" aria-hidden="true"><use href="#icon-play"></use></svg>';
            const pauseIcon = '<svg class="icon" aria-hidden="true"><use href="#icon-pause"></use></svg>';

            function syncPlayerUi() {
                const playing = !audio.paused;
                playPauseBtn.innerHTML = playing ? pauseIcon : playIcon;
                playPauseBtn.setAttribute('aria-label', playing ? 'Radio pausieren' : 'Radio abspielen');
                playPauseBtn.setAttribute('aria-pressed', String(playing));
                visualizer.classList.toggle('is-playing', playing);
            }

            async function togglePlay() {
                try {
                    if (audio.paused) {
                        await audio.play();
                    } else {
                        audio.pause();
                    }
                } catch (error) {
                    syncPlayerUi();
                    showNotification('Klicke erneut zum Abspielen.', 'error');
                }
            }

            playPauseBtn.addEventListener('click', togglePlay);
            audio.addEventListener('play', syncPlayerUi);
            audio.addEventListener('pause', syncPlayerUi);
            audio.addEventListener('ended', syncPlayerUi);
            audio.addEventListener('error', () => {
                syncPlayerUi();
                songTitleEl.textContent = 'Offline';
                artistNameEl.textContent = 'Stream nicht erreichbar';
                showNotification('Radio-Stream nicht verfügbar.', 'error');
            });

            // Track-Info: einmal beim Laden, danach nur alle 15 s, solange das Radio läuft und der Tab sichtbar ist
            let trackInfoTimer = null;
            let trackInfoRequestActive = false;
            let trackInfoLoaded = false;
            const trackInfoInterval = 15000;

            async function fetchTrackInfo() {
                if (document.hidden || trackInfoRequestActive) return;
                trackInfoRequestActive = true;
                try {
                    const response = await fetch('https://api.laut.fm/station/treasure_radio/current_song', { headers: { Accept: 'application/json' } });
                    if (!response.ok) throw new Error('Track-Info konnte nicht geladen werden.');
                    const data = await response.json();
                    songTitleEl.textContent = data.title || 'Treasure Radio';
                    artistNameEl.textContent = data.artist && data.artist.name ? data.artist.name : 'Live Stream';
                    trackInfoLoaded = true;
                } catch (error) {
                    songTitleEl.textContent = 'Nicht verfügbar';
                    artistNameEl.textContent = 'Verbindungsfehler';
                } finally {
                    trackInfoRequestActive = false;
                }
            }

            function scheduleTrackInfo() {
                clearTimeout(trackInfoTimer);
                if (document.hidden || audio.paused) return;
                trackInfoTimer = window.setTimeout(async () => {
                    await fetchTrackInfo();
                    scheduleTrackInfo();
                }, trackInfoInterval);
            }

            audio.addEventListener('play', () => { fetchTrackInfo(); scheduleTrackInfo(); });
            audio.addEventListener('pause', () => clearTimeout(trackInfoTimer));
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden && (!trackInfoLoaded || !audio.paused)) fetchTrackInfo();
                scheduleTrackInfo();
            });
            fetchTrackInfo();

            const gif1 = document.getElementById('gif1');
            const status1 = document.getElementById('status1');
            
            function toggleGif() {
                const paused = gif1.classList.toggle('is-paused');
                gif1.classList.toggle('is-playing', !paused);
                gif1.setAttribute('aria-pressed', String(!paused));
                gif1.setAttribute('aria-label', paused ? 'Deutschland-GIF abspielen' : 'Deutschland-GIF anhalten');
                status1.classList.toggle('playing', !paused);
                status1.classList.toggle('paused', paused);
            }

            gif1.addEventListener('click', toggleGif);

            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) toggleGif();

            function bindBlogEvents(article, post) {
                const button = article.querySelector('[data-toggle-text]');
                if (button) {
                    button.addEventListener('click', () => {
                        const text = document.getElementById(button.dataset.toggleText);
                        const isCollapsed = text.classList.contains('collapsed');
                        if (isCollapsed) {
                            text.classList.remove('collapsed');
                            text.style.maxHeight = text.scrollHeight + 'px';
                            button.querySelector('span').textContent = 'Einklappen';
                            button.classList.add('expanded');
                            button.setAttribute('aria-expanded', 'true');
                            window.setTimeout(() => { text.style.maxHeight = 'none'; }, 600);
                        } else {
                            text.style.maxHeight = text.scrollHeight + 'px';
                            requestAnimationFrame(() => {
                                text.classList.add('collapsed');
                                text.style.maxHeight = '8.5em';
                            });
                            button.querySelector('span').textContent = 'Weiterlesen';
                            button.classList.remove('expanded');
                            button.setAttribute('aria-expanded', 'false');
                        }
                    });
                }

                const postShareBtn = article.querySelector('[data-share]');
                if (postShareBtn) {
                    postShareBtn.addEventListener('click', async () => {
                        if (navigator.share) {
                            try {
                                await navigator.share({ title: post.title, url: window.location.href });
                                return;
                            } catch (error) {
                                if (error.name === 'AbortError') return;
                            }
                        }
                        await copyLink();
                    });
                }

                const copyBtn = article.querySelector('[data-copy-link]');
                if (copyBtn) {
                    copyBtn.addEventListener('click', copyLink);
                }
            }

            async function copyLink() {
                try {
                    await navigator.clipboard.writeText(window.location.href);
                    showNotification('Link kopiert! 📋');
                } catch (err) {
                    showNotification('Fehler beim Kopieren.', 'error');
                }
            }

            const newPost = {
                id: "post-stressigste-woche",
                datetime: "2026-10-16T15:07:00",
                dateFormatted: "16.10.2026 - 15:07 Uhr",
                readingTime: "2 Min.",
                title: "Die Stressigste Woche",
                paragraphs: [
                    "Manchmal reicht ein einziger Anruf, um das komplette Leben von einer Sekunde auf die andere aus den Angeln zu heben. Genau so begann diese Woche – eine Woche, die sich rückblickend wie der pure Ausnahmezustand anfühlt und mir mental sowie körperlich alles abverlangt hat.",
                    "Alles fing damit an, dass meine Mutter wegen eines schweren Asthmaanfalls, begleitet von einer massiven Panikattacke, ins Krankenhaus eingeliefert werden musste. In solchen Momenten zählt eigentlich nur eines: Sorge um einen geliebten Menschen, Hoffnung auf Besserung und das Bedürfnis, erst einmal durchzuatmen. Doch genau dafür war absolut kein Raum. 🚑",
                    "Stattdessen fand ich mich in einem Umfeld wieder, das die Situation nur noch schlimmer machte. Bis Donnerstag war ich einer Familienatmosphäre ausgesetzt, die schlichtweg toxisch ist: Hier wird der Wert eines Menschen einzig und allein an seiner messbaren Leistung festgemacht. Wer nicht pausenlos funktioniert, leistet in ihren Augen nichts. Was nicht schwarz auf weiß belegt oder direkt sichtbar abgearbeitet werden kann, existiert nicht oder wird schlichtweg ignoriert.",
                    "Das bedeutete für mich: Dauerfeuer. Ich wurde pausenlos dazu gedrängt, irgendwo mitzuhelfen, Aufgaben zu übernehmen und Handlanger für alles Mögliche zu spielen. Das Schlimmste daran war die Erwartungshaltung – alles musste sofort passieren. Keine Sekunde Verzögerung, kein Raum für Fehler, keine Empathie für den emotionalen Ballast, den ich durch den Krankenhausaufenthalt meiner Mutter ohnehin schon mit mir herumschleppte.",
                    "Sobald irgendetwas nicht haargenau in das starre Weltbild dieser Menschen passte oder nicht nach ihrem Zeitplan lief, wurde genörgelt, gemeckert und Druck aufgebaut. Eine ständige Welle aus Nörgelei und unberechtigten Vorwürfen. 🤯",
                    "Ich kam in diesen Tagen gefühlt kein einziges Mal zur Ruhe. Mein Nervensystem war im Daueralarmzustand – es war ohne Übertreibung der Stress meines Lebens. Es ging nicht darum, als Familie zusammenzustehen und sich gegenseitig zu stützen, sondern darum, ein unbarmherziges Funktionieren einzufordern.",
                    "Erst seit Donnerstag, als ich diesem Umfeld endlich entkommen konnte, merke ich überhaupt, wie sehr mich diese Tage ausgelaugt haben. Diese Woche hat mir einmal mehr schmerzhaft gezeigt, wie tief der Graben zwischen echtem Mitgefühl und kalter Leistungsorientierung sein kann – und wie wichtig es ist, sich abzugrenzen, wenn das eigene Wohlbefinden auf der Strecke bleibt."
                ]
            };

            let allPosts = [];
            let renderedCount = 0;
            const BATCH_SIZE = 3;

            function renderNextBatch() {
                if (renderedCount >= allPosts.length) return;

                const nextPosts = allPosts.slice(renderedCount, renderedCount + BATCH_SIZE);

                nextPosts.forEach((post) => {
                    const article = document.createElement('article');
                    article.className = 'blog-post';
                    article.setAttribute('itemscope', '');
                    article.setAttribute('itemtype', 'https://schema.org/BlogPosting');

                    let contentHtml = '';
                    if (post.paragraphs) {
                        contentHtml = post.paragraphs.map(p => `<p>${p}</p>`).join('');
                    } else if (post.listItems) {
                        contentHtml = `<ul>${post.listItems.map(item => `<li>${item}</li>`).join('')}</ul>`;
                    }

                    article.innerHTML = `
                        <div class="post-meta">
                            <time class="post-time" datetime="${post.datetime}" itemprop="datePublished">${post.dateFormatted}</time>
                            <span class="reading-time">${post.readingTime}</span>
                        </div>
                        <h2 class="post-title" itemprop="headline">${post.title}</h2>
                        <div class="post-text collapsed" id="${post.id}" itemprop="articleBody">
                            ${contentHtml}
                        </div>
                        <button class="read-more" type="button" data-toggle-text="${post.id}" aria-expanded="false">
                            <span>Weiterlesen</span>
                            <svg class="icon" aria-hidden="true"><use href="#icon-chevron"></use></svg>
                        </button>
                        <div class="interactive-area">
                            <div class="share-buttons">
                                <button class="share-btn" type="button" data-share aria-label="Beitrag teilen">
                                    <svg class="icon" aria-hidden="true"><use href="#icon-share"></use></svg>
                                </button>
                                <button class="share-btn" type="button" data-copy-link aria-label="Link kopieren">
                                    <svg class="icon" aria-hidden="true"><use href="#icon-link"></use></svg>
                                </button>
                            </div>
                        </div>
                    `;

                    blogPostsContainer.appendChild(article);
                    bindBlogEvents(article, post);
                });

                renderedCount += nextPosts.length;

                if (!scrollObserver) return;
                // Neu beobachten, damit weitergeladen wird, falls der Sentinel noch im Sichtbereich liegt
                scrollObserver.unobserve(sentinel);
                if (renderedCount < allPosts.length) scrollObserver.observe(sentinel);
            }

            let scrollObserver = null;

            function initInfiniteScroll() {
                if ('IntersectionObserver' in window) {
                    scrollObserver = new IntersectionObserver((entries) => {
                        if (entries[0].isIntersecting) {
                            renderNextBatch();
                        }
                    }, { rootMargin: '200px' });
                    scrollObserver.observe(sentinel);
                } else {
                    while (renderedCount < allPosts.length) renderNextBatch();
                }
            }

            async function initBlog() {
                try {
                    const response = await fetch('posts.json');
                    if (response.ok) {
                        const jsonPosts = await response.json();
                        // Prüfen ob newPost schon in der JSON enthalten ist (verhindert Dopplung)
                        const hasNewPost = jsonPosts.some(p => p.id === newPost.id);
                        allPosts = hasNewPost ? jsonPosts : [newPost, ...jsonPosts];
                    } else {
                        allPosts = [newPost];
                    }
                } catch (error) {
                    allPosts = [newPost];
                }

                if (allPosts.length === 0) {
                    blogPostsContainer.innerHTML = '<p>Keine Beiträge vorhanden.</p>';
                    return;
                }

                renderNextBatch();
                initInfiniteScroll();
            }

            initBlog();

            function showNotification(message, type) {
                notificationRegion.replaceChildren();
                const notification = document.createElement('div');
                notification.className = type === 'error' ? 'notification error' : 'notification';
                notification.setAttribute('role', 'status');
                notification.textContent = message;
                notificationRegion.appendChild(notification);
                window.setTimeout(() => {
                    notification.classList.add('is-leaving');
                    window.setTimeout(() => notification.remove(), 300);
                }, 3000);
            }

            function updateScrollButton() { scrollToTopBtn.classList.toggle('visible', window.scrollY > 300); }
            let scrollTicking = false;
            window.addEventListener('scroll', () => {
                if (scrollTicking) return;
                scrollTicking = true;
                requestAnimationFrame(() => {
                    updateScrollButton();
                    scrollTicking = false;
                });
            }, { passive: true });
            scrollToTopBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
            updateScrollButton();

            const playlists = [
                { id: 'PLQLA52U7_qBOkmumSrvGZbE3CPPGqoLQX', title: 'Top 2026 Songs', img: 'images/Top 2026 Songs.jpg' },
                { id: 'PLQLA52U7_qBPJNw536VhdzwEmSeVHGCqx', title: 'Besties 2025', img: 'https://yt3.googleusercontent.com/mIfMI24dPL3domSKuXB1kp0UK3vGbGGz-AIigfL7TVYX-44Aa5qCIAe_M2SZkfcUrxK5tRRmaV5S=s1200' },
                { id: 'PLQLA52U7_qBPqddrF9dAD9pR5HOhI-zpq', title: 'Top 2024 Songs', img: 'https://yt3.googleusercontent.com/bwvqY8YfSHryodS5-vnmiZBk8CGAHkUP1VUgEGQCjW_dup4NEwuo44utrnEqfOPGHfygWRigMl5e=s1200' },
                { id: 'PLQLA52U7_qBN4VcQskCzUQoONu-RMwgwP', title: '2023 Songs', img: 'https://yt3.googleusercontent.com/7tVbVfKecy9cOesRKiIeRJqSGUew64w1v_zxwt4m1BfrzCnqTQyOxI9PcDzvQB6mAv3WsTBWvJI=s1200' },
                { id: 'PLQLA52U7_qBNL4S4PhAzWYsu15Ta2q80B', title: 'Top 100 2022', img: 'https://yt3.googleusercontent.com/Ov8Nj8xO6PX5aqvqhmbZrfxbH0h67eytCk6loJNC864Hmo-WtNHwi0_DWB_FdJseo8G0xA2iL_Y=s1200' }
            ];

            const playlistContainer = document.getElementById('playlist-container');
            const fallbackImage = (title) => 'data:image/svg+xml,' + encodeURIComponent(
                '<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect width="200" height="200" fill="#242430"/><text x="100" y="110" fill="#ff0099" text-anchor="middle" font-size="16">' +
                title + '</text></svg>');
            playlists.forEach((playlist) => {
                const item = document.createElement('div');
                item.className = 'playlist-item';
                const link = document.createElement('a');
                link.href = 'https://music.youtube.com/playlist?list=' + encodeURIComponent(playlist.id);
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
                link.setAttribute('aria-label', 'Playlist ' + playlist.title + ' auf YouTube Music öffnen');
                const image = document.createElement('img');
                image.className = 'cover-img';
                image.src = playlist.img;
                image.alt = playlist.title;
                image.width = 200;
                image.height = 200;
                image.loading = 'lazy';
                image.decoding = 'async';
                image.addEventListener('error', () => { image.src = fallbackImage(playlist.title); }, { once: true });
                const title = document.createElement('span');
                title.className = 'playlist-title';
                title.textContent = playlist.title;
                link.appendChild(image);
                item.append(link, title);
                playlistContainer.appendChild(item);
            });
        })();
    </script>

    <!-- Herbst: Blätter fallen, landen auf dem Footer, bilden dort einen begrenzten Haufen und lassen sich mit der Maus aufwirbeln -->
    <script>
    (() => {
        'use strict';

        const canvas = document.getElementById('leaf-canvas');
        const footer = document.querySelector('.site-footer');   // Landefläche für die Blätter
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const pileCanvas = document.createElement('canvas');
        const pctx = pileCanvas.getContext('2d');

        // ===== Einstellungen =====
        const LEAF_COUNT = 16;      // gleichzeitig fallende Blätter
        const MAX_LANDED = 160;     // so viele Blätter braucht der Haufen, bis er fertig ist (danach wächst er nicht mehr)
        const HEAP_POS = 0.0;       // Lage des Haufens auf dem Footer: 0 = links, 0.5 = Mitte, 1 = rechts
        const HEAP_MAX_H = 110;     // maximale Höhe des fertigen Haufens (px)
        const HEAP_HALF_W = 210;    // halbe Breite des Haufens (px)
        const REST_S = 0.8;         // Blätter neben dem Haufen (oder bei vollem Haufen) bleiben so lange liegen
        const HAND_RADIUS = 55;     // Reichweite der "Hand" (Maus) beim Aufwirbeln (px)
        const HAND_MIN_SPEED = 120; // so schnell muss die Maus sein, damit sie wirbelt (px/s)
        const GRAVITY = 420;        // Schwerkraft für aufgewirbelte Blätter (px/s²)
        const MAX_GROUND = 35;      // so viele Blätter dürfen verstreut neben dem Haufen liegen (älteste verblassen)

        const colors = ['#d6601a', '#c0392b', '#e0a526', '#8b5a2b', '#e8731a', '#a8431c', '#d9a441', '#b5651d'];
        const sizes = [30, 36, 42, 48];
        const shapes = [
            {
                body: new Path2D('M50 4 C78 26 86 62 50 96 C14 62 22 26 50 4 Z'),
                vein: new Path2D('M50 14 L50 96 M50 40 L32 28 M50 40 L68 28 M50 62 L30 50 M50 62 L70 50')
            },
            {
                body: new Path2D('M50 4 L59 24 L74 14 L69 36 L92 31 L79 50 L96 58 L72 63 L76 78 L57 71 L54 94 L46 94 L43 71 L24 78 L28 63 L4 58 L21 50 L8 31 L31 36 L26 14 L41 24 Z'),
                vein: new Path2D('M50 94 L50 30 M50 62 L28 52 M50 62 L72 52 M50 44 L36 30 M50 44 L64 30')
            }
        ];

        let W = 0, H = 0, dpr = 1, last = 0;
        let cx = 0, halfW = 0, maxH = 0, pileH = 0;
        let ground = 0;             // Oberkante des Footers (px vom oberen Fensterrand)
        let fill = 0;               // 0 = kein Haufen, 1 = fertiger Haufen
        let landed = [], fallers = [];

        // Maus ("Hand")
        const hand = { x: 0, y: 0, vx: 0, vy: 0, t: 0, active: false };

        // Form des Haufens: läuft nach oben spitz zu, bleibt oben aber rund (u von -1 bis 1)
        function profile(u) {
            if (u <= -1 || u >= 1) return 0;
            const bell = Math.pow((1 + Math.cos(Math.PI * u)) / 2, 1.35);
            return bell * (1 + 0.05 * Math.sin(u * 6 + 0.8));
        }
        function surfaceAt(x) {
            return fill * maxH * profile((x - cx) / halfW);
        }
        // Lage eines gelandeten Blatts (relativ zur Unterkante des Haufens)
        function heapLeafHeight(l) {
            return Math.min(l.f, fill) * maxH * profile(l.u) - l.size * 0.12;
        }

        function drawLeaf(c, x, y, size, rotDeg, color, shape, alpha) {
            c.save();
            c.globalAlpha = alpha;
            c.translate(x, y);
            c.rotate(rotDeg * Math.PI / 180);
            c.scale(size / 100, size / 100);
            c.translate(-50, -50);
            c.fillStyle = color;
            c.fill(shapes[shape].body);
            c.strokeStyle = 'rgba(0,0,0,.28)';
            c.lineWidth = 2.5;
            c.lineCap = 'round';
            c.stroke(shapes[shape].vein);
            c.restore();
        }

        // Zeichnet den kompletten Haufen neu: Schatten, Körper, dann alle gelandeten Blätter
        function redrawPile() {
            pctx.clearRect(0, 0, W, pileH);
            if (fill <= 0) return;
            const top = pileH - fill * maxH;

            // weicher Schatten auf dem Footer
            pctx.save();
            pctx.fillStyle = 'rgba(0,0,0,.35)';
            pctx.filter = 'blur(6px)';
            pctx.beginPath();
            pctx.ellipse(cx, pileH - 2, halfW * 0.95, 8 + fill * 6, 0, 0, Math.PI * 2);
            pctx.fill();
            pctx.restore();

            // Körper des Haufens (dunkles Laub im Inneren)
            const grad = pctx.createLinearGradient(0, top, 0, pileH);
            grad.addColorStop(0, '#9a4a1c');
            grad.addColorStop(0.5, '#7a3b17');
            grad.addColorStop(1, '#4a2410');
            pctx.fillStyle = grad;
            pctx.beginPath();
            pctx.moveTo(cx - halfW, pileH);
            for (let i = 0; i <= 80; i++) {
                const u = -1 + (2 * i) / 80;
                pctx.lineTo(cx + u * halfW, pileH - Math.max(0, fill * maxH * profile(u) - 6));
            }
            pctx.lineTo(cx + halfW, pileH);
            pctx.closePath();
            pctx.fill();

            // gelandete Blätter: ältere liegen tiefer im Haufen und sind dunkler, neue obenauf
            for (let i = 0; i < landed.length; i++) {
                const l = landed[i];
                const x = cx + l.u * halfW;
                const y = pileH - heapLeafHeight(l);
                drawLeaf(pctx, x, y, l.size, l.rot, l.color, l.shape, 1);
                const shade = 0.55 + 0.45 * (Math.min(l.f, fill) / fill);
                if (shade < 1) {
                    pctx.save();
                    pctx.globalAlpha = 1 - shade;
                    pctx.globalCompositeOperation = 'source-atop';
                    pctx.fillStyle = '#2a1408';
                    pctx.fillRect(x - l.size, y - l.size, l.size * 2, l.size * 2);
                    pctx.restore();
                }
            }
        }

        function makeFaller(initial) {
            const size = sizes[Math.floor(Math.random() * sizes.length)];
            const baseX = (0.03 + Math.random() * 0.94) * W;
            // Blätter in der Nähe des Haufens treiben langsam zu ihm hin (wie vom Wind zusammengeweht)
            const toHeap = Math.abs(baseX - cx) < halfW * 2;
            const u = (Math.random() + Math.random() + Math.random()) / 1.5 - 1; // leicht zur Mitte gewichtet
            return {
                size: size,
                color: colors[Math.floor(Math.random() * colors.length)],
                shape: Math.random() < 0.5 ? 0 : 1,
                baseX: baseX,
                targetX: toHeap ? cx + u * halfW * 0.92 : baseX,
                amp: Math.min(W * 0.03, 40) * (0.6 + Math.random() * 0.5),
                period: 7 + Math.random() * 5,
                phase: Math.random() * Math.PI * 2,
                speed: (H + size) / (12 + Math.random() * 7),
                y: initial ? Math.random() * H * 0.9 - size : -size,
                x: baseX,
                rot: 0,
                t: 0,
                alpha: 1,
                mode: 'fall',      // fall = normal fallen, free = aufgewirbelt, rest = liegt kurz
                vx: 0, vy: 0, spin: 0,
                restOff: 0, restT: 0,
                extra: false,      // aufgewirbelte Haufen-Blätter verschwinden nach der Landung wieder aus der Liste
                dead: false
            };
        }

        function recycle(f) {
            if (f.extra) f.dead = true;
            else Object.assign(f, makeFaller(false));
        }

        function landHeap(f) {
            if (landed.length >= MAX_LANDED) return false;
            fill = Math.min(1, fill + 1 / MAX_LANDED);
            landed.push({
                u: (f.x - cx) / halfW,
                f: fill,
                size: f.size,
                rot: f.rot + (Math.random() * 60 - 30),
                color: f.color,
                shape: f.shape
            });
            redrawPile();
            return true;
        }

        // Wirbelt ein Blatt auf (fallend oder am Boden liegend)
        function kick(f, strength) {
            if (f.mode !== 'free') {
                f.vx = 0;
                f.vy = f.mode === 'fall' ? f.speed : 0;
                f.spin = 0;
                f.mode = 'free';
                f.alpha = 1;
            }
            f.vx += hand.vx * 0.55 * strength + (Math.random() - 0.5) * 80;
            f.vy += hand.vy * 0.45 * strength - (120 + Math.random() * 160) * strength;
            f.spin += (Math.random() - 0.5) * 900;
        }

        // Prüft, ob die Hand gerade Blätter auf dem Haufen erwischt, und wirbelt die obersten auf
        function stirHeap() {
            if (!landed.length || ground - pileH > H) return;
            let kicked = 0;
            for (let i = landed.length - 1; i >= 0 && kicked < 4; i--) {
                const l = landed[i];
                if (Math.min(l.f, fill) < fill - 0.18) continue;   // tief vergrabene Blätter bleiben liegen
                const x = cx + l.u * halfW;
                const y = ground - heapLeafHeight(l);
                const dx = x - hand.x, dy = y - hand.y;
                if (dx * dx + dy * dy > Math.pow(HAND_RADIUS + l.size * 0.3, 2)) continue;

                landed.splice(i, 1);
                fill = Math.max(0, fill - 1 / MAX_LANDED);
                const f = makeFaller(false);
                Object.assign(f, {
                    size: l.size, color: l.color, shape: l.shape, rot: l.rot,
                    x: x, y: y, extra: true, mode: 'free',
                    vx: 0, vy: 0, spin: 0
                });
                kick(f, 1.2);
                fallers.push(f);
                kicked++;
            }
            if (kicked) redrawPile();
        }

        // Blatt bleibt verstreut auf dem Footer liegen
        function placeOnGround(f) {
            const g = makeFaller(false);
            Object.assign(g, {
                size: f.size, color: f.color, shape: f.shape,
                x: f.x, extra: true, mode: 'ground',
                rot: (Math.random() < 0.5 ? 90 : -90) + (Math.random() - 0.5) * 50,  // liegt flach
                restOff: -f.size * 0.12
            });
            g.y = ground + g.restOff;
            fallers.push(g);
            const lying = fallers.filter((x) => x.mode === 'ground');
            if (lying.length > MAX_GROUND) {
                lying[0].mode = 'rest';         // ältestes Blatt verblasst
                lying[0].restT = REST_S;
            }
        }

        function hitGround(f) {
            const onHeap = Math.abs(f.x - cx) < halfW;
            const landY = ground - surfaceAt(f.x) - f.size * 0.1;
            if (ground < H + f.size && f.y >= landY) {
                if (onHeap && landHeap(f)) {
                    recycle(f);
                } else if (!onHeap) {
                    placeOnGround(f);           // neben dem Haufen: bleibt auf dem Boden liegen
                    recycle(f);
                } else {
                    f.mode = 'rest';            // Haufen voll: kurz liegen, dann weg
                    f.restOff = landY - ground;
                    f.restT = 0;
                }
                return true;
            }
            if (f.y > H + f.size) {
                // Footer liegt weiter unten auf der Seite: das Blatt fällt dort hin und landet trotzdem
                if (onHeap) landHeap(f);
                else if (f.extra) placeOnGround(f);
                recycle(f);
                return true;
            }
            return false;
        }

        function updateFaller(f, dt) {
            if (f.mode === 'ground') {
                f.y = ground + f.restOff;     // liegt auf dem Footer und scrollt mit
                return;
            }
            if (f.mode === 'rest') {
                f.y = ground + f.restOff;     // bewegt sich beim Scrollen mit dem Footer mit
                f.restT += dt;
                if (f.restT > REST_S) f.alpha -= dt / 0.5;
                if (f.alpha <= 0) recycle(f);
                return;
            }

            if (f.mode === 'free') {
                // aufgewirbelt: Schwung, Luftwiderstand, Schwerkraft, langsames Herabschaukeln
                f.t += dt;
                const drag = Math.exp(-1.8 * dt);
                f.vx *= drag;
                f.vy += GRAVITY * dt;
                if (f.vy > f.speed) f.vy = f.speed + (f.vy - f.speed) * Math.exp(-4 * dt);
                f.spin *= Math.exp(-1.5 * dt);
                f.x += (f.vx + Math.sin(f.t * 2.2 + f.phase) * 25) * dt;
                f.y += f.vy * dt;
                f.rot += f.spin * dt;
                if (f.x < -f.size) f.x = W + f.size;
                if (f.x > W + f.size) f.x = -f.size;
                if (f.vy > 0) hitGround(f);
                return;
            }

            // normal fallen
            f.t += dt;
            f.y += f.speed * dt;
            const a = (f.t / f.period) * Math.PI * 2 + f.phase;
            const p = Math.min(1, Math.max(0, f.y / Math.min(H, ground)));
            const drift = p * p * (3 - 2 * p);   // sanft beschleunigtes Hintreiben zum Haufen
            f.x = f.baseX + (f.targetX - f.baseX) * drift + f.amp * Math.sin(a) * (1 - 0.6 * drift);
            f.rot = 2.5 + 37.5 * Math.sin(a);
            hitGround(f);
        }

        function resize() {
            dpr = window.devicePixelRatio || 1;
            W = window.innerWidth;
            H = window.innerHeight;
            halfW = Math.min(HEAP_HALF_W, W * 0.3);
            maxH = HEAP_MAX_H * (halfW / HEAP_HALF_W);
            cx = halfW + HEAP_POS * (W - 2 * halfW);
            pileH = Math.ceil(maxH + 40);
            canvas.width = Math.round(W * dpr);
            canvas.height = Math.round(H * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            pileCanvas.width = Math.round(W * dpr);
            pileCanvas.height = Math.round(pileH * dpr);
            pctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            redrawPile();
        }

        function frame(now) {
            const dt = Math.min(0.05, (now - last) / 1000 || 0);
            last = now;
            ground = footer ? footer.getBoundingClientRect().top : H;

            // Hand: Schwung klingt ab, wenn die Maus stillsteht
            const handSpeed = Math.hypot(hand.vx, hand.vy);
            const stirring = hand.active && handSpeed > HAND_MIN_SPEED;
            hand.vx *= Math.exp(-8 * dt);
            hand.vy *= Math.exp(-8 * dt);

            // Nur der Haufen lässt sich aufwirbeln, Blätter im Flug sind unantastbar
            if (stirring) stirHeap();

            ctx.clearRect(0, 0, W, H);
            if (ground - pileH < H) ctx.drawImage(pileCanvas, 0, ground - pileH, W, pileH);
            for (let i = 0; i < fallers.length; i++) {
                const f = fallers[i];
                updateFaller(f, dt);
                if (!f.dead) drawLeaf(ctx, f.x, f.y, f.size, f.rot, f.color, f.shape, Math.max(0, f.alpha));
            }
            if (fallers.some((f) => f.dead)) fallers = fallers.filter((f) => !f.dead);
            requestAnimationFrame(frame);
        }

        // Mausbewegung verfolgen (die Leinwand selbst lässt alle Klicks durch)
        window.addEventListener('pointermove', (e) => {
            const now = performance.now();
            const dtm = Math.max(0.008, (now - hand.t) / 1000);
            if (hand.active && dtm < 0.2) {
                hand.vx = hand.vx * 0.5 + ((e.clientX - hand.x) / dtm) * 0.5;
                hand.vy = hand.vy * 0.5 + ((e.clientY - hand.y) / dtm) * 0.5;
            }
            hand.x = e.clientX;
            hand.y = e.clientY;
            hand.t = now;
            hand.active = true;
        }, { passive: true });
        document.addEventListener('pointerleave', () => { hand.active = false; });
        window.addEventListener('blur', () => { hand.active = false; });

        resize();
        ground = footer ? footer.getBoundingClientRect().top : H;
        for (let i = 0; i < LEAF_COUNT; i++) fallers.push(makeFaller(true));
        window.addEventListener('resize', () => {
            resize();
            fallers.forEach((f) => { if (f.mode === 'fall') Object.assign(f, makeFaller(true)); });
        });
        requestAnimationFrame(frame);
    })();
    </script>
