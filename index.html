<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schrottkiste – Music Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root { 
        --yt-bg: #0f0f0f; 
        --yt-surface: #1e1e1e; 
        --yt-text: #ffffff; 
        --yt-text-sec: #aaaaaa; 
        --yt-red: #ff0000; 
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--yt-bg); font-family: 'Roboto', sans-serif; color: var(--yt-text); }
    
    /* Header */
    .nav-header { background: #0f0f0f; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 100; }
    .nav-brand { font-size: 1.5rem; font-weight: 700; color: #fff; text-decoration: none; display: flex; align-items: center; gap: 8px; }
    .nav-brand i { color: var(--yt-red); }
    
    .page-wrapper { display: flex; flex-direction: row; padding: 24px 5%; gap: 32px; max-width: 1400px; margin: 0 auto; }
    .main-content { flex: 3; }
    .sidebar { flex: 1; min-width: 300px; }
    
    h2 { font-size: 1.5rem; margin-bottom: 20px; font-weight: 500; }

    /* Playlist Liste (YT Music Style) */
    .playlist-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .playlist-item { 
        display: flex; align-items: center; gap: 16px; padding: 10px; border-radius: 8px; 
        text-decoration: none; color: white; transition: background 0.2s;
    }
    .playlist-item:hover { background: #272727; }
    .thumb-wrap { position: relative; width: 48px; height: 48px; }
    .thumb-wrap img { width: 100%; height: 100%; border-radius: 4px; object-fit: cover; }

    /* Video Feed */
    #video-feed { display: grid; gap: 16px; grid-template-columns: repeat(3, 1fr); }
    .video-wrapper { background: transparent; }
    .responsive-embed { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 12px; }
    .responsive-embed iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    
    .action-btn { 
        background: var(--yt-red); color: white; border: none; padding: 12px 24px; 
        font-weight: 500; border-radius: 20px; cursor: pointer; transition: 0.2s; 
    }
    .action-btn:hover { background: #cc0000; }

    footer { padding: 40px; text-align: center; color: #717171; font-size: 0.9rem; }
    
    @media (max-width: 900px) { .page-wrapper { flex-direction: column; } #video-feed { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <nav class="nav-header">
    <a href="#" class="nav-brand"><i class="fa-brands fa-youtube"></i> Schrottkiste</a>
  </nav>

  <div class="page-wrapper">
    <div class="main-content">
        <h2>Aktuelle Videos</h2>
        <div id="video-feed">Lade Inhalte...</div>
        
        <div style="margin-top: 40px; padding: 24px; background: var(--yt-surface); border-radius: 12px;">
            <h2>Shuffle Mode</h2>
            <button class="action-btn" onclick="playRandomVideo()">Zufälliges Video abspielen</button>
        </div>
    </div>

    <aside class="sidebar">
        <h2>Deine Jahresplaylists</h2>
        <ul id="playlist-container" class="playlist-list">
            <li>Lade Playlists...</li>
        </ul>
    </aside>
  </div>

  <script>
    const API_KEY = 'AIzaSyBjXEtn67lwtWcbRo95C7k3V0egrhkjygM';
    const playlistIds = ['PLQLA52U7_qBOkmumSrvGZbE3CPPGqoLQX','PLQLA52U7_qBPqddrF9dAD9pR5HOhI-zpq','PLQLA52U7_qBNL4S4PhAzWYsu15Ta2q80B','PLQLA52U7_qBPJNw536VhdzwEmSeVHGCqx'];

    async function loadFeed() {
      const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=https://www.youtube.com/feeds/videos.xml?channel_id=UCiCt3UwZjOAFpF5Yce6DhLA`);
      const data = await res.json();
      document.getElementById('video-feed').innerHTML = data.items.slice(0, 6).map(item => `
        <div class="video-wrapper">
          <div class="responsive-embed"><iframe src="https://www.youtube.com/embed/${item.link.split('v=')[1]}" allowfullscreen></iframe></div>
          <div style="margin-top:8px; font-size: 0.9rem;">${item.title}</div>
        </div>`).join('');
    }

    async function loadPlaylistMetadata() {
        const container = document.getElementById('playlist-container');
        const res = await fetch(`https://www.googleapis.com/youtube/v3/playlists?part=snippet,contentDetails&id=${playlistIds.join(',')}&key=${API_KEY}`);
        const data = await res.json();
        container.innerHTML = data.items.map(pl => `
            <li>
                <a href="https://music.youtube.com/playlist?list=${pl.id}" target="_blank" class="playlist-item">
                    <div class="thumb-wrap"><img src="${pl.snippet.thumbnails.default.url}"></div>
                    <div>
                        <div style="font-weight: 500;">${pl.snippet.title}</div>
                        <div style="font-size: 0.8rem; color: var(--yt-text-sec);">${pl.contentDetails.itemCount} Tracks</div>
                    </div>
                </a>
            </li>
        `).join('');
    }

    function playRandomVideo() {
        // Logik für Shuffle bleibt bestehen
        window.open('https://www.youtube.com/@schrottkiste/videos', '_blank');
    }

    loadFeed(); loadPlaylistMetadata();
  </script>
</body>
</html>
