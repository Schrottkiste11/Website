<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" href="channels4_profile Schrottkiste.jpg" type="image/jpeg">
  <title>Schrottkiste – Home</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Poppins:wght@300;400;600&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --accent: #ff0099;
      --accent-alt: #00ffff;
      --bg: #1a1a24;
      --card-bg: #242430;
      --text: #f3f1ff;
      --radius: 16px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      font-family: 'Poppins', sans-serif;
      color: var(--text);
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* --- NAVIGATION --- */
    .nav-header {
      background: var(--card-bg);
      padding: 15px 5%;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 3px solid var(--accent);
    }

    .logo-area { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .nav-logo { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--accent-alt); }
    .nav-brand { font-family: 'Chewy', cursive; font-size: 1.8rem; color: #fff; text-shadow: 2px 2px 0px var(--accent); }

    .nav-main { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
    .nav-links { display: flex; gap: 15px; list-style: none; }
    .nav-links a { text-decoration: none; color: #fff; font-family: 'VT323', monospace; font-size: 1.2rem; }
    .nav-links a:hover { color: var(--accent-alt); }

    .nav-socials { display: flex; gap: 15px; padding-left: 15px; border-left: 1px solid #444; }
    .nav-socials a { color: #fff; font-size: 1.2rem; }

    /* --- HERO --- */
    .hero { padding: 40px 5%; text-align: center; }
    .banner-main-title { font-family: 'Chewy', cursive; font-size: clamp(2.5rem, 8vw, 6rem); color: #fff; text-shadow: 4px 4px 0px var(--accent); }

    /* --- GRID --- */
    .main-grid {
      max-width: 1200px;
      margin: 0 auto 40px;
      padding: 0 5%;
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    @media (min-width: 768px) {
      .main-grid { grid-template-columns: 1fr 320px; gap: 40px; }
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .status-panel {
      background: rgba(0, 255, 255, 0.05);
      border: 2px dashed var(--accent-alt);
      padding: 10px 15px;
      font-family: 'VT323', monospace;
      font-size: 1.1rem;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      color: var(--accent-alt);
      border-radius: 10px;
    }

    .responsive-video { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 12px; border: 2px solid var(--accent); }
    .responsive-video iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

    .main-btn { display: block; background: #000; color: #fff; padding: 15px; margin-bottom: 10px; font-family: 'VT323', monospace; font-size: 1.4rem; text-decoration: none; border: 2px solid var(--accent-alt); text-align: center; border-radius: 4px; }
    
    .action-btn { width: 100%; background: var(--accent); color: #fff; border: none; padding: 15px; font-family: 'VT323', monospace; font-size: 1.5rem; cursor: pointer; border-radius: 8px; }

    footer { padding: 30px; text-align: center; font-family: 'VT323'; color: #555; }
  </style>
</head>
<body>

  <nav class="nav-header">
    <a href="index.html" class="logo-area">
      <img src="channels4_profile Schrottkiste.jpg" alt="Logo" class="nav-logo">
      <span class="nav-brand">Schrottkiste</span>
    </a>
    <div class="nav-main">
      <ul class="nav-links">
        <li><a href="index.html">START</a></li>
        <li><a href="ideen.html">PLAN</a></li>
        <li><a href="radio.html">RADIO</a></li>
        <li><a href="soundboard.html">SOUNDBOARD</a></li>
      </ul>
      <div class="nav-socials">
        <a href="https://www.twitch.tv/schrottkiste_luka" target="_blank"><i class="fa-brands fa-twitch"></i></a>
        <a href="https://www.youtube.com/@schrottkiste" target="_blank"><i class="fa-brands fa-youtube"></i></a>
      </div>
    </div>
  </nav>

  <header class="hero">
    <h1 class="banner-main-title">Schrottkiste</h1>
  </header>

  <div class="main-grid">
    <main>
      <section class="status-panel">
        <span>UPDATE: 22.05.2026</span>
        <span>READY_TO_WATCH</span>
      </section>

      <div class="card">
        <h2 style="font-family:'VT323'; margin-bottom: 10px;">SEHENSWERT!</h2>
        <div class="responsive-video">
          <iframe src="https://www.youtube.com/embed/jzKIjHU5efU" allowfullscreen></iframe>
        </div>
      </div>

      <div class="card">
        <h2 style="font-family:'VT323'; margin-bottom: 10px;">SHUFFLE MODE</h2>
        <div id="video-display" style="background:#0a0a0f; color:var(--accent-alt); padding:20px; font-family:'VT323'; font-size:1.5rem; text-align:center; margin-bottom:15px; border:1px solid #333;">ZUFÄLLIGES VIDEO?</div>
        <button class="action-btn" id="random-btn" onclick="playRandomVideo()">VIDEO FINDEN</button>
      </div>
    </main>

    <aside>
      <div class="card">
        <a href="https://www.youtube.com/@Schrottkiste" target="_blank" class="main-btn">YOUTUBE</a>
        <a href="minecrafttahin.html" class="main-btn">TAHIN</a>
      </div>
    </aside>
  </div>

  <footer>SCHROTTKISTE // EST. 2025</footer>

  <script>
    const YT_KEY = 'AIzaSyBjXEtn67lwtWcbRo95C7k3V0egrhkjygM';
    const CH_ID = 'UCiCt3UwZjOAFpF5Yce6DhLA';

    async function playRandomVideo() {
      const display = document.getElementById('video-display');
      const btn = document.getElementById('random-btn');
      btn.disabled = true;
      display.innerText = "WÄHLE VIDEO...";

      try {
        const response = await fetch(`https://www.googleapis.com/youtube/v3/search?key=${YT_KEY}&channelId=${CH_ID}&part=snippet,id&order=date&maxResults=30&type=video`);
        const data = await response.json();
        
        if (data.error) {
            console.error("API Error:", data.error.message);
            throw new Error(data.error.message);
        }

        const vids = data.items;
        if (!vids || vids.length === 0) throw new Error("Keine Videos gefunden");

        let i = 0;
        const shuffle = setInterval(() => {
          display.innerText = "MISCHE KANAL...";
          display.style.color = (i % 2 === 0) ? "var(--accent)" : "var(--accent-alt)";
          i++;
          if (i > 10) {
            clearInterval(shuffle);
            const picked = vids[Math.floor(Math.random() * vids.length)];
            display.innerText = "VIDEO GEFUNDEN!";
            display.style.color = "#39ff14";
            setTimeout(() => {
              window.open("https://www.youtube.com/watch?v=" + picked.id.videoId, "_blank");
              display.innerText = "ZUFÄLLIGES VIDEO?";
              display.style.color = "var(--accent-alt)";
              btn.disabled = false;
            }, 800);
          }
        }, 120);
      } catch (e) {
        console.error("Fehler beim Abrufen:", e);
        display.innerText = "FEHLER.";
        display.style.color = "red";
        setTimeout(() => {
          display.innerText = "ZUFÄLLIGES VIDEO?";
          display.style.color = "var(--accent-alt)";
          btn.disabled = false;
        }, 2000);
      }
    }
  </script>
</body>
</html>
