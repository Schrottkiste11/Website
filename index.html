<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Schrottkiste – Home</title>
  <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Poppins:wght@300;400;600&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root { --accent: #ff0099; --accent-alt: #00ffff; --bg: #1a1a24; --card-bg: #242430; --text: #f3f1ff; --line-color: #444; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); font-family: 'Poppins', sans-serif; color: var(--text); }
    
    .nav-header { background: var(--card-bg); padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line-color); flex-wrap: wrap; gap: 15px; }
    .nav-brand { font-family: 'Chewy', cursive; font-size: 1.8rem; color: #fff; text-decoration: none; }
    .nav-main { display: flex; align-items: center; gap: 20px; }
    .nav-links { display: flex; gap: 20px; list-style: none; font-family: 'VT323', monospace; }
    .nav-links a { text-decoration: none; color: #fff; font-size: 1.2rem; }
    .nav-socials { display: flex; gap: 15px; padding-left: 15px; border-left: 1px solid #444; }
    .nav-socials a { color: #fff; font-size: 1.2rem; transition: transform 0.3s ease; }
    
    .page-wrapper { display: flex; flex-direction: row; padding: 40px 5%; gap: 40px; max-width: 1600px; margin: 0 auto; }
    .main-content { flex: 3; }
    .sidebar { flex: 1; min-width: 280px; }
    
    .section-full { width: 100%; padding: 40px 0; border-bottom: 3px solid var(--accent); }
    .section-footer-style { width: 100%; padding: 40px 0; border-bottom: 1px solid var(--line-color); }
    
    .banner-main-title { font-family: 'Chewy', cursive; font-size: 4rem; color: #fff; text-shadow: 4px 4px 0px var(--accent); text-align: center; margin-bottom: 20px; }
    h2 { font-family: 'VT323', monospace; color: var(--accent-alt); margin-bottom: 20px; font-size: 2rem; }

    /* YT Music Style Sidebar mit Cover-Fokus */
    .playlist-list { list-style: none; display: flex; flex-direction: column; gap: 12px; }
    .playlist-item { 
        display: flex; align-items: center; gap: 15px; padding: 10px; border-radius: 12px; 
        text-decoration: none; color: #fff; transition: all 0.3s ease; background: var(--card-bg);
        border: 1px solid transparent;
    }
    .playlist-item:hover { background: #2a2a38; border-color: var(--accent); }
    
    .thumb-wrap { position: relative; width: 70px; height: 70px; flex-shrink: 0; }
    .thumb-wrap img { width: 100%; height: 100%; border-radius: 8px; object-fit: cover; box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
    .yt-icon { position: absolute; bottom: -5px; right: -5px; background: #fff; color: #ff0000; border-radius: 50%; padding: 3px; font-size: 0.7rem; border: 2px solid var(--card-bg); }

    #video-feed { display: grid; gap: 20px; grid-template-columns: repeat(4, 1fr); }
    .video-wrapper { padding: 5px; }
    .responsive-embed { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 12px; border: 2px solid var(--accent); }
    .responsive-embed iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    
    .action-btn { width: 100%; max-width: 400px; background: var(--accent); color: #fff; border: none; padding: 15px; font-family: 'VT323', monospace; font-size: 1.5rem; cursor: pointer; border-radius: 8px; margin-top: 20px; }
    footer { padding: 30px; text-align: center; font-family: 'VT323', monospace; color: #555; border-top: 1px solid var(--line-color); }

    @media (max-width: 950px) { .page-wrapper { flex-direction: column; } #video-feed { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <nav class="nav-header">
    <a href="index.html" class="nav-brand">Schrottkiste</a>
    <div class="nav-main">
      <ul class="nav-links">
        <li><a href="index.html">START</a></li>
        <li><a href="ideen.html">PLAN</a></li>
        <li><a href="radio.html">RADIO</a></li>
        <li><a href="soundboard.html">SOUNDBOARD</a></li>
      </ul>
      <div class="nav-socials">
        <a href="https://www.twitch.tv/schrottkiste_luka" target="_blank"><i class="fa-brands fa-twitch"></i></a>
        <a href="https://www.youtube.com/@schrottkiste" target="_blank"><i class="fa-brands fa-youtube"></i></a>
      </div>
    </div>
  </nav>

  <section class="section-full">
    <h1 class="banner-main-title">Schrottkiste</h1>
  </section>

  <div class="page-wrapper">
    <div class="main-content">
        <section class="section-full">
            <h2>LETZTE 10 VIDEOS & STREAMS</h2>
            <div id="video-feed">Lade Inhalte...</div>
        </section>

        <section class="section-footer-style">
            <h2>SHUFFLE MODE</h2>
            <button class="action-btn" onclick="playRandomVideo()">VIDEO FINDEN</button>
        </section>
    </div>

    <aside class="sidebar">
        <h2>Meine Jahresplaylists</h2>
        <ul id="playlist-container" class="playlist-list">
            <li>Lade Playlists...</li>
        </ul>
    </aside>
  </div>

  <footer>SCHROTTKISTE // EST. 2025</footer>

  <script>
    const API_KEY = 'AIzaSyBjXEtn67lwtWcbRo95C7k3V0egrhkjygM';
    const playlistData = [
        {id: 'PLQLA52U7_qBOkmumSrvGZbE3CPPGqoLQX', title: 'Jahresplaylist 2026'},
        {id: 'PLQLA52U7_qBPqddrF9dAD9pR5HOhI-zpq', title: 'Jahresplaylist 2025'},
        {id: 'PLQLA52U7_qBNL4S4PhAzWYsu15Ta2q80B', title: 'Jahresplaylist 2024'},
        {id: 'PLQLA52U7_qBPJNw536VhdzwEmSeVHGCqx', title: 'Jahresplaylist 2023'}
    ];

    async function loadPlaylistMetadata() {
        const container = document.getElementById('playlist-container');
        try {
            const url = `https://www.googleapis.com/youtube/v3/playlists?part=snippet,contentDetails&id=${playlistData.map(p=>p.id).join(',')}&key=${API_KEY}`;
            const res = await fetch(url);
            const data = await res.json();
            container.innerHTML = data.items.map(pl => `
                <li>
                    <a href="https://music.youtube.com/playlist?list=${pl.id}" target="_blank" class="playlist-item">
                        <div class="thumb-wrap">
                            <img src="${pl.snippet.thumbnails.medium.url}">
                            <i class="fa-brands fa-youtube yt-icon"></i>
                        </div>
                        <div>
                            <div style="font-weight: 600; font-size: 1rem;">${pl.snippet.title}</div>
                            <div style="font-size: 0.85rem; color: var(--accent-alt);">${pl.contentDetails.itemCount} Tracks</div>
                        </div>
                    </a>
                </li>
            `).join('');
        } catch (e) {
            container.innerHTML = playlistData.map(p => `
                <li><a href="https://music.youtube.com/playlist?list=${p.id}" target="_blank" class="playlist-item">${p.title}</a></li>
            `).join('');
        }
    }
    
    async function loadFeed() {
        const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=https://www.youtube.com/feeds/videos.xml?channel_id=UCiCt3UwZjOAFpF5Yce6DhLA`);
        const data = await res.json();
        document.getElementById('video-feed').innerHTML = data.items.slice(0, 8).map(item => `
            <div class="video-wrapper">
                <div class="responsive-embed"><iframe src="https://www.youtube.com/embed/${item.link.split('v=')[1]}" allowfullscreen></iframe></div>
            </div>`).join('');
    }

    async function playRandomVideo() {
        const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=https://www.youtube.com/feeds/videos.xml?channel_id=UCiCt3UwZjOAFpF5Yce6DhLA`);
        const data = await res.json();
        window.open(data.items[Math.floor(Math.random() * data.items.length)].link, "_blank");
    }

    loadFeed(); loadPlaylistMetadata();
  </script>
</body>
</html>
