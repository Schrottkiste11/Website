<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schrottkiste – Home</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;600&family=Chewy&display=swap" rel="stylesheet">
  <style>
    :root { --accent: #ff0099; --bg: #0f0f0f; --card-bg: #1e1e1e; --text: #ffffff; }
    body { background: var(--bg); font-family: 'Roboto', sans-serif; color: var(--text); }
    
    .page-wrapper { display: flex; padding: 40px 5%; gap: 40px; max-width: 1600px; margin: 0 auto; }
    .sidebar { width: 300px; }
    h2 { font-family: 'Chewy', cursive; color: var(--accent); margin-bottom: 20px; font-size: 2rem; }

    /* Playlist Kacheln ohne Link-Unterstreichung oder Text-Optik */
    .playlist-list { list-style: none; display: flex; flex-direction: column; gap: 20px; }
    .playlist-card { 
        display: block; 
        background: var(--card-bg); 
        padding: 12px; 
        border-radius: 12px; 
        text-decoration: none; 
        color: inherit; 
        transition: background 0.3s;
    }
    .playlist-card:hover { background: #333; }
    .card-thumb { width: 100%; aspect-ratio: 1/1; border-radius: 8px; object-fit: cover; margin-bottom: 10px; }
    .card-title { font-weight: 600; font-size: 1.1rem; }
    .card-meta { font-size: 0.9rem; color: #aaa; margin-top: 4px; }
  </style>
</head>
<body>

  <div class="page-wrapper">
    <aside class="sidebar">
        <h2>Jahresplaylists</h2>
        <div id="playlist-container" class="playlist-list">
            <div>Lade...</div>
        </div>
    </aside>
  </div>

  <script>
    const API_KEY = 'AIzaSyBjXEtn67lwtWcbRo95C7k3V0egrhkjygM';
    const playlistData = [
        {id: 'PLQLA52U7_qBOkmumSrvGZbE3CPPGqoLQX', title: 'Jahresplaylist 2026'},
        {id: 'PLQLA52U7_qBPqddrF9dAD9pR5HOhI-zpq', title: 'Jahresplaylist 2025'}
    ];

    async function loadPlaylistMetadata() {
        const container = document.getElementById('playlist-container');
        try {
            const url = `https://www.googleapis.com/youtube/v3/playlists?part=snippet,contentDetails&id=${playlistData.map(p=>p.id).join(',')}&key=${API_KEY}`;
            const res = await fetch(url);
            const data = await res.json();
            container.innerHTML = data.items.map(pl => `
                <a href="https://music.youtube.com/playlist?list=${pl.id}" target="_blank" class="playlist-card">
                    <img src="${pl.snippet.thumbnails.high.url}" class="card-thumb" alt="Cover">
                    <div class="card-title">${pl.snippet.title}</div>
                    <div class="card-meta">${pl.contentDetails.itemCount} Tracks</div>
                </a>
            `).join('');
        } catch (e) {
            container.innerHTML = "Fehler.";
        }
    }
    loadPlaylistMetadata();
  </script>
</body>
</html>
