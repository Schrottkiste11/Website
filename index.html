<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schrottkiste – Home</title>
  <meta name="description" content="Schrottkiste – Twitch- und YouTube-Content von Luka. Streams, Blog-Updates und Playlists.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Schrottkiste">
  <meta property="og:description" content="Twitch- und YouTube-Content von Luka. Streams, Blog-Updates und Playlists.">
  <meta property="og:image" content="images/image.png">
  <meta name="theme-color" content="#1a1a24">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231a1a24'/%3E%3Ctext x='50' y='70' font-family='Arial,sans-serif' font-weight='900' font-size='58' fill='%23ff0099' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Poppins:wght@300;400;600&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root { --accent: #ff0099; --accent-alt: #00ffff; --bg: #1a1a24; --card-bg: #242430; --text: #f3f1ff; --line-color: #444; }
    * { box-sizing: border-box; }
    body { background: var(--bg); font-family: 'Poppins', sans-serif; color: var(--text); margin: 0; overflow-wrap: break-word; }

    a:focus-visible, button:focus-visible, .gif-box:focus-visible { outline: 2px solid var(--accent-alt); outline-offset: 3px; }
    
    .nav-header { background: var(--card-bg); padding: 15px 5%; border-bottom: 1px solid var(--line-color); }
    .brand-row { display: flex; justify-content: center; margin-bottom: 15px; }
    .nav-brand { font-family: 'Chewy', cursive; font-size: 3.5rem; color: #fff; text-decoration: none; }
    .menu-row { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--line-color); padding-top: 10px; flex-wrap: wrap; gap: 15px; }
    
    .nav-links { display: flex; gap: 25px; list-style: none; font-family: 'Poppins', sans-serif; flex-wrap: wrap; padding-left: 0; margin: 0; }
    .nav-links a { text-decoration: none; color: #fff; font-size: 0.95rem; font-weight: 600; letter-spacing: 0.05em; transition: 0.3s; }
    .nav-links a:hover { color: var(--accent); }
    
    /* --- Mini Player Styles --- */
    .mini-player { background: #1a1a24; padding: 10px; border-radius: 8px; display: flex; align-items: center; gap: 10px; border: 1px solid var(--line-color); }
    .player-label { font-size: 0.75rem; color: var(--accent); font-weight: 600; text-transform: uppercase; margin-right: 5px; }
    .player-controls button { background: var(--accent); color: white; border: none; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; transition: 0.2s; }
    .player-controls button:hover { transform: scale(1.05); }
    .track-info-mini { font-size: 0.75rem; max-width: 120px; }
    #song-title { color: var(--accent-alt); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: bold; }
    #artist-name { color: #aaa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .social-btns { display: flex; gap: 20px; }
    .social-btn { color: #fff; font-size: 1.8rem; transition: 0.3s; }
    .twitch:hover { color: #9146FF; }
    .youtube:hover { color: #FF0000; }
    
    .container { display: flex; padding: 40px 5%; gap: 40px; max-width: 1400px; margin: 0 auto; align-items: flex-start; }
    
    .gif-container { flex: 0 0 200px; display: flex; flex-direction: column; gap: 20px; }
    .gif-box { width: 100%; aspect-ratio: 1/1; cursor: pointer; border-radius: 12px; background-size: cover; background-position: center; transition: transform 0.2s; border: 2px solid transparent; }
    .gif-box:hover { transform: scale(1.02); border-color: var(--accent); }
    
    .blog-section { flex: 2; display: flex; flex-direction: column; gap: 30px; min-width: 0; }
    .sidebar { flex: 1; border-left: 2px solid var(--line-color); padding-left: 40px; min-width: 0; }
    .sidebar-title { margin: 0 0 25px; font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 1.3rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--accent-alt); }
    
    .blog-post { background: var(--card-bg); padding: 30px; border-radius: 12px; border-left: 6px solid var(--accent); }
    .post-meta { display: flex; gap: 15px; margin-bottom: 15px; }
    .post-time { font-family: 'VT323', monospace; opacity: 0.8; font-size: 1.3rem; }
    .post-title { font-size: 2.2rem; margin-bottom: 20px; color: var(--accent-alt); }
    .post-text { line-height: 1.8; font-size: 1.2rem; transition: 0.3s; }
    .post-text p { margin-bottom: 1em; }
    
    .collapsed { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
    .read-more { background: var(--accent); color: #fff; border: none; padding: 10px 20px; cursor: pointer; border-radius: 4px; font-family: 'VT323', monospace; font-size: 1.2rem; margin-top: 15px; display: block; }
    
    .playlist-item { margin-bottom: 25px; text-align: center; }
    .playlist-title { display: inline-block; margin-top: 4px; font-family: 'Poppins', sans-serif; font-size: 0.95rem; color: var(--text); }
    .cover-img { width: 100%; max-width: 220px; border-radius: 8px; display: block; margin: 0 auto 10px; transition: 0.3s; }
    .cover-img:hover { transform: scale(1.05); }

    .interactive-area { margin-top: 25px; padding-top: 20px; border-top: 1px solid var(--line-color); }

    .site-footer { margin-top: 60px; padding: 30px 5%; border-top: 1px solid var(--line-color); background: var(--card-bg); }
    .footer-inner { max-width: 1400px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
    .footer-brand { font-family: 'Chewy', cursive; font-size: 1.5rem; color: #fff; }
    .footer-social { display: flex; gap: 15px; }
    .footer-copy { font-size: 0.85rem; opacity: 0.6; }

    @media (max-width: 900px) {
      .container { flex-direction: column; padding: 30px 5%; gap: 30px; }
      .gif-container { flex-direction: row; flex: none; width: 100%; justify-content: center; }
      .gif-box { flex: 0 1 180px; }
      .sidebar { border-left: none; border-top: 2px solid var(--line-color); padding-left: 0; padding-top: 30px; }
    }

    @media (max-width: 640px) {
      .nav-brand { font-size: 2.3rem; }
      .menu-row { flex-direction: column; align-items: center; }
      .post-title { font-size: 1.6rem; }
      .blog-post { padding: 20px; }
      .footer-inner { flex-direction: column; text-align: center; }
    }
  </style>
</head>
<body>

  <header class="nav-header">
    <div class="brand-row"><a href="index.html" class="nav-brand">Schrottkiste</a></div>
    <div class="menu-row">
      <ul class="nav-links">
          <li><a href="index.html">START</a></li>
          <li><a href="ideen.html">CONTENT-PLAN</a></li>
          <li><a href="soundboard.html">SOUNDBOARD</a></li>

        <span class="player-label">In mein Radio reinhören!</span>
        <audio id="audio-player" src="https://stream.laut.fm/treasure_radio"></audio>

        </div>

            <div id="song-title">Lade...</div>

        </div>
      </div>

      <div class="social-btns">
        <a href="https://www.twitch.tv/schrottkiste_luka" target="_blank" class="social-btn twitch"><i class="fa-brands fa-twitch"></i></a>
        <a href="https://www.youtube.com/@schrottkiste" target="_blank" class="social-btn youtube"><i class="fa-brands fa-youtube"></i></a>
      </div>
    </div>
  </header>

</html>
