<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="channels4_profile Schrottkiste.jpg" type="image/jpeg">
  <link rel="shortcut icon" href="channels4_profile Schrottkiste.jpg" type="image/jpeg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schrottkiste – Home</title>
  <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Poppins:wght@300;400;600&family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent: #ff0099; /* Dein Pink */
      --accent-alt: #00ffff; /* Dein Cyan */
      --bg: #1a1a24; /* Industrial Cyber-Grey */
      --card-bg: #242430; /* Etwas helleres Grau für Karten */
      --text: #f3f1ff;
      --radius: 16px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      font-family: 'Poppins', sans-serif;
      color: var(--text);
      line-height: 1.6;
    }

    /* --- NAVIGATION --- */
    .nav-header {
      background: var(--card-bg);
      padding: 15px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 3px solid var(--accent);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .logo-area { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .nav-logo { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--accent-alt); }
    .nav-brand { font-family: 'Chewy', cursive; font-size: 1.8rem; color: #fff; text-shadow: 2px 2px 0px var(--accent); }

    .nav-links { display: flex; gap: 20px; list-style: none; }
    .nav-links a { 
      text-decoration: none; 
      color: #fff; 
      font-family: 'VT323', monospace; 
      font-size: 1.3rem; 
      transition: 0.2s;
    }
    .nav-links a:hover { color: var(--accent-alt); }

    /* --- HERO AREA --- */
    .hero {
      padding: 60px 5%;
      text-align: center;
      margin-bottom: 20px;
    }
    .banner-main-title {
      font-family: 'Chewy', cursive; 
      font-size: clamp(3.5rem, 10vw, 6rem);
      color: #fff; 
      text-shadow: 6px 6px 0px var(--accent);
      margin-bottom: 10px;
    }

    /* --- MAIN CONTENT GRID --- */
    .main-grid {
      max-width: 1200px;
      margin: 0 auto 60px;
      padding: 0 5%;
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 40px;
    }

    @media (max-width: 900px) {
      .main-grid { grid-template-columns: 1fr; }
    }

    /* --- CARDS --- */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      margin-bottom: 30px;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .status-panel {
      background: rgba(0, 255, 255, 0.05);
      border: 2px dashed var(--accent-alt);
      padding: 10px 20px;
      font-family: 'VT323', monospace;
      font-size: 1.2rem;
      margin-bottom: 25px;
      display: flex; 
      justify-content: space-between;
      color: var(--accent-alt);
      border-radius: 10px;
    }

    .video-title {
      font-family: 'VT323', monospace;
      font-size: 2rem;
      color: #fff;
      margin-bottom: 15px;
      text-transform: uppercase;
    }

    .responsive-video { 
      position: relative; 
      padding-bottom: 56.25%; 
      height: 0; 
      overflow: hidden; 
      border-radius: 12px;
      border: 2px solid var(--accent);
    }
    .responsive-video iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

    /* --- SIDEBAR --- */
    .sidebar-title {
      font-family: 'VT323', monospace;
      font-size: 1.5rem;
      color: var(--accent-alt);
      margin-bottom: 15px;
      display: block;
      border-bottom: 2px solid var(--accent);
    }

    .btn-container { display: flex; flex-direction: column; gap: 15px; }
    .main-btn {
      background: #000; 
      color: #fff; 
      padding: 12px; 
      font-family: 'VT323', monospace;
      font-size: 1.5rem; 
      text-decoration: none; 
      border: 2px solid var(--accent-alt);
      box-shadow: 4px 4px 0px var(--accent-alt); 
      transition: 0.2s;
      text-align: center;
      border-radius: 4px;
    }
    .main-btn:hover { 
      transform: translate(-2px, -2px); 
      background: var(--accent-alt); 
      color: #000; 
      box-shadow: 6px 6px 0px var(--accent); 
    }

    /* --- RANDOM VIDEO BOX --- */
    .video-display {
      background: #0a0a0f;
      color: var(--accent-alt);
      padding: 20px;
      font-family: 'VT323', monospace;
      font-size: 1.5rem;
      text-align: center;
      border-radius: 8px;
      margin-bottom: 15px;
      border: 1px solid #333;
    }
    .action-btn {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 15px;
      font-family: 'VT323', monospace;
      font-size: 1.6rem;
      cursor: pointer;
      border-radius: 8px;
      transition: 0.2s;
    }
    .action-btn:hover { background: #fff; color: #000; }

    footer {
      padding: 40px;
      text-align: center;
      font-family: 'VT323';
      color: #555;
      border-top: 1px solid #333;
    }
  </style>
</head>
<body>

  <nav class="nav-header">
    <a href="index.html" class="logo-area">
      <img src="channels4_profile Schrottkiste.jpg" alt="Logo" class="nav-logo">
      <span class="nav-brand">Schrottkiste</span>
    </a>
    <ul class="nav-links">
      <li><a href="index.html">START</a></li>
      <li><a href="app.html">APP</a></li>
      <li><a href="ideen.html">PLAN</a></li>
      <li><a href="radio.html">RADIO</a></li>
    </ul>
  </nav>

  <header class="hero">
    <h1 class="banner-main-title">Schrottkiste</h1>
  </header>

  <div class="main-grid">
    <main>
      <section class="status-panel">
        <span>UPDATE: 05.05.2026</span>
        <span>READY_TO_WATCH</span>
      </section>

      <div class="card">
        <h2 class="video-title">Aktuellstes Video</h2>
        <div class="responsive-video">
          <iframe src="https://www.youtube.com/embed/ihpsxtqTRfo" title="YouTube video player" frameborder="0" allowfullscreen></iframe>
        </div>
      </div>

      <div class="card">
        <h2 class="video-title">Shuffle Mode</h2>
        <div class="video-display" id="video-display">ZUFÄLLIGES VIDEO WÄHLEN?</div>
        <button class="action-btn" id="random-btn" onclick="playRandomVideo()">Video finden</button>
      </div>
    </main>

    <aside>
      <div class="card">
        <span class="sidebar-title">LINKS</span>
        <div class="btn-container">
          <a href="app.html" class="main-btn">DIE APP</a>
          <a href="https://www.youtube.com/@Schrottkiste" target="_blank" class="main-btn">YOUTUBE</a>
          <a href="minecrafttahin.html" class="main-btn">TAHIN</a>
        </div>
      </div>
      
      <div style="font-family: 'VT323'; font-size: 0.9rem; text-align: center; opacity: 0.5;">
        © 2026 // ALL_SYSTEMS_GO
      </div>
    </aside>
  </div>

  <footer>
    SCHROTTKISTE // EST. 2025
  </footer>

  <script>
    const YT_KEY = 'AIzaSyBjXEtn67lwtWcbRo95C7k3V0egrhkjygM';
    const CH_ID = 'UCiCt3UwZjOAFpF5Yce6DhLA';

    async function playRandomVideo() {
      const display = document.getElementById('video-display');
      const btn = document.getElementById('random-btn');
      btn.disabled = true;
      display.innerText = "WÄHLE VIDEO...";

      try {
        const response = await fetch(`https://www.googleapis.com/youtube/v3/search?key=${YT_KEY}&channelId=${CH_ID}&part=snippet,id&order=date&maxResults=30&type=video`);
        const data = await response.json();
        const vids = data.items;
        if (!vids || vids.length === 0) throw new Error();

        let i = 0;
        const shuffle = setInterval(() => {
          display.innerText = "MISCHE KANAL...";
          display.style.color = (i % 2 === 0) ? "var(--accent)" : "var(--accent-alt)";
          i++;
          if (i > 10) {
            clearInterval(shuffle);
            const picked = vids[Math.floor(Math.random() * vids.length)];
            display.innerText = "VIDEO GEFUNDEN!";
            display.style.color = "#39ff14";
            setTimeout(() => {
              window.open("https://www.youtube.com/watch?v=" + picked.id.videoId, "_blank");
              display.innerText = "ZUFÄLLIGES VIDEO WÄHLEN?";
              display.style.color = "var(--accent-alt)";
              btn.disabled = false;
            }, 800);
          }
        }, 120);
      } catch (e) {
        display.innerText = "FEHLER BEIM LADEN.";
        display.style.color = "red";
        setTimeout(() => {
          display.innerText = "ZUFÄLLIGES VIDEO WÄHLEN?";
          display.style.color = "var(--accent-alt)";
          btn.disabled = false;
        }, 2000);
      }
    }
  </script>
</body>
</html>
