<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="channels4_profile Schrottkiste.jpg" type="image/jpeg">
<link rel="shortcut icon" href="channels4_profile Schrottkiste.jpg" type="image/jpeg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schrottkiste – Home</title>
  <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Poppins:wght@300;400;600&family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent: #ff0099;
      --accent-alt: #00ffff;
      --bg: #050415;
      --card: rgba(18, 14, 40, 0.96);
      --text: #f3f1ff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      background-image: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                        radial-gradient(circle at top, #151435 0%, #050415 70%, #020109 100%);
      background-size: 100% 4px, 100% 100%;
      font-family: 'Poppins', sans-serif;
      color: var(--text);
      text-align: center;
      min-height: 100vh;
    }

    /* --- SIDEBAR --- */
    #menuToggle { display: none; }
    .hamburger-btn {
      position: fixed; top: 20px; left: 20px; z-index: 20000;
      background: var(--accent); border: 2px solid #fff; padding: 8px 14px;
      cursor: pointer; box-shadow: 6px 6px 0px var(--accent-alt); font-family: 'VT323', monospace;
    }
    .custom-sidebar {
      position: fixed; top: 0; left: 0; width: 280px; height: 100vh;
      background: #111; border-right: 4px solid var(--accent);
      transform: translateX(-100%); transition: 0.4s steps(4);
      padding-top: 100px; z-index: 9000;
    }
    #menuToggle:checked ~ .custom-sidebar { transform: translateX(0); }
    .custom-sidebar nav a {
      display: block; color: #fff; text-decoration: none; font-size: 1.8rem; 
      font-family: 'VT323', monospace; padding: 15px 25px; border-bottom: 1px solid #222;
    }

    /* --- BANNER --- */
    .channel-banner {
      width: 100%; min-height: 300px; background: #08071b;
      background-image: linear-gradient(to bottom, rgba(5, 4, 21, 0.4), #050415), 
                        url('https://www.transparenttextures.com/patterns/carbon-fibre.png');
      border-bottom: 4px solid var(--accent);
      display: flex; align-items: center; justify-content: center;
      padding: 60px 20px;
    }
    .banner-content { display: flex; align-items: center; gap: 40px; }
    .banner-logo {
      width: clamp(140px, 25vw, 200px); height: clamp(140px, 25vw, 200px);
      object-fit: cover; border-radius: 50%; border: 4px solid var(--accent-alt);
      filter: drop-shadow(0 0 20px var(--accent));
    }
    .banner-main-title {
      font-family: 'Chewy', cursive; font-size: clamp(3.5rem, 10vw, 7rem);
      color: #fff; text-shadow: 8px 8px 0px var(--accent);
    }

    /* --- CONTENT AREA --- */
    .content-area { max-width: 800px; margin: 0 auto; padding: 20px; }

    .status-panel {
      background: rgba(255, 0, 153, 0.1); border: 2px dashed var(--accent);
      padding: 10px 20px; font-family: 'VT323', monospace;
      font-size: 1.4rem; margin-bottom: 30px; display: flex; 
      justify-content: space-between; color: var(--accent-alt);
    }

    /* VIDEO CARD */
    .video-card {
      background: var(--card); border: 3px solid var(--accent-alt);
      padding: 25px; box-shadow: 12px 12px 0px var(--accent); margin-bottom: 40px;
    }
    .video-title {
      font-family: 'VT323', monospace; font-size: 2.2rem; color: #fff;
      margin-bottom: 15px; text-transform: uppercase; letter-spacing: 2px;
    }
    .responsive-video { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; }
    .responsive-video iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

    /* --- ZUFALLS-VIDEO BUTTON STYLES --- */
    .random-video-section {
      margin: 40px auto 60px;
      max-width: 600px;
    }
    .video-box {
      background: #000;
      border: 3px solid var(--accent-alt);
      padding: 25px;
      box-shadow: 10px 10px 0px var(--accent);
    }
    .video-display {
      background: #080808;
      border: 1px solid #222;
      padding: 15px;
      font-family: 'VT323', monospace;
      font-size: 1.6rem;
      color: var(--accent-alt);
      margin-bottom: 20px;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .action-btn {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 18px;
      font-family: 'VT323', monospace;
      font-size: 1.8rem;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: 0.1s;
    }
    .action-btn:hover:not(:disabled) {
      background: #fff;
      color: #000;
    }
    .action-btn:active {
      transform: scale(0.98);
    }
    .action-btn:disabled {
      background: #333;
      color: #666;
      cursor: not-allowed;
    }

    /* --- FOOTER & LINKS --- */
    .btn-container { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin-bottom: 60px; }
    .main-btn {
      background: #fff; color: #000; padding: 12px 30px; font-family: 'VT323', monospace;
      font-size: 1.5rem; text-decoration: none; border: 2px solid var(--accent);
      box-shadow: 6px 6px 0px var(--accent); transition: 0.2s;
    }
    .main-btn:hover { transform: translate(-2px, -2px); background: var(--accent); color: #fff; box-shadow: 8px 8px 0px var(--accent-alt); }

    footer { padding-bottom: 40px; font-family: 'VT323'; color: #444; }
  </style>
</head>
<body>

  <input type="checkbox" id="menuToggle" hidden>
  <label for="menuToggle" class="hamburger-btn">☰ MENÜ</label>

  <aside class="custom-sidebar">
    <nav>
      <a href="index.html">Startseite</a>
      <a href="app.html">App Download</a>
      <a href="ideen.html">Content-Plan</a>
      <a href="minecrafttahin.html">Minecraft-Tahin</a>
      <a href="radio.html">TREASURE RADIO</a>
    </nav>
  </aside>

  <header class="channel-banner">
    <div class="banner-content">
      <img src="channels4_profile Schrottkiste.jpg" alt="Schrottkiste Logo" class="banner-logo">
      <h1 class="banner-main-title">Schrottkiste</h1>
    </div>
  </header>

  <main class="content-area">
    <section class="status-panel">
      <span>UPDATE: 21.03.2026</span>
      <span>READY_TO_WATCH</span>
    </section>

    <section class="video-card">
      <h2 class="video-title">Aktuellstes Video</h2>
      <div class="responsive-video">
        <iframe src="https://www.youtube.com/embed/4_vrqFH-byU" title="YouTube video player" frameborder="0" allowfullscreen></iframe>
      </div>
    </section>

    <section class="random-video-section">
      <div class="video-box">
        <div class="video-display" id="video-display">ZUFÄLLIGES VIDEO WÄHLEN?</div>
        <button class="action-btn" id="random-btn" onclick="playRandomVideo()">Zufälliges YT-Video abspielen</button>
      </div>
    </section>

    <div class="btn-container">
      <a href="app.html" class="main-btn" style="border-color: var(--accent-alt);">DIE APP</a>
      <a href="https://www.youtube.com/@Schrottkiste" target="_blank" class="main-btn">YOUTUBE</a>
      <a href="minecrafttahin.html" class="main-btn">TAHIN</a>
    </div>
  </main>

  <footer>
    © 2026 SCHROTTKISTE // ALL_SYSTEMS_GO
  </footer>

  <script>
    const YT_KEY = 'AIzaSyBjXEtn67lwtWcbRo95C7k3V0egrhkjygM';
    const CH_ID = 'UCiCt3UwZjOAFpF5Yce6DhLA';

    async function playRandomVideo() {
      const display = document.getElementById('video-display');
      const btn = document.getElementById('random-btn');

      btn.disabled = true;
      display.innerText = "WÄHLE VIDEO...";

      try {
        const response = await fetch(`https://www.googleapis.com/youtube/v3/search?key=${YT_KEY}&channelId=${CH_ID}&part=snippet,id&order=date&maxResults=30&type=video`);
        const data = await response.json();
        const vids = data.items;

        if (!vids || vids.length === 0) throw new Error();

        let i = 0;
        const shuffle = setInterval(() => {
          display.innerText = "MISCHE KANAL...";
          display.style.color = (i % 2 === 0) ? "var(--accent)" : "var(--accent-alt)";
          i++;

          if (i > 10) {
            clearInterval(shuffle);
            const picked = vids[Math.floor(Math.random() * vids.length)];
            display.innerText = "VIDEO GEFUNDEN!";
            display.style.color = "#39ff14";

            setTimeout(() => {
              window.open("https://www.youtube.com/watch?v=" + picked.id.videoId, "_blank");
              display.innerText = "ZUFÄLLIGES VIDEO WÄHLEN?";
              display.style.color = "var(--accent-alt)";
              btn.disabled = false;
            }, 800);
          }
        }, 120);

      } catch (e) {
        display.innerText = "FEHLER BEIM LADEN.";
        display.style.color = "red";
        setTimeout(() => {
          display.innerText = "ZUFÄLLIGES VIDEO WÄHLEN?";
          display.style.color = "var(--accent-alt)";
          btn.disabled = false;
        }, 2000);
      }
    }
  </script>
</body>
</html>
