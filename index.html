<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schrottkiste – Radio</title>
  <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Poppins:wght@300;400;600&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root { --accent: #ff0099; --accent-alt: #00ffff; --bg: #1a1a24; --card-bg: #242430; --text: #f3f1ff; --line-color: #444; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); font-family: 'Poppins', sans-serif; color: var(--text); }
    
    .nav-header { background: var(--card-bg); padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line-color); }
    .nav-brand { font-family: 'Chewy', cursive; font-size: 1.8rem; color: #fff; text-decoration: none; }
    .nav-right { display: flex; align-items: center; gap: 20px; }
    .nav-links { display: flex; gap: 20px; list-style: none; font-family: 'VT323', monospace; }
    .nav-links a { text-decoration: none; color: #fff; font-size: 1.2rem; }
    .nav-divider { width: 1px; height: 24px; background: var(--line-color); margin: 0 10px; }
    .social-btns { display: flex; gap: 15px; align-items: center; }
    .social-btn { color: #fff; font-size: 1.5rem; transition: 0.3s; }
    .social-btn.twitch:hover { color: #9146ff; }
    .social-btn.youtube:hover { color: #ff0000; }
    
    .page-wrapper { display: flex; padding: 40px 5%; gap: 40px; max-width: 1600px; margin: 0 auto; }
    .main-content { flex: 3; }
    .sidebar { flex: 1; min-width: 280px; }
    
    .section-full { width: 100%; padding: 40px 0; border-bottom: 3px solid var(--accent); }
    .banner-main-title { font-family: 'Chewy', cursive; font-size: 4rem; color: #fff; text-shadow: 4px 4px 0px var(--accent); text-align: center; margin-bottom: 20px; }
    h2 { font-family: 'VT323', monospace; color: var(--accent-alt); margin-bottom: 20px; font-size: 2rem; }

    .responsive-embed { position: relative; padding-bottom: 56.25%; height: 0; background: #000; border-radius: 12px; overflow: hidden; border: 3px solid var(--accent); }
    .responsive-embed iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

    .playlist-nav { display: grid; gap: 20px; }
    .playlist-item { display: flex; flex-direction: column; gap: 10px; }
    .cover-btn { background: none; border: 2px solid transparent; padding: 0; cursor: pointer; border-radius: 8px; overflow: hidden; transition: 0.3s; }
    .cover-btn:hover { border-color: var(--accent); }
    .cover-img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; }
    .playlist-title { font-family: 'VT323', monospace; font-size: 1.2rem; text-align: center; color: #fff; }

    footer { padding: 40px; text-align: center; color: #555; border-top: 1px solid var(--line-color); }
    @media (max-width: 950px) { .page-wrapper { flex-direction: column; } }
  </style>
</head>
<body>

  <nav class="nav-header">
    <a href="index.html" class="nav-brand">Schrottkiste</a>
    <div class="nav-right">
      <ul class="nav-links">
          <li><a href="index.html">START</a></li>
          <li><a href="ideen.html">PLAN</a></li>
          <li><a href="radio.html">RADIO</a></li>
          <li><a href="soundboard.html">SOUNDBOARD</a></li>
      </ul>
      <div class="nav-divider"></div>
      <div class="social-btns">
        <a href="https://www.twitch.tv/schrottkiste_luka" target="_blank" class="social-btn twitch"><i class="fa-brands fa-twitch"></i></a>
        <a href="https://www.youtube.com/@schrottkiste" target="_blank" class="social-btn youtube"><i class="fa-brands fa-youtube"></i></a>
      </div>
    </div>
  </nav>

  <div class="page-wrapper">
    <div class="main-content">
        <section class="section-full">
            <h2>PLAYER</h2>
            <div class="responsive-embed" id="player">
                <iframe src="https://www.youtube.com/embed/videoseries?list=PLQLA52U7_qBOkmumSrvGZbE3CPPGqoLQX" allowfullscreen></iframe>
            </div>
        </section>
    </div>

    <aside class="sidebar">
        <h2>Meine Playlists</h2>
        <div id="playlist-container" class="playlist-nav"></div>
    </aside>
  </div>

  <footer>SCHROTTKISTE // EST. 2025</footer>

  <script>
    const API_KEY = 'AIzaSyBjXEtn67lwtWcbRo95C7k3V0egrhkjygM';
    const playlistIds = [
        'PLQLA52U7_qBOkmumSrvGZbE3CPPGqoLQX',
        'PLQLA52U7_qBPJNw536VhdzwEmSeVHGCqx',
        'PLQLA52U7_qBN4VcQskCzUQoONu-RMwgwP',
        'PLQLA52U7_qBPqddrF9dAD9pR5HOhI-zpq',
        'PLQLA52U7_qBNL4S4PhAzWYsu15Ta2q80B'
    ];

    async function loadPlaylists() {
        const container = document.getElementById('playlist-container');
        for (const id of playlistIds) {
            const url = `https://www.googleapis.com/youtube/v3/playlists?part=snippet&id=${id}&key=${API_KEY}`;
            try {
                const res = await fetch(url);
                const data = await res.json();
                if (data.items && data.items.length > 0) {
                    const item = data.items[0];
                    const div = document.createElement('div');
                    div.className = 'playlist-item';
                    div.innerHTML = `
                        <button class="cover-btn" onclick="setPlaylist('${id}')">
                            <img src="${item.snippet.thumbnails.high.url}" class="cover-img" alt="${item.snippet.title}">
                        </button>
                        <span class="playlist-title">${item.snippet.title}</span>
                    `;
                    container.appendChild(div);
                }
            } catch (e) { console.error("Fehler beim Laden:", e); }
        }
    }

    function setPlaylist(id) {
        document.getElementById('player').innerHTML = `<iframe src="https://www.youtube.com/embed/videoseries?list=${id}" allowfullscreen></iframe>`;
    }

    loadPlaylists();
  </script>
</body>
</html>
