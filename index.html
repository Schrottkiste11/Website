<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schrottkiste – Home</title>
  <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Poppins:wght@300;400;600&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root { --accent: #ff0099; --accent-alt: #00ffff; --bg: #1a1a24; --card-bg: #242430; --text: #f3f1ff; --line-color: #444; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); font-family: 'Poppins', sans-serif; color: var(--text); }
    
    .nav-header { background: var(--card-bg); padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line-color); }
    .nav-brand { font-family: 'Chewy', cursive; font-size: 1.8rem; color: #fff; text-decoration: none; }
    .nav-links { display: flex; gap: 20px; list-style: none; font-family: 'VT323', monospace; }
    .nav-links a { text-decoration: none; color: #fff; font-size: 1.2rem; }
    
    .page-wrapper { display: flex; padding: 40px 5%; gap: 40px; max-width: 1600px; margin: 0 auto; }
    .main-content { flex: 3; }
    .sidebar { flex: 1; min-width: 320px; }
    
    .section-full { width: 100%; padding: 40px 0; border-bottom: 3px solid var(--accent); }
    .banner-main-title { font-family: 'Chewy', cursive; font-size: 4rem; color: #fff; text-shadow: 4px 4px 0px var(--accent); text-align: center; margin-bottom: 20px; }
    h2 { font-family: 'VT323', monospace; color: var(--accent-alt); margin-bottom: 20px; font-size: 2rem; }

    /* Video Feed & Player */
    #video-feed { display: grid; gap: 20px; grid-template-columns: repeat(3, 1fr); }
    .responsive-embed { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 12px; border: 2px solid var(--accent); background: #000; }
    .responsive-embed iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    
    .action-btn { background: var(--accent); color: #fff; border: none; padding: 15px 30px; font-family: 'VT323', monospace; font-size: 1.5rem; cursor: pointer; border-radius: 8px; margin-top: 20px; }
    footer { padding: 40px; text-align: center; color: #555; border-top: 1px solid var(--line-color); }

    @media (max-width: 950px) { .page-wrapper { flex-direction: column; } #video-feed { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <nav class="nav-header">
    <a href="index.html" class="nav-brand">Schrottkiste</a>
    <ul class="nav-links">
        <li><a href="index.html">START</a></li>
        <li><a href="ideen.html">PLAN</a></li>
    </ul>
  </nav>

  <section class="section-full">
    <h1 class="banner-main-title">Schrottkiste</h1>
  </section>

  <div class="page-wrapper">
    <div class="main-content">
        <section class="section-full">
            <h2>LETZTE VIDEOS</h2>
            <div id="video-feed">Lade Inhalte...</div>
            <button class="action-btn" onclick="playRandomVideo()">SHUFFLE MODE</button>
        </section>
    </div>

    <aside class="sidebar">
        <h2>Meine Jahresplaylists</h2>
        
        <div style="margin-bottom: 25px;">
            <h3 style="font-family: 'VT323', monospace; color: #fff; margin-bottom: 8px;">Jahresplaylist 2026</h3>
            <div class="responsive-embed" style="padding-bottom: 60%;"><iframe src="https://www.youtube.com/embed/videoseries?list=PLQLA52U7_qBOkmumSrvGZbE3CPPGqoLQX" allowfullscreen></iframe></div>
        </div>

        <div style="margin-bottom: 25px;">
            <h3 style="font-family: 'VT323', monospace; color: #fff; margin-bottom: 8px;">Jahresplaylist 2025</h3>
            <div class="responsive-embed" style="padding-bottom: 60%;"><iframe src="https://www.youtube.com/embed/videoseries?list=PLQLA52U7_qBPqddrF9dAD9pR5HOhI-zpq" allowfullscreen></iframe></div>
        </div>

        <div style="margin-bottom: 25px;">
            <h3 style="font-family: 'VT323', monospace; color: #fff; margin-bottom: 8px;">Jahresplaylist 2024</h3>
            <div class="responsive-embed" style="padding-bottom: 60%;"><iframe src="https://www.youtube.com/embed/videoseries?list=PLQLA52U7_qBNL4S4PhAzWYsu15Ta2q80B" allowfullscreen></iframe></div>
        </div>

        <div style="margin-bottom: 25px;">
            <h3 style="font-family: 'VT323', monospace; color: #fff; margin-bottom: 8px;">Jahresplaylist 2023</h3>
            <div class="responsive-embed" style="padding-bottom: 60%;"><iframe src="https://www.youtube.com/embed/videoseries?list=PLQLA52U7_qBPJNw536VhdzwEmSeVHGCqx" allowfullscreen></iframe></div>
        </div>

        <div style="margin-bottom: 25px;">
            <h3 style="font-family: 'VT323', monospace; color: #fff; margin-bottom: 8px;">Jahresplaylist 2022</h3>
            <div class="responsive-embed" style="padding-bottom: 60%;"><iframe src="https://www.youtube.com/embed/videoseries?list=PLQLA52U7_qBN4VcQskCzUQoONu-RMwgwP" allowfullscreen></iframe></div>
        </div>
    </aside>
  </div>

  <footer>SCHROTTKISTE // EST. 2025</footer>

  <script>
    async function loadFeed() {
        try {
            const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=https://www.youtube.com/feeds/videos.xml?channel_id=UCiCt3UwZjOAFpF5Yce6DhLA`);
            const data = await res.json();
            document.getElementById('video-feed').innerHTML = data.items.slice(0, 6).map(item => `
                <div class="responsive-embed"><iframe src="https://www.youtube.com/embed/${item.link.split('v=')[1]}" allowfullscreen></iframe></div>
            `).join('');
        } catch(e) { document.getElementById('video-feed').innerHTML = "Fehler beim Laden."; }
    }

    async function playRandomVideo() {
        const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=https://www.youtube.com/feeds/videos.xml?channel_id=UCiCt3UwZjOAFpF5Yce6DhLA`);
        const data = await res.json();
        window.open(data.items[Math.floor(Math.random() * data.items.length)].link, "_blank");
    }

    loadFeed();
  </script>
</body>
</html>
