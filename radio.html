<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="channels4_profile Schrottkiste.jpg" type="image/jpeg">
  <link rel="shortcut icon" href="channels4_profile Schrottkiste.jpg" type="image/jpeg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Command Center | Schrottkiste</title>
  <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Poppins:wght@300;400;600&family=VT323&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --accent: #ff0099;
      --accent-alt: #00ffff;
      --bg: #050415;
      --card: rgba(18, 14, 40, 0.96);
      --sidebar-width: 260px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: var(--bg);
      background-image: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                        radial-gradient(circle at top, #151435 0%, #050415 70%, #020109 100%);
      background-size: 100% 4px, 100% 100%;
      font-family: 'Poppins', sans-serif;
      color: #fff;
      display: flex;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* --- SIDEBAR --- */
    .sidebar {
      width: var(--sidebar-width);
      background: rgba(0, 0, 0, 0.95);
      border-right: 3px solid var(--accent);
      height: 100vh;
      position: fixed;
      left: 0; top: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      z-index: 1000;
    }

    .sidebar-logo {
      font-family: 'Chewy';
      font-size: 2.8rem;
      color: var(--accent);
      text-align: center;
      margin-bottom: 50px;
      text-shadow: 3px 3px 0px var(--accent-alt);
    }

    .sidebar nav a {
      display: block;
      color: #fff;
      text-decoration: none;
      font-family: 'VT323';
      font-size: 1.8rem;
      padding: 15px;
      margin-bottom: 10px;
      border-left: 4px solid transparent;
      transition: 0.3s;
    }

    .sidebar nav a:hover, .sidebar nav a.active {
      background: rgba(255, 0, 153, 0.2);
      border-left: 5px solid var(--accent-alt);
      color: var(--accent-alt);
      padding-left: 25px;
    }

    /* --- MAIN --- */
    .main-wrapper {
      margin-left: var(--sidebar-width);
      flex: 1;
      padding: 40px;
      display: flex;
      justify-content: center;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: 1.3fr 2.2fr 1.3fr;
      gap: 30px;
      width: 100%;
      max-width: 1700px;
    }

    .card { 
      background: var(--card); 
      border: 2px solid #000; 
      padding: 25px; 
      box-shadow: 10px 10px 0px var(--accent);
      display: flex; 
      flex-direction: column;
      position: relative;
    }

    .section-title { 
      font-family: 'VT323'; 
      color: var(--accent-alt); 
      font-size: 1.3rem; 
      margin-bottom: 20px; 
      text-transform: uppercase;
      letter-spacing: 2px;
      border-bottom: 2px solid rgba(0,255,255,0.2);
    }

    /* RADIO */
    .cover-img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border: 3px solid var(--accent); margin-bottom: 20px; }
    #song-display { font-family: 'VT323'; min-height: 6rem; margin-bottom: 20px; }
    .artist-name { font-size: 1.9rem; color: #fff; display: block; line-height: 1; }
    .song-title { font-size: 1.3rem; color: var(--accent-alt); display: block; text-transform: uppercase; margin-top: 8px; }

    .vol-container { margin-top: 20px; display: flex; align-items: center; gap: 15px; background: rgba(0,0,0,0.6); padding: 15px; border: 1px solid #222; }
    input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; cursor: pointer; }
    input[type=range]::-webkit-slider-runnable-track { height: 8px; background: #000; border: 1px solid var(--accent-alt); }
    input[type=range]::-webkit-slider-thumb {
      height: 28px; width: 14px; background: var(--accent); -webkit-appearance: none; margin-top: -11px; box-shadow: 0 0 15px var(--accent); border: 1px solid #fff;
    }

    .btn-action { 
      background: var(--accent); border: none; color: #fff; padding: 18px; 
      font-family: 'VT323'; font-size: 2rem; cursor: pointer; box-shadow: 0 4px 0 #990055;
    }

    /* REAL CONSOLE LOG */
    #event-log { 
      flex: 1; overflow-y: auto; font-family: 'VT323'; font-size: 0.95rem; 
      color: #0f0; background: rgba(0,0,0,0.5); padding: 15px; min-height: 420px;
      border: 1px solid #111; line-height: 1.4;
    }
    #user-input { background: #000; border: 1px solid #333; color: var(--accent-alt); padding: 15px; font-family: 'VT323'; width: 100%; margin-top: 15px; font-size: 1.1rem; }

    /* STATUS */
    .status-card { min-height: 120px; justify-content: center; }
    .status-bar { height: 15px; background: #000; border: 1px solid #444; margin-top: 10px; }
    .status-fill { height: 100%; background: var(--accent); box-shadow: 0 0 15px var(--accent); transition: width 1s; }

    @media (max-width: 1400px) {
      .dashboard-grid { grid-template-columns: 1fr; }
      .main-wrapper { margin-left: 0; padding-top: 100px; }
      .sidebar { display: none; }
    }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-logo">SK</div>
    <nav>
      <a href="index.html">STARTSEITE</a>
      <a href="radio.html" class="active">DASHBOARD</a>
      <a href="ideen.html">PROJEKTE</a>
      <a href="minecrafttahin.html">TAHIN</a>
      <a href="app.html">APP</a>
    </nav>
  </aside>

  <main class="main-wrapper">
    <div class="dashboard-grid">
      
      <section class="card">
        <span class="section-title">RADIO_TUNER</span>
        <img src="channels4_profile Schrottkiste.jpg" class="cover-img">
        <div id="song-display">
          <span class="artist-name" id="disp-artist">SYS_INIT...</span>
          <span class="song-title" id="disp-title">WAITING_FOR_SIGNAL</span>
        </div>
        <button class="btn-action" id="play-btn">START STREAM</button>
        <div class="vol-container">
          <span style="font-family:'VT323'; color:var(--accent-alt)">VOL</span>
          <input type="range" id="vol" min="0" max="1" step="0.01" value="0.5">
        </div>
      </section>

      <section class="card">
        <span class="section-title">VIDEO_FEED</span>
        <div style="position: relative; padding-bottom: 56.25%; height: 0; border: 2px solid var(--accent-alt); background: #000;">
          <iframe src="https://www.youtube.com/embed/5Ejw9OqqY20" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;" frameborder="0" allowfullscreen></iframe>
        </div>
      </section>

      <section class="card">
        <span class="section-title">CONSOLE_OUT</span>
        <div id="event-log"></div>
        <input type="text" id="user-input" placeholder="Enter command...">
      </section>

      <section class="card status-card">
        <span class="section-title">ON_AIR</span>
        <div id="current-show" style="font-family:'VT323'; font-size: 1.8rem;">LOADING...</div>
      </section>

      <section class="card status-card">
        <span class="section-title">TAHIN_COMPILER</span>
        <div style="font-family:'VT323';">MODULE_STABILITY: 85%</div>
        <div class="status-bar"><div class="status-fill" style="width: 85%;"></div></div>
      </section>

      <section class="card status-card">
        <span class="section-title">CORE_UPTIME</span>
        <div id="uptime-display" style="font-family:'VT323'; font-size: 2.5rem; color:var(--accent-alt);">00:00:00</div>
      </section>

    </div>
  </main>

  <audio id="radio-stream" src="https://stream.laut.fm/treasure_radio" crossorigin="anonymous"></audio>

  <script>
    const audio = document.getElementById('radio-stream');
    const playBtn = document.getElementById('play-btn');
    const logBox = document.getElementById('event-log');
    const volSlider = document.getElementById('vol');

    function addLog(msg, type = 'info') {
      const div = document.createElement('div');
      const time = new Date().toLocaleTimeString([], {hour12: false, hour: '2-digit', minute:'2-digit', second:'2-digit'});
      
      let color = '#0f0'; // Info (Grün)
      let prefix = '[INFO]';

      if (type === 'network') { color = '#00ffff'; prefix = '[NET]'; }
      if (type === 'warn') { color = '#ffff00'; prefix = '[WARN]'; }
      if (type === 'error') { color = '#ff3333'; prefix = '[ERR]'; }
      if (type === 'user') { color = '#ff0099'; prefix = '[USR]'; }

      div.innerHTML = `<span style="color:#555">${time}</span> <span style="color:${color}">${prefix} ${msg}</span>`;
      logBox.appendChild(div);
      logBox.scrollTop = logBox.scrollHeight;
    }

    // --- REALE KONSOLENPROZESSE SIMULIEREN ---
    
    // 1. Initialer Boot
    setTimeout(() => addLog("DOMContent Loaded: Parsing Schrottkiste_Layout..."), 500);
    setTimeout(() => addLog("CSSOM reconstructed in 12ms. Reflow complete."), 800);
    setTimeout(() => addLog("Resource fetch: favicon.ico - 404 (Ignored)", "warn"), 1200);

    // 2. Netzwerk-Simulation (API)
    async function updateTrack() {
      addLog("GET https://api.laut.fm/station/treasure_radio/current_song", "network");
      
      try {
        const r = await fetch('https://api.laut.fm/station/treasure_radio/current_song?t=' + Date.now());
        if (r.ok) {
          addLog("Status 200 OK - Parsing JSON payload...", "network");
          const d = await r.json();
          document.getElementById('disp-artist').innerText = d.artist.toUpperCase();
          document.getElementById('disp-title').innerText = d.title.toUpperCase();
        } else {
          addLog("XHR Failed: Status 503 Service Unavailable", "error");
        }
      } catch (e) {
        addLog("CORS Policy: No 'Access-Control-Allow-Origin' header present.", "error");
        addLog("Fallback: Initiating JS-Library tunnel...", "warn");
      }
    }

    // 3. Audio-Engine Prozesse
    playBtn.onclick = () => {
      if(audio.paused) {
        addLog("MediaElement: Requesting playback...");
        audio.play().then(() => {
          addLog("AudioBuffer: Stream connected. Bitrate: 128kbps", "network");
          playBtn.innerText = "STOP STREAM";
        }).catch(e => addLog("NotAllowedError: User interaction required.", "error"));
      } else {
        audio.pause();
        addLog("MediaElement: Playback suspended.");
        playBtn.innerText = "START STREAM";
      }
    };

    // 4. Hintergrund-Aktivität (Alle 30-60 Sek)
    setInterval(() => {
      const logs = [
        "Garbage Collection: freed 4.2MB of heap memory.",
        "UI Thread Heartbeat: 60fps stable.",
        "Internal Clock Sync: Delta 0.002ms.",
        "Storage Check: localStorage clean.",
        "Worker Thread: Idle."
      ];
      addLog(logs[Math.floor(Math.random() * logs.length)]);
    }, 45000);

    // --- STANDARD FUNKTIONEN ---
    function updateShow() {
      const h = new Date().getHours();
      let s = h >= 18 ? "GAMING SOUNDS" : (h >= 12 ? "IMMER AB 12!" : "MORNING STARTER");
      document.getElementById('current-show').innerText = s;
    }

    let sec = 0;
    setInterval(() => {
      sec++;
      const h = Math.floor(sec/3600).toString().padStart(2,'0');
      const m = Math.floor((sec%3600)/60).toString().padStart(2,'0');
      const s = (sec%60).toString().padStart(2,'0');
      document.getElementById('uptime-display').innerText = `${h}:${m}:${s}`;
    }, 1000);

    volSlider.oninput = (e) => {
      audio.volume = e.target.value;
      if (sec % 5 === 0) addLog(`AudioNode: Gain changed to ${Math.round(e.target.value*100)}%`);
    };

    document.getElementById('user-input').onkeypress = (e) => {
      if(e.key === 'Enter' && e.target.value.trim()) {
        addLog(`Executing: "${e.target.value}"`, "user");
        e.target.value = '';
      }
    };

    updateTrack();
    updateShow();
    setInterval(updateTrack, 20000);
  </script>
</body>
</html>
