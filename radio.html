<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="channels4_profile Schrottkiste.jpg" type="image/jpeg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Command Center v4.6 | Schrottkiste</title>
  <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Poppins:wght@300;400;600&family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent: #ff0099;
      --accent-alt: #00ffff;
      --bg: #020205;
      --card: rgba(15, 15, 20, 0.98);
      --text: #ffffff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      font-family: 'Poppins', sans-serif;
      color: var(--text);
      display: flex;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative; /* Für die MC-Version */
    }

    /* --- SIDEBAR --- */
    .sidebar-nav {
      width: 240px; background: #000; border-right: 1px solid #111;
      display: flex; flex-direction: column; padding: 30px 20px;
      position: sticky; top: 0; height: 100vh; flex-shrink: 0;
    }
    .logo-area { font-family: 'Chewy'; font-size: 2.2rem; text-align: center; margin-bottom: 40px; }
    .logo-area a { color: var(--accent); text-decoration: none; transition: 0.3s; }
    .logo-area a:hover { text-shadow: 0 0 15px var(--accent); }

    .sidebar-nav a.nav-link { 
      color: #666; text-decoration: none; font-family: 'VT323'; font-size: 1.5rem; 
      margin-bottom: 12px; padding: 12px; border-radius: 8px; transition: 0.2s; 
    }
    .sidebar-nav a.nav-link.active { color: #fff; background: #111; box-shadow: inset 4px 0 0 var(--accent-alt); }

    /* --- MAIN CONTENT --- */
    .main-content { flex: 1; padding: 25px; background: radial-gradient(circle at top right, #100820 0%, #020205 70%); }
    .dashboard-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }

    .card { background: var(--card); border: 1px solid rgba(255,255,255,0.03); border-radius: 12px; padding: 20px; }
    .section-title { font-family: 'VT323'; font-size: 1.1rem; color: var(--accent-alt); margin-bottom: 10px; display: block; }

    /* --- COMPONENTS --- */
    .radio-box { grid-column: span 1; }
    .show-name-big { font-family: 'VT323'; font-size: 1.6rem; color: #fff; line-height: 1.2; min-height: 4rem; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; }
    .song-artist { font-size: 1.1rem; color: #aaa; }
    .btn-play { background: var(--accent); color: white; border: none; padding: 12px; border-radius: 6px; font-family: 'VT323'; font-size: 1.4rem; cursor: pointer; width: 100%; margin-top: 15px; }

    .video-spotlight { grid-column: span 2; padding: 0; background: #000; border: 1px solid var(--accent-alt); overflow: hidden; height: fit-content; }
    .video-container { position: relative; padding-bottom: 56.25%; height: 0; }
    .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

    .log-box { grid-column: span 1; display: flex; flex-direction: column; height: 350px; }
    #event-log { flex: 1; overflow-y: auto; font-family: 'VT323'; font-size: 0.85rem; color: #aaa; }
    .input-group { display: flex; gap: 5px; margin-top: 10px; }
    #user-input { background: #000; border: 1px solid #222; color: #fff; padding: 8px; flex: 1; border-radius: 4px; font-family: 'VT323'; outline: none; }
    #send-btn { background: #222; color: var(--accent-alt); border: none; padding: 0 10px; border-radius: 4px; cursor: pointer; font-family: 'VT323'; }

    .schedule-header { font-family: 'VT323'; font-size: 2.2rem; color: var(--accent); margin-bottom: 15px; border-bottom: 2px solid var(--accent); }
    .schedule-item { font-family: 'VT323'; font-size: 1.5rem; color: #444; padding: 10px; background: rgba(255,255,255,0.02); border-radius: 8px; margin-bottom: 10px; }
    .schedule-item.active { background: rgba(0, 255, 255, 0.08); color: var(--accent-alt); border-left: 5px solid var(--accent-alt); }

    .watch-val { font-family: 'VT323'; font-size: 2.4rem; color: #fff; }
    .neon-clock { color: var(--accent-alt); text-shadow: 0 0 10px var(--accent-alt); }
    .compact-card { width: fit-content; min-width: 180px; }

    /* --- MINECRAFT VERSION TAG --- */
    .mc-version {
      position: fixed;
      bottom: 10px;
      right: 15px;
      font-family: 'VT323';
      font-size: 1.1rem;
      color: rgba(255, 255, 255, 0.6);
      text-shadow: 2px 2px 0px rgba(0, 0, 0, 0.8);
      pointer-events: none;
      z-index: 1000;
    }

    @media (max-width: 1200px) { .dashboard-grid { grid-template-columns: 1fr; } .sidebar-nav { display: none; } }
  </style>
</head>
<body>

  <div class="mc-version">Schrottkiste CC v4.6-stable</div>

  <aside class="sidebar-nav">
    <div class="logo-area">
      <a href="index.html">SK RADIO</a> </div>
    <nav>
      <a href="index.html" class="nav-link">🏠 HOME</a>
      <a href="#" class="nav-link active">📻 DASHBOARD</a>
      <a href="#" class="nav-link">💡 PROJEKTE</a>
      <a href="radio.html">Radio</a>
    </nav>
  </aside>

  <main class="main-content">
    <div class="dashboard-grid">
      
      <section class="card radio-box">
        <span class="section-title">CURRENT_PLAYING</span>
        <div class="show-name-big">
          <div id="song-title">LÄDT...</div>
          <div id="song-artist" class="song-artist">...</div>
        </div>
        <button class="btn-play" id="play-btn">START STREAM</button>
      </section>

      <section class="card video-spotlight">
        <div class="video-container">
          <iframe src="https://www.youtube.com/embed/5Ejw9OqqY20" allowfullscreen></iframe>
        </div>
      </section>

      <section class="card log-box">
        <span class="section-title">SYSTEM_LOG</span>
        <div id="event-log"></div>
        <div class="input-group">
          <input type="text" id="user-input" placeholder="Befehl...">
          <button id="send-btn">EXE</button>
        </div>
      </section>

      <section class="card">
        <h1 class="schedule-header">SENDEPLAN</h1>
        <div id="schedule-container">
          <div class="schedule-item" data-h="6"><span style="font-size:0.9rem;display:block">06:00</span>MORNING</div>
          <div class="schedule-item" data-h="12"><span style="font-size:0.9rem;display:block">12:00</span>IMMER AB 12!</div>
          <div class="schedule-item" data-h="18"><span style="font-size:0.9rem;display:block">18:00</span>HITS (60-90ER)</div>
          <div class="schedule-item" data-h="23"><span style="font-size:0.9rem;display:block">23:00</span>NACHTEULEN PARTY</div>
        </div>
      </section>

      <section class="card compact-card">
        <span class="section-title">SYSTEM_TIME</span>
        <div class="watch-val neon-clock" id="system-clock">00:00:00</div>
      </section>

      <section class="card compact-card">
        <span class="section-title">UPTIME</span>
        <div class="watch-val" id="uptime-display">00:00:00</div>
      </section>

      <section class="card style="grid-column: span 2;">
        <span class="section-title">PROJECT_STATUS</span>
        <p style="font-family: 'VT323'; font-size: 1.1rem; color: #aaa; margin-bottom: 5px;">Minecraft Tahin: Zelda Build</p>
        <div style="width: 100%; height: 8px; background: #111; border-radius: 4px;">
          <div style="width: 85%; height: 100%; background: var(--accent); box-shadow: 0 0 10px var(--accent);"></div>
        </div>
      </section>

    </div>
  </main>

  <audio id="radio-stream" src="https://stream.laut.fm/treasure_radio" preload="none"></audio>

  <script>
    const logContainer = document.getElementById('event-log');
    const userInput = document.getElementById('user-input');
    const audio = document.getElementById('radio-stream');
    const playBtn = document.getElementById('play-btn');
    const sysClock = document.getElementById('system-clock');
    const upDisplay = document.getElementById('uptime-display');
    
    // Elemente für die Live-Songanzeige
    const songTitleDisplay = document.getElementById('song-title');
    const songArtistDisplay = document.getElementById('song-artist');

    const schedule = [
      { start: 0, name: "Nachteulen Party" },
      { start: 6, name: "Morning ab 6 Uhr" },
      { start: 12, name: "immer ab 12!" },
      { start: 18, name: "60er,70er,80er,90er Hits" },
      { start: 23, name: "Nachteulen Party" }
    ];

    let lastTrackInfo = "";

    function addLog(msg, type = 'sys') {
      const time = new Date().toLocaleTimeString([], { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
      const entry = document.createElement('div');
      entry.className = 'log-entry';
      let colorClass = type === 'sys' ? 'log-sys' : 'log-user';
      entry.innerHTML = `<span style="color:#555">${time}</span> <span class="${colorClass}">[${type.toUpperCase()}]</span> ${msg}`;
      logContainer.appendChild(entry);
      logContainer.scrollTop = logContainer.scrollHeight;
    }

    // Holt die aktuellen Songdaten von laut.fm
    async function fetchCurrentSong() {
      try {
        const response = await fetch('https://api.laut.fm/station/treasure_radio/current_song');
        if (!response.ok) throw new Error('API Fehler');
        const data = await response.json();
        
        if (data && data.title) {
          const currentTitle = data.title.toUpperCase();
          const currentArtist = data.artist && data.artist.name ? data.artist.name.toUpperCase() : "UNKNOWN ARTIST";
          
          songTitleDisplay.innerText = currentTitle;
          songArtistDisplay.innerText = currentArtist;

          // Neuen Song im System-Log vermerken, wenn er sich geändert hat
          const trackString = `${currentArtist} - ${currentTitle}`;
          if (trackString !== lastTrackInfo) {
            lastTrackInfo = trackString;
            addLog(`Track: ${data.artist.name} - ${data.title}`, "sys");
          }
        }
      } catch (error) {
        console.error('Fehler beim Laden des Songs:', error);
        songTitleDisplay.innerText = "STREAM ONLINE";
        songArtistDisplay.innerText = "TREASURE RADIO";
      }
    }

    function updateDashboard() {
      const now = new Date();
      const hour = now.getHours();
      sysClock.innerText = now.toLocaleTimeString([], { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });

      let activeIndex = 0;
      for (let i = 0; i < schedule.length; i++) {
        if (hour >= schedule[i].start) activeIndex = i;
      }

      const active = schedule[activeIndex];

      document.querySelectorAll('.schedule-item').forEach(item => {
        item.classList.remove('active');
        if(parseInt(item.getAttribute('data-h')) === active.start) item.classList.add('active');
      });
    }

    playBtn.onclick = () => {
      if (audio.paused) {
        audio.play().then(() => { playBtn.innerText = "STOP STREAM"; addLog("Stream online.", "sys"); });
      } else {
        audio.pause(); playBtn.innerText = "START STREAM"; addLog("Stream offline.", "sys");
      }
    };

    document.getElementById('send-btn').onclick = () => {
      if(userInput.value.trim()) { addLog(userInput.value, 'user'); userInput.value = ''; }
    };

    // Uptime-Zähler und Dashboard-Refresh jede Sekunde
    let sec = 0;
    setInterval(() => {
      sec++;
      const h = Math.floor(sec/3600).toString().padStart(2, '0');
      const m = Math.floor((sec%3600)/60).toString().padStart(2, '0');
      const s = (sec%60).toString().padStart(2, '0');
      upDisplay.innerText = `${h}:${m}:${s}`;
      updateDashboard();
    }, 1000);

    // Song-Update alle 15 Sekunden abrufen
    setInterval(fetchCurrentSong, 15000);

    // Erstaufruf beim Laden der Seite
    updateDashboard();
    fetchCurrentSong();
  </script>
</body>
</html>
