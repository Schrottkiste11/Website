<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="channels4_profile Schrottkiste.jpg" type="image/jpeg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Schrottkiste</title>
  <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Poppins:wght@300;400;600&family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent: #ff0099;
      --accent-alt: #00ffff;
      --bg: #050415;
      --card: rgba(18, 14, 40, 0.96);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      background-image: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                        radial-gradient(circle at top, #151435 0%, #050415 70%, #020109 100%);
      background-size: 100% 4px, 100% 100%;
      font-family: 'Poppins', sans-serif;
      color: #fff;
      min-height: 100vh;
      padding: 20px;
    }

    /* Navigation */
    .hamburger-btn {
      position: fixed; top: 20px; left: 20px; z-index: 100;
      background: var(--accent); border: 2px solid #fff; padding: 5px 15px;
      cursor: pointer; font-family: 'VT323'; box-shadow: 4px 4px 0 var(--accent-alt);
    }

    /* Dashboard Grid (Breit wie im Screenshot) */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1.2fr 2fr 1.2fr; /* 3 Spalten Layout */
      grid-template-rows: auto auto;
      gap: 20px;
      max-width: 1800px;
      margin: 60px auto 0;
    }

    .card { 
      background: var(--card); border: 2px solid #000; 
      padding: 15px; box-shadow: 8px 8px 0px var(--accent);
      display: flex; flex-direction: column;
    }

    .section-title { font-family: 'VT323'; color: var(--accent-alt); font-size: 1.2rem; margin-bottom: 10px; }

    /* YouTube Video (Mitte) */
    .video-box { grid-column: 2; grid-row: 1; }
    .video-container { position: relative; padding-bottom: 56.25%; height: 0; border: 2px solid var(--accent-alt); }
    .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

    /* Radio Box (Links) */
    .radio-box { grid-column: 1; grid-row: 1; }
    .cover-img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border: 1px solid var(--accent-alt); margin-bottom: 10px; }
    #song-display { font-family: 'VT323'; font-size: 1.4rem; color: #fff; min-height: 3em; line-height: 1.2; }

    /* Log Box (Rechts) */
    .log-box { grid-column: 3; grid-row: 1; height: 100%; }
    #event-log { flex: 1; overflow-y: auto; font-family: 'VT323'; font-size: 0.9rem; color: #888; margin-bottom: 10px; max-height: 400px; }

    /* Untere Zeile */
    .bottom-box { grid-row: 2; }
    .status-bar { height: 10px; background: #000; border: 1px solid #333; position: relative; overflow: hidden; }
    .status-fill { height: 100%; background: var(--accent); box-shadow: 0 0 15px var(--accent); transition: width 1s; }

    .btn-action { 
      background: var(--accent); border: none; color: #fff; padding: 10px; 
      font-family: 'VT323'; font-size: 1.5rem; cursor: pointer; width: 100%; margin-top: 10px;
    }

    #user-input { background: #000; border: 1px solid #333; color: var(--accent-alt); padding: 5px; font-family: 'VT323'; width: 100%; }

    @media (max-width: 1000px) { .dashboard-grid { grid-template-columns: 1fr; } .video-box, .radio-box, .log-box { grid-column: 1; } }
  </style>
</head>
<body>

  <button class="hamburger-btn" onclick="window.location.href='index.html'">🏠 HOME</button>

  <main class="dashboard-grid">
    
    <section class="card radio-box">
      <span class="section-title">RADIO_TUNER</span>
      <img src="channels4_profile Schrottkiste.jpg" class="cover-img">
      <div id="song-display">INITIALISIERUNG...</div>
      <button class="btn-action" id="play-btn">START STREAM</button>
      <input type="range" id="vol" min="0" max="1" step="0.1" value="0.5" style="margin-top:10px; accent-color:var(--accent-alt);">
    </section>

    <section class="card video-box">
      <div class="video-container">
        <iframe src="https://www.youtube.com/embed/5Ejw9OqqY20?si=xP3KKiApgkSbAoPK" frameborder="0" allowfullscreen></iframe>
      </div>
    </section>

    <section class="card log-box">
      <span class="section-title">SYSTEM_LOG & CHAT</span>
      <div id="event-log"></div>
      <input type="text" id="user-input" placeholder="Nachricht...">
    </section>

    <section class="card bottom-box">
      <span class="section-title">AKTUELL IM RADIO</span>
      <div id="current-show" style="font-family:'VT323'; font-size:1.5rem;">Lade Show...</div>
    </section>

    <section class="card bottom-box" style="grid-column: span 1;">
      <span class="section-title">PROJECT_STATUS</span>
      <div style="font-family:'VT323'; margin-bottom:5px;">ZELDA BUILD: 85%</div>
      <div class="status-bar"><div class="status-fill" style="width: 85%;"></div></div>
    </section>

    <section class="card bottom-box">
      <span class="section-title">UPTIME</span>
      <div id="uptime-display" style="font-family:'VT323'; font-size:2rem;">00:00:00</div>
    </section>

  </main>

  <audio id="radio-stream" src="https://stream.laut.fm/treasure_radio"></audio>

  <script>
    const audio = document.getElementById('radio-stream');
    const playBtn = document.getElementById('play-btn');
    const songDisplay = document.getElementById('song-display');
    const logBox = document.getElementById('event-log');
    const uptimeBox = document.getElementById('uptime-display');

    // 1. Log Funktion
    function addLog(msg, sys = true) {
      const div = document.createElement('div');
      div.innerHTML = `<span style="color:#444">[${new Date().toLocaleTimeString()}]</span> <span style="color:${sys?'#0ff':'#f09'}">${sys?'[SYS]':'[MSG]'}</span> ${msg}`;
      logBox.appendChild(div);
      logBox.scrollTop = logBox.scrollHeight;
    }

    // 2. Song & Künstler API (EXAKT HIER WIRD GELADEN)
    async function updateTrack() {
      try {
        const r = await fetch('https://api.laut.fm/station/treasure_radio/current_song');
        const d = await r.json();
        // Hier wird Künstler + Titel zusammengesetzt
        const fullTrack = `${d.artist.toUpperCase()} <br> <span style="color:var(--accent-alt)">${d.title.toUpperCase()}</span>`;
        
        if (songDisplay.innerHTML !== fullTrack) {
          songDisplay.innerHTML = fullTrack;
          addLog("Track-Wechsel: " + d.artist + " - " + d.title);
        }
      } catch (e) { songDisplay.innerText = "TREASURE RADIO LIVE"; }
    }

    // 3. Sendeplan
    function updateShow() {
      const h = new Date().getHours();
      let s = "NIGHT CHILL";
      if(h >= 6) s = "MORNING SHOW";
      if(h >= 12) s = "IMMER AB 12! LIVE";
      if(h >= 18) s = "GAMING SOUNDTRACKS";
      document.getElementById('current-show').innerText = s;
    }

    // 4. Uptime Timer
    let sec = 0;
    setInterval(() => {
      sec++;
      const hrs = Math.floor(sec/3600).toString().padStart(2,'0');
      const min = Math.floor((sec%3600)/60).toString().padStart(2,'0');
      const s = (sec%60).toString().padStart(2,'0');
      uptimeBox.innerText = `${hrs}:${min}:${s}`;
    }, 1000);

    // Controls
    playBtn.onclick = () => {
      if(audio.paused) { audio.play(); playBtn.innerText = "STOP STREAM"; addLog("Radio gestartet."); }
      else { audio.pause(); playBtn.innerText = "START STREAM"; addLog("Radio gestoppt."); }
    };

    document.getElementById('user-input').onkeypress = (e) => {
      if(e.key === 'Enter' && e.target.value) { addLog(e.target.value, false); e.target.value = ''; }
    };

    // INIT
    updateTrack();
    updateShow();
    setInterval(updateTrack, 20000);
    addLog("Dashboard-Kernel v2.7 bereit.");
  </script>
</body>
</html>
