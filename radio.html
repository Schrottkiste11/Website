<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="channels4_profile Schrottkiste.jpg" type="image/jpeg">
  <link rel="shortcut icon" href="channels4_profile Schrottkiste.jpg" type="image/jpeg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Command Center | Schrottkiste</title>
  <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Poppins:wght@300;400;600&family=VT323&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --accent: #ff0099;
      --accent-alt: #00ffff;
      --bg: #050415;
      --card: rgba(18, 14, 40, 0.96);
      --sidebar-width: 260px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: var(--bg);
      background-image: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                        radial-gradient(circle at top, #151435 0%, #050415 70%, #020109 100%);
      background-size: 100% 4px, 100% 100%;
      font-family: 'Poppins', sans-serif;
      color: #fff;
      display: flex;
      height: 100vh; /* Fest auf Viewport-Höhe */
      overflow: hidden; /* Verhindert Scrollen der gesamten Seite */
    }

    /* --- SIDEBAR --- */
    .sidebar {
      width: var(--sidebar-width);
      background: rgba(0, 0, 0, 0.95);
      border-right: 3px solid var(--accent);
      height: 100vh;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-logo {
      font-family: 'Chewy';
      font-size: 2.8rem; color: var(--accent);
      text-align: center; margin-bottom: 40px;
      text-shadow: 3px 3px 0px var(--accent-alt);
    }

    .sidebar nav a {
      display: block; color: #fff; text-decoration: none;
      font-family: 'VT323'; font-size: 1.6rem;
      padding: 12px 15px; margin-bottom: 10px;
      border-left: 4px solid transparent; transition: 0.2s;
    }

    .sidebar nav a.active { border-left: 5px solid var(--accent-alt); color: var(--accent-alt); background: rgba(255, 0, 153, 0.1); }

    /* --- MAIN CONTENT --- */
    .main-wrapper {
      flex: 1;
      padding: 25px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden; /* Schneidet alles ab, was nicht reinpasst */
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: 1.2fr 2fr 1.2fr;
      grid-template-rows: 1fr auto; /* Obere Reihe nimmt Platz ein, untere passt sich an */
      gap: 20px;
      width: 100%;
      height: 100%;
      max-width: 1700px;
      margin: 0 auto;
    }

    .card { 
      background: var(--card); 
      border: 2px solid #000; 
      padding: 20px; 
      box-shadow: 8px 8px 0px var(--accent);
      display: flex; 
      flex-direction: column;
      overflow: hidden; /* WICHTIG: Kein Inhalt darf die Box vergrößern */
    }

    .section-title { 
      font-family: 'VT323'; color: var(--accent-alt); 
      font-size: 1.1rem; margin-bottom: 15px; 
      text-transform: uppercase; border-bottom: 1px solid rgba(0,255,255,0.1);
      flex-shrink: 0;
    }

    /* RADIO BOX */
    .cover-img { width: 100%; aspect-ratio: 1/1; max-height: 250px; object-fit: cover; border: 2px solid var(--accent); margin-bottom: 15px; flex-shrink: 1; }
    #song-display { font-family: 'VT323'; margin-bottom: 10px; overflow: hidden; }
    .artist-name { font-size: 1.6rem; color: #fff; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .song-title { font-size: 1.1rem; color: var(--accent-alt); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* LOG BOX */
    #event-log { 
      flex: 1; 
      font-family: 'VT323'; font-size: 0.9rem; 
      color: #0f0; background: rgba(0,0,0,0.4); padding: 10px;
      overflow-y: auto; /* Log darf intern scrollen */
      scrollbar-width: thin;
      scrollbar-color: var(--accent) #000;
    }

    /* VIDEO */
    .video-container { position: relative; width: 100%; padding-top: 56.25%; background: #000; border: 1px solid var(--accent-alt); flex-shrink: 0; }
    .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

    /* UNTERE REIHE */
    .status-card { height: 90px; }

    .status-bar { height: 10px; background: #000; border: 1px solid #333; margin-top: 8px; }
    .status-fill { height: 100%; background: var(--accent); width: 85%; box-shadow: 0 0 10px var(--accent); }

    #user-input { background: #000; border: 1px solid #333; color: var(--accent-alt); padding: 10px; font-family: 'VT323'; width: 100%; margin-top: 10px; flex-shrink: 0; }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-logo">SK</div>
    <nav>
      <a href="index.html">STARTSEITE</a>
      <a href="radio.html" class="active">DASHBOARD</a>
      <a href="ideen.html">PROJEKTE</a>
      <a href="minecrafttahin.html">TAHIN</a>
      <a href="app.html">APP</a>
    </nav>
  </aside>

  <main class="main-wrapper">
    <div class="dashboard-grid">
      
      <section class="card">
        <span class="section-title">RADIO_CORE</span>
        <img src="channels4_profile Schrottkiste.jpg" class="cover-img">
        <div id="song-display">
          <span class="artist-name" id="disp-artist">SYNCING...</span>
          <span class="song-title" id="disp-title">WAIT_FOR_DATA</span>
        </div>
        <button class="btn-action" id="play-btn" style="background:var(--accent); border:none; color:#fff; padding:12px; font-family:'VT323'; font-size:1.5rem; cursor:pointer;">START STREAM</button>
      </section>

      <section class="card">
        <span class="section-title">VIDEO_FEED</span>
        <div class="video-container">
          <iframe src="https://www.youtube.com/embed/5Ejw9OqqY20" frameborder="0" allowfullscreen></iframe>
        </div>
      </section>

      <section class="card">
        <span class="section-title">CONSOLE_OUTPUT</span>
        <div id="event-log"></div>
        <input type="text" id="user-input" placeholder="CMD_">
      </section>

      <section class="card status-card">
        <span class="section-title">CURRENT_SHOW</span>
        <div id="current-show" style="font-family:'VT323'; font-size:1.4rem;">LOADING...</div>
      </section>

      <section class="card status-card">
        <span class="section-title">TAHIN_BUILD</span>
        <div style="font-family:'VT323'; font-size:0.9rem;">PROGRESS: 85%</div>
        <div class="status-bar"><div class="status-fill"></div></div>
      </section>

      <section class="card status-card">
        <span class="section-title">UPTIME</span>
        <div id="uptime-display" style="font-family:'VT323'; font-size:2rem; color:var(--accent-alt);">00:00:00</div>
      </section>

    </div>
  </main>

  <audio id="radio-stream" src="https://stream.laut.fm/treasure_radio" crossorigin="anonymous"></audio>

  <script>
    const audio = document.getElementById('radio-stream');
    const playBtn = document.getElementById('play-btn');
    const logBox = document.getElementById('event-log');

    function addLog(msg, type = 'info') {
      const div = document.createElement('div');
      const colors = { info: '#0f0', net: '#0ff', err: '#f33', warn: '#ff0', usr: '#f09' };
      const prefix = type.toUpperCase();
      div.innerHTML = `<span style="color:#555">${new Date().toLocaleTimeString()}</span> <span style="color:${colors[type]}">[${prefix}] ${msg}</span>`;
      logBox.appendChild(div);
      logBox.scrollTop = logBox.scrollHeight;
    }

    // CORS FIX VERSUCH: Proxy oder direktes Catching
    async function updateTrack() {
      addLog("Fetching metadata via API...", "net");
      try {
        // Wir nutzen einen Cache-Buster (?t=...), um den Browser zu zwingen, neu zu laden
        const r = await fetch('https://api.laut.fm/station/treasure_radio/current_song?t=' + Date.now());
        if (!r.ok) throw new Error("HTTP " + r.status);
        const d = await r.json();
        document.getElementById('disp-artist').innerText = d.artist.toUpperCase();
        document.getElementById('disp-title').innerText = d.title.toUpperCase();
        addLog("Sync successful: " + d.artist, "info");
      } catch (e) {
        addLog("CORS Policy Block: " + e.message, "err");
        addLog("Hint: Run with Live Server or upload to Web.", "warn");
      }
    }

    playBtn.onclick = () => {
      if(audio.paused) {
        audio.play(); playBtn.innerText = "STOP STREAM"; addLog("Audio stream initialized.", "info");
      } else {
        audio.pause(); playBtn.innerText = "START STREAM"; addLog("Audio stream paused.", "info");
      }
    };

    // Uptime & Show
    let sec = 0;
    setInterval(() => {
      sec++;
      const time = [sec/3600, (sec%3600)/60, sec%60].map(v => Math.floor(v).toString().padStart(2,'0')).join(':');
      document.getElementById('uptime-display').innerText = time;
    }, 1000);

    updateTrack();
    setInterval(updateTrack, 30000);
    addLog("System ready. All overflows clamped.", "info");
  </script>
</body>
</html>
