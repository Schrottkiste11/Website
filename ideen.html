<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schrottkiste – Content-Plan</title>
  <meta name="description" content="Schrottkiste – Twitch- und YouTube-Content von Luka. Streams, Blog-Updates und Playlists.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Schrottkiste">
  <meta property="og:description" content="Twitch- und YouTube-Content von Luka. Streams, Blog-Updates und Playlists.">
  <meta property="og:image" content="images/image.png">
  <meta name="theme-color" content="#1a1a24">
  
  <!-- Performance Optimierung -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231a1a24'/%3E%3Ctext x='50' y='70' font-family='Arial,sans-serif' font-weight='900' font-size='58' fill='%23ff0099' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Poppins:wght@300;400;600;700&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --accent: #ff0099;
      --accent-alt: #00ffff;
      --bg: #1a1a24;
      --card-bg: #242430;
      --text: #f3f1ff;
      --text-secondary: #b0b0c0;
      --line-color: #3a3a4a;
      --shadow: 0 4px 20px rgba(0,0,0,0.3);
      --radius: 12px;
      --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      background: var(--bg);
      font-family: 'Poppins', sans-serif;
      color: var(--text);
      overflow-wrap: break-word;
      line-height: 1.6;
      touch-action: pan-y;
    }
    
    :focus-visible {
      outline: 3px solid var(--accent-alt);
      outline-offset: 3px;
      border-radius: 4px;
    }
    
    ::-webkit-scrollbar {
      width: 10px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--accent);
      border-radius: 5px;
    }
    
    /* Navigation */
    .nav-header {
      background: var(--card-bg);
      padding: 20px 5%;
      border-bottom: 1px solid var(--line-color);
      position: sticky;
      top: 0;
      z-index: 1000;
      backdrop-filter: blur(10px);
      box-shadow: 0 2px 20px rgba(0,0,0,0.2);
    }
    
    .brand-row {
      display: flex;
      justify-content: center;
      margin-bottom: 15px;
    }
    
    .nav-brand {
      font-family: 'Chewy', cursive;
      font-size: 3.5rem;
      color: #fff;
      text-decoration: none;
      transition: var(--transition);
      text-shadow: 0 0 20px rgba(255,0,153,0.3);
    }
    
    .nav-brand:hover {
      transform: scale(1.05);
      text-shadow: 0 0 30px rgba(255,0,153,0.5);
    }
    
    .menu-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--line-color);
      padding-top: 15px;
      flex-wrap: wrap;
      gap: 20px;
    }
    
    .nav-links {
      display: flex;
      gap: 30px;
      list-style: none;
      padding: 0;
      margin: 0;
    }
    
    .nav-links a {
      text-decoration: none;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      transition: var(--transition);
      position: relative;
      padding: 5px 0;
    }
    
    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 0;
      height: 2px;
      background: var(--accent);
      transition: var(--transition);
    }
    
    .nav-links a:hover::after,
    .nav-links a.active::after {
      width: 100%;
    }
    
    .nav-links a:hover,
    .nav-links a.active {
      color: var(--accent);
    }
    
    /* Mini Player */
    .mini-player {
      background: linear-gradient(135deg, #1a1a24 0%, #242430 100%);
      padding: 12px 20px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid var(--line-color);
      box-shadow: var(--shadow);
      transition: var(--transition);
    }
    
    .mini-player:hover {
      border-color: var(--accent);
      box-shadow: 0 6px 25px rgba(255,0,153,0.2);
    }
    
    .player-label {
      font-size: 0.7rem;
      color: var(--accent);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    
    .player-controls {
      display: flex;
      gap: 8px;
    }
    
    .player-controls button {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      cursor: pointer;
      transition: var(--transition);
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .player-controls button:hover {
      transform: scale(1.1);
      box-shadow: 0 0 20px rgba(255,0,153,0.5);
    }
    
    .track-info-mini {
      min-width: 120px;
      max-width: 150px;
    }
    
    #song-title {
      color: var(--accent-alt);
      font-weight: 700;
      font-size: 0.8rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    #artist-name {
      color: var(--text-secondary);
      font-size: 0.7rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    /* Visualizer */
    .visualizer {
      display: flex;
      gap: 2px;
      align-items: flex-end;
      height: 20px;
    }
    
    .visualizer-bar {
      width: 3px;
      background: var(--accent);
      border-radius: 2px;
      animation: visualize 1s ease-in-out infinite;
    }
    
    .visualizer-bar:nth-child(2) { animation-delay: 0.1s; }
    .visualizer-bar:nth-child(3) { animation-delay: 0.2s; }
    .visualizer-bar:nth-child(4) { animation-delay: 0.3s; }
    .visualizer-bar:nth-child(5) { animation-delay: 0.4s; }
    
    @keyframes visualize {
      0%, 100% { height: 8px; }
      50% { height: 20px; }
    }
    
    .social-btns {
      display: flex;
      gap: 20px;
    }
    
    .social-btn {
      color: #fff;
      font-size: 1.8rem;
      transition: var(--transition);
      position: relative;
    }
    
    .social-btn:hover {
      transform: translateY(-3px);
    }
    
    .twitch:hover {
      color: #9146FF;
      text-shadow: 0 0 20px rgba(145,70,255,0.5);
    }
    
    .youtube:hover {
      color: #FF0000;
      text-shadow: 0 0 20px rgba(255,0,0,0.5);
    }
    
    /* Main Container */
    .container {
      display: flex;
      padding: 60px 5%;
      gap: 40px;
      max-width: 1400px;
      margin: 0 auto;
      align-items: flex-start;
    }
    
    .gif-container {
      flex: 0 0 200px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      position: sticky;
      top: 120px;
    }
    
    .gif-box {
      width: 100%;
      aspect-ratio: 1/1;
      cursor: pointer;
      border-radius: var(--radius);
      background-size: cover;
      background-position: center;
      transition: var(--transition);
      border: 2px solid transparent;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }
    
    .gif-box::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, rgba(255,0,153,0.2), transparent);
      opacity: 0;
      transition: var(--transition);
    }
    
    .gif-box:hover {
      transform: translateY(-5px);
      border-color: var(--accent);
      box-shadow: 0 8px 30px rgba(255,0,153,0.3);
    }
    
    .gif-box:hover::before {
      opacity: 1;
    }
    
    .gif-box:active {
      transform: scale(0.98);
    }
    
    .gif-status {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 2px solid white;
      z-index: 2;
      transition: var(--transition);
    }
    
    .gif-status.playing {
      background: #00ff00;
      box-shadow: 0 0 10px rgba(0,255,0,0.5);
    }
    
    .gif-status.paused {
      background: #ff0000;
      box-shadow: 0 0 10px rgba(255,0,0,0.5);
    }
    
    /* Main Content Area */
    .blog-section {
      flex: 2;
      display: flex;
      flex-direction: column;
      gap: 30px;
      min-width: 0;
    }
    
    .blog-post {
      background: var(--card-bg);
      padding: 35px;
      border-radius: var(--radius);
      border-left: 4px solid var(--accent);
      box-shadow: var(--shadow);
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }
    
    .post-title {
      font-size: 2.2rem;
      margin-bottom: 20px;
      color: var(--accent-alt);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }
    
    .post-text {
      line-height: 1.8;
      font-size: 1.1rem;
      color: var(--text);
    }

    /* Sidebar */
    .sidebar {
      flex: 0 0 300px;
      border-left: 2px solid var(--line-color);
      padding-left: 40px;
      position: sticky;
      top: 120px;
    }
    
    .sidebar-title {
      margin: 0 0 30px;
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      font-size: 1.3rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--accent-alt);
      position: relative;
      padding-bottom: 15px;
    }
    
    .sidebar-title::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 50px;
      height: 3px;
      background: var(--accent);
      border-radius: 2px;
    }
    
    .playlist-item {
      margin-bottom: 30px;
      text-align: center;
      transition: var(--transition);
    }
    
    .playlist-item:hover {
      transform: translateY(-5px);
    }
    
    .playlist-title {
      display: block;
      margin-top: 12px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
      transition: var(--transition);
    }
    
    .playlist-item:hover .playlist-title {
      color: var(--accent);
    }
    
    .cover-img {
      width: 100%;
      max-width: 240px;
      border-radius: var(--radius);
      display: block;
      margin: 0 auto;
      transition: var(--transition);
      box-shadow: var(--shadow);
    }
    
    .playlist-item:hover .cover-img {
      box-shadow: 0 10px 30px rgba(0,255,255,0.3);
      transform: scale(1.05);
    }
    
    /* Footer */
    .site-footer {
      margin-top: 80px;
      padding: 30px 5%;
      border-top: 1px solid var(--line-color);
      background: var(--card-bg);
      box-shadow: 0 -2px 20px rgba(0,0,0,0.2);
    }
    
    .footer-inner {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
    }
    
    .footer-brand {
      font-family: 'Chewy', cursive;
      font-size: 1.5rem;
      color: #fff;
    }
    
    .footer-social {
      display: flex;
      gap: 20px;
    }
    
    .footer-copy {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }
    
    /* Scroll to Top Button */
    .scroll-to-top {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: var(--accent);
      color: white;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      box-shadow: 0 4px 15px rgba(255,0,153,0.3);
      transition: var(--transition);
      z-index: 1000;
    }
    
    .scroll-to-top.visible {
      display: flex;
    }
    
    .scroll-to-top:hover {
      transform: translateY(-5px);
      box-shadow: 0 6px 20px rgba(255,0,153,0.5);
    }

    /* SWIPE INDICATOR */
    .swipe-hint {
      position: fixed;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      background: linear-gradient(135deg, rgba(255, 0, 153, 0.9), rgba(36, 36, 48, 0.95));
      border: 1px solid var(--accent-alt);
      border-right: none;
      border-radius: 20px 0 0 20px;
      padding: 12px 10px 12px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 9999;
      box-shadow: -4px 0 20px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
      transition: opacity 0.5s ease, transform 0.5s ease;
      cursor: pointer;
      user-select: none;
      display: none;
    }

    .swipe-hint.hidden {
      opacity: 0;
      transform: translate(100%, -50%);
      pointer-events: none;
    }

    .swipe-hint-content {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      line-height: 1.1;
    }

    .swipe-hint-text {
      font-size: 0.7rem;
      font-weight: 700;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .swipe-hint-sub {
      font-size: 0.65rem;
      color: var(--accent-alt);
      font-weight: 600;
    }

    .swipe-hint-icon {
      font-size: 1.2rem;
      color: var(--accent-alt);
      animation: swipeBounce 1.5s infinite ease-in-out;
    }

    @keyframes swipeBounce {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(-6px); }
    }

    @media (hover: none) and (pointer: coarse) {
      .swipe-hint {
        display: flex;
      }
    }
    
    @media (max-width: 1024px) {
      .container {
        flex-direction: column;
        padding: 40px 5%;
        gap: 40px;
      }
      
      .gif-container {
        flex-direction: row;
        flex: none;
        width: 100%;
        justify-content: center;
        position: static;
      }
      
      .gif-box {
        flex: 0 1 180px;
      }
      
      .sidebar {
        flex: none;
        width: 100%;
        border-left: none;
        border-top: 2px solid var(--line-color);
        padding-left: 0;
        padding-top: 30px;
        position: static;
      }
      
      .playlist-container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
      }
      
      .menu-row {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      
      .nav-links {
        justify-content: center;
      }
    }
    
    @media (max-width: 640px) {
      .nav-brand {
        font-size: 2.5rem;
      }
      
      .post-title {
        font-size: 1.8rem;
      }
      
      .blog-post {
        padding: 25px;
      }
      
      .mini-player {
        flex-direction: column;
        align-items: center;
        width: 100%;
      }
      
      .footer-inner {
        flex-direction: column;
        text-align: center;
      }
      
      .scroll-to-top {
        bottom: 20px;
        right: 20px;
        width: 45px;
        height: 45px;
      }
    }
  </style>
</head>
<body>

    <aside class="gif-container">
      <div class="gif-box" id="gif1" role="button" tabindex="0" aria-label="Deutschland GIF - Klicken zum Anhalten/Abspielen" style="background-image: url('images/GermanyGerGIF.gif');">
        <div class="gif-status playing" id="status1"></div>
      </div>
      <div class="gif-box" id="gif2" role="button" tabindex="0" aria-label="Juli GIF - Klicken zum Anhalten/Abspielen" style="background-image: url('images/July Gif.gif');">

    <main class="blog-section">

        <a href="https://www.twitch.tv/schrottkiste_luka" target="_blank" rel="noopener" class="social-btn twitch" aria-label="Twitch"><i class="fa-brands fa-twitch"></i></a>

    <i class="fas fa-arrow-up"></i>
  </button>

  <script>
    // DOM Elements
    const audio = document.getElementById('audio-player');
    const playPauseBtn = document.getElementById('play-pause-btn');
    const songTitleEl = document.getElementById('song-title');
    const artistNameEl = document.getElementById('artist-name');
    const visualizer = document.getElementById('visualizer');
    const scrollToTopBtn = document.getElementById('scrollToTop');
    
    let isPlaying = false;
    
    playPauseBtn.addEventListener('click', togglePlay);
    
    function togglePlay() {
      if (isPlaying) {
        audio.pause();
        playPauseBtn.textContent = '▶';
        playPauseBtn.setAttribute('aria-label', 'Play');
        visualizer.style.opacity = '0.3';
      } else {
        audio.play().catch(e => {
          console.log('Autoplay prevented:', e);
        });
        playPauseBtn.textContent = '⏸';
        playPauseBtn.setAttribute('aria-label', 'Pause');
        visualizer.style.opacity = '1';
      }
      isPlaying = !isPlaying;
    }
    
    async function fetchTrackInfo() {
      try {
        const response = await fetch('https://api.laut.fm/station/treasure_radio/current_song');
        if (!response.ok) throw new Error('Network response was not ok');
        
        const data = await response.json();
        
        if (data.title) {
          songTitleEl.textContent = data.title;
          artistNameEl.textContent = (data.artist && data.artist.name) ? data.artist.name : 'Treasure Radio';
        } else {
          songTitleEl.textContent = 'Treasure Radio';
          artistNameEl.textContent = 'Live Stream';
        }
      } catch (error) {
        songTitleEl.textContent = 'Nicht verfügbar';
        artistNameEl.textContent = 'Verbindungsfehler';
      }
    }
    
    fetchTrackInfo();
    setInterval(fetchTrackInfo, 15000);
    
    // GIF Toggle Function
    function toggleGif(id, gifSrc, stillSrc) {
      const el = document.getElementById(id);
      const statusEl = document.getElementById('status' + id.slice(-1));
      const currentBg = el.style.backgroundImage;
      const isGif = currentBg.includes('.gif');
      
      if (isGif) {
        el.style.backgroundImage = `url('${stillSrc}')`;
        statusEl.classList.remove('playing');
        statusEl.classList.add('paused');
      } else {
        el.style.backgroundImage = `url('${gifSrc}')`;
        statusEl.classList.remove('paused');
        statusEl.classList.add('playing');
      }
    }
    
    document.getElementById('gif1').addEventListener('click', () => {
      toggleGif('gif1', 'images/GermanyGerGIF.gif', 'images/image.png');
    });
    
    document.getElementById('gif2').addEventListener('click', () => {
      toggleGif('gif2', 'images/July Gif.gif', 'images/Bild_2026-07-06_210330659.png');

    // Scroll to Top
    window.addEventListener('scroll', () => {
      if (window.pageYOffset > 300) {
        scrollToTopBtn.classList.add('visible');
      } else {

      window.scrollTo({ top: 0, behavior: 'smooth' });

    const playlists = [
      { id: 'PLQLA52U7_qBOkmumSrvGZbE3CPPGqoLQX', title: 'Top 2026 Songs', img: 'https://yt3.googleusercontent.com/0at97SvH71PXtFz8le5gciUThF1dv9XsQ4rMv31yV4Nx62FqpsRWbLTV5wGXrBSkCGNGk4ZauA=s1200' },
      { id: 'PLQLA52U7_qBPJNw536VhdzwEmSeVHGCqx', title: 'Besties 2025', img: 'https://yt3.googleusercontent.com/Vs7i88V-4wi7LJPwtYV9TPABM_wYeLdMxpVms3sE9GuJZEspkjitm8_DyvXIpqqlt6oaVoJ7QOs=s1200' },
      { id: 'PLQLA52U7_qBN4VcQskCzUQoONu-RMwgwP', title: 'Top 2024 Songs', img: 'https://yt3.googleusercontent.com/67bJsnCGY4g2qY-zQfl_hH6Ob4TPXCFg3w7wcXuS2UM71boD8rLHLztq2oV6qSG1SfatjnE5_Lo=s1200' },
      { id: 'PLQLA52U7_qBPqddrF9dAD9pR5HOhI-zpq', title: '2023 Songs', img: 'https://yt3.googleusercontent.com/NhSgqBhtHOHQCY5CoxCh7oMxAbzd9Eme4Floq_rQy69dxQK3Wz2Ftt1pOkA3U6A-_BAcQ5BOXgM=s1200' },

      const playlistItem = document.createElement('div');
      playlistItem.className = 'playlist-item';

        <a href="https://music.youtube.com/playlist?list=${pl.id}" target="_blank" rel="noopener">
          <img src="${pl.img}" class="cover-img" alt="${pl.title}" loading="lazy">

      `;
      playlistContainer.appendChild(playlistItem);

    /* ========================================================
       MOBILE SWIPE GESTURE SYSTEM (AN Deinen Wunsch angepasst)
       ======================================================== */
    let touchStartX = 0;
    let touchEndX = 0;
    let touchStartY = 0;
    let touchEndY = 0;

    const swipeHint = document.getElementById('swipeHint');

    function dismissSwipeHint() {
      if (swipeHint) {
        swipeHint.classList.add('hidden');
      }
    }

    setTimeout(dismissSwipeHint, 6000);

    document.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    document.addEventListener('touchend', (e) => {
      touchEndX = e.changedTouches[0].screenX;
      touchEndY = e.changedTouches[0].screenY;
      handleSwipeGesture();
    }, { passive: true });

    function handleSwipeGesture() {
      const deltaX = touchEndX - touchStartX;
      const deltaY = touchEndY - touchStartY;
      const minSwipeDistance = 60;

      dismissSwipeHint();

      // Nur reagieren, wenn horizontal gewischt wurde
      if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > minSwipeDistance) {
        if (deltaX < 0) {
          // Finger bewegt sich von RECHTS nach LINKS -> Zur Startseite (index.html)
          window.location.href = 'index.html';
        } else {
          // Finger bewegt sich von LINKS nach RECHTS -> Zum Soundboard (soundboard.html)
          window.location.href = 'soundboard.html';
        }
      }
    }
  </script>
