<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SchrottkisteTube | Offiziell</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { 
            --bg: #0f0f0f; 
            --red: #ff0000; 
            --card: #1a1a1a; 
            --gray: #aaa; 
            --text: #ffffff;
        }
        
        body { 
            background: var(--bg); 
            color: var(--text); 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; 
            display: flex; 
            overflow-x: hidden;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: #0f0f0f;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 1001;
            border-bottom: 1px solid #222;
        }

        .logo-area { display: flex; align-items: center; gap: 15px; }
        
        .logo { 
            color: white; 
            font-size: 22px; 
            font-weight: bold; 
            text-decoration: none; 
            display: flex; 
            align-items: center; 
        }
        .logo span { background: var(--red); color: white; padding: 2px 6px; border-radius: 4px; margin-left: 4px; }

        .search-container {
            flex: 0 1 500px;
            display: flex;
            background: #121212;
            border: 1px solid #333;
            border-radius: 40px;
            padding: 5px 15px;
            margin: 0 15px;
        }

        .search-container input {
            background: transparent;
            border: none;
            color: white;
            width: 100%;
            padding: 8px;
            outline: none;
            font-size: 15px;
        }

        .hamburger-btn { 
            cursor: pointer; 
            font-size: 18px;
            background: #222; 
            padding: 8px 12px; 
            border-radius: 8px; 
            border: 1px solid #333;
        }

        .custom-sidebar { 
            width: 250px; 
            position: fixed; 
            top: 0; 
            left: -250px; 
            bottom: 0; 
            background: #111; 
            transition: 0.3s ease-in-out; 
            z-index: 1000; 
            padding-top: 80px; 
            border-right: 1px solid #333; 
        }

        #menuToggle:checked ~ .custom-sidebar { left: 0; }

        .custom-sidebar nav a { 
            display: block; 
            padding: 15px 25px; 
            color: #ccc; 
            text-decoration: none; 
            font-size: 16px;
        }

        .custom-sidebar nav a:hover { background: #1a1a1a; color: white; }
        .custom-sidebar nav a.active { border-left: 4px solid var(--red); background: #1a1a1a; color: white; font-weight: bold; }

        main { 
            flex: 1; 
            padding: 20px; 
            padding-top: 80px; 
            min-height: 100vh;
            max-width: 1400px;
            margin: 0 auto;
        }

        .tabs { 
            display: flex; 
            gap: 30px; 
            margin-bottom: 30px; 
            border-bottom: 1px solid #333; 
            position: sticky;
            top: 60px;
            background: var(--bg);
            z-index: 10;
        }

        .tab { 
            padding: 15px 5px; 
            cursor: pointer; 
            color: var(--gray); 
            font-weight: 600; 
            border-bottom: 3px solid transparent; 
            text-transform: uppercase; 
            font-size: 14px;
        }

        .tab.active { color: white; border-bottom-color: white; }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
            gap: 25px; 
        }

        .v-card { 
            background: var(--card); 
            border-radius: 12px; 
            overflow: hidden; 
            cursor: pointer; 
            transition: 0.3s; 
            border: 1px solid transparent;
        }

        .v-card:hover { 
            transform: translateY(-5px); 
            background: #222;
            border-color: #444;
        }

        .thumb { 
            width: 100%; 
            aspect-ratio: 16/9; 
            background-size: cover; 
            background-position: center; 
        }

        .v-title { 
            padding: 15px; 
            font-size: 15px; 
            font-weight: 500;
            line-height: 1.4;
            height: 42px; 
            overflow: hidden; 
            display: -webkit-box; 
            -webkit-line-clamp: 2; 
            -webkit-box-orient: vertical; 
        }

        #player { 
            position: fixed; 
            inset: 0; 
            background: rgba(0,0,0,0.95); 
            z-index: 2000; 
            display: none; 
            align-items: center;
            justify-content: center;
        }

        .back-btn { 
            position: absolute; 
            top: 25px; 
            left: 25px; 
            color: white; 
            cursor: pointer; 
            background: #222; 
            padding: 12px 25px; 
            border-radius: 50px; 
            font-weight: bold; 
            z-index: 2100;
            border: 1px solid #444;
        }

        iframe { width: 90%; height: 80%; border-radius: 15px; }

        @media (max-width: 768px) {
            .search-container { display: none; }
            .grid { grid-template-columns: 1fr; }
            iframe { width: 100%; height: 60%; }
        }
    </style>
</head>
<body>

    <input type="checkbox" id="menuToggle" hidden>
    
    <header>
        <div class="logo-area">
            <label for="menuToggle" class="hamburger-btn">☰ MENÜ</label>
            <a href="#" class="logo">Schrott<span>Tube</span></a>
        </div>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Videos suchen..." oninput="handleSearch()">
        </div>
        <div style="width: 40px;"></div>
    </header>

    <aside class="custom-sidebar">
        <nav>
            <a href="index.html">Startseite</a>
            <a href="app.html">App Download</a>
            <a href="ideen.html">Content-Plan</a>
            <a href="minecrafttahin.html">Minecraft-Tahin</a>
            <a href="radio.html">TREASURE RADIO</a>
            <a href="schrottube.html" class="active">SchrottkisteTube</a>
        </nav>
    </aside>

    <main>
        <div class="tabs">
            <div id="tab-video" class="tab active" onclick="switchTab('video', this)">Videos</div>
            <div id="tab-short" class="tab" onclick="switchTab('short', this)">Shorts</div>
            <div id="tab-live" class="tab" onclick="switchTab('live', this)">Livestreams</div>
        </div>
        <div id="grid" class="grid">Verbindung zur Schrottkiste-Datenbank wird hergestellt...</div>
    </main>

    <div id="player">
        <div class="back-btn" onclick="closePlayer()">← SCHLIESSEN</div>
        <iframe id="v-frame" frameborder="0" allow="autoplay; fullscreen"></iframe>
    </div>

<script>
    // IDs für die Kategorisierung (Diese müssen in Supabase existieren)
    const LIVES = ["UaaHEFTI9Os","Op2lWPimLWQ","UUIAQBfhgwQ","GoSsVko2btU","SkL8MNIkoQg","V75xUOSooiw","WJkKKwHt48U","IM-5xKFHT28","H7fAZjbt-q4","eVPcR4qCzc0","B1zeEi2vz1M","BIinfidGY0c","xEjLcNHEC5Q","BVUK6YcqWYA","7jTdSE3KxTA","eVoEpDNsHNY","XRpyHodig8o","uoyliN7PpLo","JDFHbbfT8_Q","k2lXAY4M-Og","mgGSPG9JoCQ","CmimbvUbZAw","pDi1D88LT2A","3noh1zOifLo","0L9nLLDP6tQ","2g6lLNPV3-U","WvkqQ-NVTq0","-23vMLNkqMw","5Ejw9OqqY20"];
    const SHORTS = ["u89RkBYE5Pc","l4umSPnJTs4","aV66i9_ubek","mzgtGfSxWKs","RtjSNQhWLyQ","AdhBzTEcYUY","lpmtkNmaGpQ","h3u8wBxb9sk","aNQhB4NQMr0","AN8FqdgaeFo","k55bn6AaDfs","KTVvFwuiV60","xFTxt97hV0I","PIcuAL90juw","gR4u6kOUN-o","d5yZ0pEsaAc","aNbVt4ifuCQ","EuVYYGNdV9k","bXP2jWx7gDQ","UtTWoSoaRVY","1QPj0yGLR-Y","HMDGVNR0dl4","bzi3zwmsxo4","W_v7aWzhRyc","ki8qm99UpwA","4vUQW4c-KYI","IxtsyrIfRH8"];

    const SUPABASE_URL = "https://cdhpeegsdamxqbldoniw.supabase.co";
    const SUPABASE_KEY = "sb_publishable_cdkDvyIyVRz75m1MjNd7wA_Cc4iUxqb";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    let dbVideos = [];
    let currentCategory = 'video';

    async function fetchVideos() {
        // Holt alles aus der Tabelle 'videos'
        const { data, error } = await sb
            .from('videos')
            .select('youtube_id, title, created_at')
            .order('created_at', { ascending: false });

        if (error) {
            console.error("Datenbank-Fehler:", error);
            document.getElementById('grid').innerHTML = "Fehler beim Laden.";
            return;
        }

        if (data) {
            dbVideos = data.map(v => ({
                id: v.youtube_id ? v.youtube_id.trim() : "",
                title: v.title || "Unbenanntes Video"
            }));
            switchTab('video', document.getElementById('tab-video'));
        }
    }

    function switchTab(type, el) {
        currentCategory = type;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        handleSearch();
    }

    function handleSearch() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        let list = [];

        if (currentCategory === 'live') {
            list = dbVideos.filter(v => LIVES.includes(v.id));
        } else if (currentCategory === 'short') {
            list = dbVideos.filter(v => SHORTS.includes(v.id));
        } else {
            // Zeigt alles an, was kein Live oder Short ist (Normaler Feed)
            list = dbVideos.filter(v => !LIVES.includes(v.id) && !SHORTS.includes(v.id));
        }

        const filtered = list.filter(v => v.title.toLowerCase().includes(query));
        renderGrid(filtered);
    }

    function renderGrid(list) {
        const grid = document.getElementById('grid');
        if (list.length === 0) {
            grid.innerHTML = "<p style='text-align:center; grid-column: 1/-1; opacity:0.5;'>Keine Videos gefunden.</p>";
            return;
        }

        grid.innerHTML = list.map(v => `
            <div class="v-card" onclick="openPlayer('${v.id}')">
                <div class="thumb" style="background-image:url('https://img.youtube.com/vi/${v.id}/mqdefault.jpg')"></div>
                <div class="v-title">${v.title}</div>
            </div>
        `).join('');
    }

    function openPlayer(id) {
        const player = document.getElementById('player');
        const frame = document.getElementById('v-frame');
        player.style.display = 'flex';
        frame.src = `https://www.youtube.com/embed/${id}?autoplay=1&rel=0`;
        document.body.style.overflow = 'hidden';
    }

    function closePlayer() {
        const player = document.getElementById('player');
        const frame = document.getElementById('v-frame');
        player.style.display = 'none';
        frame.src = '';
        document.body.style.overflow = 'auto';
    }

    fetchVideos();
</script>
</body>
</html>
