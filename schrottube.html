<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SchrottkisteTube | Professional</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <style>
        :root { --bg: #0f0f0f; --red: #ff0000; --gray: #888; }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; display: flex; }

        /* Sidebar Logik */
        .hamburger-btn { position: fixed; top: 15px; left: 15px; z-index: 1001; background: #222; padding: 10px; border-radius: 5px; cursor: pointer; }
        .custom-sidebar { width: 250px; position: fixed; top: 0; left: -250px; bottom: 0; background: #111; transition: 0.3s; z-index: 1000; padding-top: 60px; border-right: 1px solid #333; }
        #menuToggle:checked ~ .custom-sidebar { left: 0; }
        .custom-sidebar nav a { display: block; padding: 15px 20px; text-decoration: none; color: #ccc; border-bottom: 1px solid #222; }
        .custom-sidebar nav a.active { border-left: 4px solid var(--red); background: #1a1a1a; color: white; }

        /* Content */
        main { flex: 1; padding: 20px; padding-top: 70px; min-height: 100vh; }
        .tabs { display: flex; gap: 20px; margin-bottom: 25px; border-bottom: 1px solid #333; }
        .tab { padding: 10px 0; cursor: pointer; color: var(--gray); font-weight: bold; border-bottom: 2px solid transparent; text-transform: uppercase; font-size: 14px; }
        .tab.active { color: white; border-bottom-color: white; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
        .grid.shorts-mode { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
        
        .v-card { cursor: pointer; transition: 0.2s; background: #111; border-radius: 12px; overflow: hidden; }
        .v-card:hover { transform: scale(1.02); background: #1a1a1a; }
        
        .thumb { width: 100%; aspect-ratio: 16/9; background-size: cover; background-position: center; background-color: #222; position: relative; }
        .shorts-mode .thumb { aspect-ratio: 9/16; }
        
        .v-title { padding: 12px; font-size: 14px; line-height: 1.4; height: 55px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

        #player { position: fixed; inset: 0; background: #000; z-index: 2000; display: none; }
        .back-btn { position: absolute; top: 20px; left: 20px; color: white; cursor: pointer; background: rgba(0,0,0,0.8); padding: 10px 20px; border-radius: 30px; z-index: 2100; font-weight: bold; }
    </style>
</head>
<body>

    <input type="checkbox" id="menuToggle" hidden>
    <label for="menuToggle" class="hamburger-btn">☰ MENÜ</label>

    <aside class="custom-sidebar">
        <nav>
            <a href="index.html">Startseite</a>
            <a href="app.html">App Download</a>
            <a href="ideen.html">Content-Plan</a>
            <a href="minecrafttahin.html">Minecraft-Tahin</a>
            <a href="radio.html">TREASURE RADIO</a>
            <a href="schrottube.html" class="active">SchrottkisteTube</a>
        </nav>
    </aside>

    <main>
        <div class="tabs">
            <div class="tab active" onclick="switchTab('video', this)">Videos</div>
            <div class="tab" onclick="switchTab('short', this)">Shorts</div>
            <div class="tab" onclick="switchTab('live', this)">Livestreams</div>
        </div>
        <div id="grid" class="grid">Synchronisiere mit Datenbank...</div>
    </main>

    <div id="player">
        <div class="back-btn" onclick="closeVideo()">← ZURÜCK</div>
        <iframe id="v-frame" width="100%" height="100%" frameborder="0" allow="autoplay; fullscreen"></iframe>
    </div>

<script>
    // DEINE MANUELLEN LISTEN
    const LIVE_IDS = ["5Ejw9OqqY20"," -23vMLNkqMw","WvkqQ-NVTq0","2g6lLNPV3-U","0L9nLLDP6tQ","3noh1zOifLo","pDi1D88LT2A","CmimbvUbZAw","mgGSPG9JoCQ","k2lXAY4M-Og","JDFHbbfT8_Q","uoyliN7PpLo","XRpyHodig8o","eVoEpDNsHNY","7jTdSE3KxTA","BVUK6YcqWYA","xEjLcNHEC5Q","BIinfidGY0c","B1zeEi2zg1M","eVPcR4qCzc0","H7fAZjbt-q4","IM-5xKFHT28","WJkKKwHt48U","V75xUOSooiw","SkL8MNIkoQg","GoSsVko2btU","UUIAQBfhgwQ","Op2lWPimLWQ","UaaHEFTI9Os"];
    const SHORT_IDS = ["aV66i9_ubek","mzgtGfSxWKs","RtjSNQhWLyQ","AdhBzTEcYUY","lpmtkNmaGpQ","h3u8wBxb9sk","aNQhB4NPMr0","AN8FqdgaeFo","k55bn6AaDfs","KTVvFwuiV60","xFTxt97hV0I","PIcuAL90juw","gR4u6kOUN-o","d5yZ0pEsaAc","aNbVt4ifuCQ","EuVYYGNdV9k","bXP2jWx7gDQ","UtTWoSoaRVY","1QPj0yGLR-Y","HMDGVNR0dl4","bzi3zwmsxo4","W_v7aWzhRyc","ki8qm99UpwA","4vUQW4c-KYI","IxtsyrIfRH8"];

    const CONF = {
        url: "https://cdhpeegsdamxqbldoniw.supabase.co",
        key: "sb_publishable_cdkDvyIyVRz75m1MjNd7wA_Cc4iUxqb"
    };

    let sb;
    let allData = [];

    window.onload = () => {
        if(typeof supabase !== 'undefined') {
            sb = supabase.createClient(CONF.url, CONF.key);
            fetchAll();
        }
    };

    async function fetchAll() {
        try {
            const { data, error } = await sb.from('Videos').select('youtube_id, title, type');
            if(error) throw error;
            allData = data;
            switchTab('video', document.querySelector('.tab.active'));
        } catch(e) {
            document.getElementById('grid').innerHTML = "Fehler beim Laden.";
        }
    }

    function switchTab(type, el) {
        const grid = document.getElementById('grid');
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        el.classList.add('active');

        // Layout anpassen für Shorts
        if(type === 'short') grid.classList.add('shorts-mode');
        else grid.classList.remove('shorts-mode');

        let displayList = [];

        if(type === 'live') {
            // Filtere nach Live-Liste und zeige sie in deiner Reihenfolge (umgedreht)
            displayList = allData.filter(v => LIVE_IDS.includes(v.youtube_id))
                                 .sort((a, b) => LIVE_IDS.indexOf(a.youtube_id) - LIVE_IDS.indexOf(b.youtube_id));
        } 
        else if(type === 'short') {
            // Filtere nach Shorts-Liste
            displayList = allData.filter(v => SHORT_IDS.includes(v.youtube_id))
                                 .sort((a, b) => SHORT_IDS.indexOf(a.youtube_id) - SHORT_IDS.indexOf(b.youtube_id));
        } 
        else {
            // Alles, was NICHT in Live oder Shorts ist, kommt in Videos
            displayList = allData.filter(v => !LIVE_IDS.includes(v.youtube_id) && !SHORT_IDS.includes(v.youtube_id));
        }

        render(displayList);
    }

    function render(data) {
        const grid = document.getElementById('grid');
        if(data.length === 0) {
            grid.innerHTML = "<p style='opacity:0.5;'>Keine Inhalte gefunden.</p>";
            return;
        }
        grid.innerHTML = data.map(v => `
            <div class="v-card" onclick="playVideo('${v.youtube_id}')">
                <div class="thumb" style="background-image:url('https://img.youtube.com/vi/${v.youtube_id}/mqdefault.jpg')"></div>
                <div class="v-title">${v.title}</div>
            </div>
        `).join('');
    }

    function playVideo(id) {
        document.getElementById('player').style.display = 'block';
        // Erkennt automatisch ob Stream/Short/Video für Embed
        document.getElementById('v-frame').src = `https://www.youtube.com/embed/${id}?autoplay=1`;
    }

    function closeVideo() {
        document.getElementById('player').style.display = 'none';
        document.getElementById('v-frame').src = '';
    }
</script>
</body>
</html>
