<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SchrottkisteTube | Offiziell</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { 
            --bg: #0f0f0f; 
            --red: #ff0000; 
            --card: #1a1a1a; 
            --gray: #aaa; 
            --text: #ffffff;
        }
        
        body { 
            background: var(--bg); 
            color: var(--text); 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            margin: 0; 
            display: flex; 
            overflow-x: hidden;
        }

        /* Header mit Logo & Suche */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: #0f0f0f;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 1001;
            border-bottom: 1px solid #222;
        }

        .logo-area { display: flex; align-items: center; gap: 15px; }
        
        .logo { 
            color: white; 
            font-size: 22px; 
            font-weight: bold; 
            text-decoration: none; 
            display: flex; 
            align-items: center; 
        }
        .logo span { background: var(--red); color: white; padding: 2px 6px; border-radius: 4px; margin-left: 4px; }

        .search-container {
            flex: 0 1 500px;
            display: flex;
            background: #121212;
            border: 1px solid #333;
            border-radius: 40px;
            padding: 5px 15px;
            margin: 0 15px;
        }

        .search-container input {
            background: transparent;
            border: none;
            color: white;
            width: 100%;
            padding: 8px;
            outline: none;
            font-size: 15px;
        }

        /* Sidebar */
        .hamburger-btn { cursor: pointer; font-size: 20px; }

        .custom-sidebar { 
            width: 250px; 
            position: fixed; 
            top: 0; 
            left: -250px; 
            bottom: 0; 
            background: #111; 
            transition: 0.3s ease-in-out; 
            z-index: 1000; 
            padding-top: 80px; 
            border-right: 1px solid #333; 
        }

        #menuToggle:checked ~ .custom-sidebar { left: 0; }

        .custom-sidebar nav a { 
            display: block; padding: 15px 25px; color: #ccc; text-decoration: none; 
        }
        .custom-sidebar nav a:hover { background: #1a1a1a; color: white; }

        /* Content */
        main { 
            flex: 1; padding: 20px; padding-top: 90px; 
            max-width: 1400px; margin: 0 auto;
        }

        .tabs { 
            display: flex; gap: 30px; margin-bottom: 30px; border-bottom: 1px solid #333; 
            position: sticky; top: 60px; background: var(--bg); z-index: 10;
        }

        .tab { 
            padding: 15px 5px; cursor: pointer; color: var(--gray); 
            font-weight: 600; border-bottom: 3px solid transparent; 
            text-transform: uppercase; font-size: 14px;
        }

        .tab.active { color: white; border-bottom-color: white; }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 20px; 
        }

        .v-card { background: var(--card); border-radius: 12px; overflow: hidden; cursor: pointer; transition: 0.2s; }
        .v-card:hover { transform: scale(1.02); background: #222; }

        .thumb { width: 100%; aspect-ratio: 16/9; background-size: cover; background-position: center; }
        .v-title { padding: 12px; font-size: 14px; font-weight: 500; height: 40px; overflow: hidden; }

        /* Player */
        #player { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; display: none; align-items: center; justify-content: center; }
        .back-btn { position: absolute; top: 20px; left: 20px; color: white; cursor: pointer; background: #333; padding: 10px 20px; border-radius: 20px; z-index: 2100; }
        iframe { width: 85%; height: 80%; border-radius: 10px; }

        @media (max-width: 600px) {
            .search-container { display: none; } /* Suche auf Handy verstecken oder anders lösen */
        }
    </style>
</head>
<body>

    <input type="checkbox" id="menuToggle" hidden>
    
    <header>
        <div class="logo-area">
            <label for="menuToggle" class="hamburger-btn">☰</label>
            <a href="#" class="logo">Schrott<span>Tube</span></a>
        </div>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Videos suchen..." oninput="handleSearch()">
        </div>
        <div style="width: 40px;"></div> </header>

    <aside class="custom-sidebar">
        <nav>
            <a href="index.html">Startseite</a>
            <a href="schrottube.html" style="font-weight:bold; color:white;">SchrottTube</a>
            <a href="radio.html">Radio</a>
        </nav>
    </aside>

    <main>
        <div class="tabs">
            <div id="tab-video" class="tab active" onclick="switchTab('video', this)">Videos</div>
            <div id="tab-short" class="tab" onclick="switchTab('short', this)">Shorts</div>
            <div id="tab-live" class="tab" onclick="switchTab('live', this)">Livestreams</div>
        </div>
        <div id="grid" class="grid">Laden...</div>
    </main>

    <div id="player">
        <div class="back-btn" onclick="closePlayer()">✕ Schließen</div>
        <iframe id="v-frame" frameborder="0" allow="autoplay; fullscreen"></iframe>
    </div>

<script>
    const LIVES = ["UaaHEFTI9Os","Op2lWPimLWQ","UUIAQBfhgwQ","GoSsVko2btU","SkL8MNIkoQg","V75xUOSooiw","WJkKKwHt48U","IM-5xKFHT28","H7fAZjbt-q4","eVPcR4qCzc0","B1zeEi2vz1M","BIinfidGY0c","xEjLcNHEC5Q","BVUK6YcqWYA","7jTdSE3KxTA","eVoEpDNsHNY","XRpyHodig8o","uoyliN7PpLo","JDFHbbfT8_Q","k2lXAY4M-Og","mgGSPG9JoCQ","CmimbvUbZAw","pDi1D88LT2A","3noh1zOifLo","0L9nLLDP6tQ","2g6lLNPV3-U","WvkqQ-NVTq0","-23vMLNkqMw","5Ejw9OqqY20"];
    const SHORTS = ["aV66i9_ubek","mzgtGfSxWKs","RtjSNQhWLyQ","AdhBzTEcYUY","lpmtkNmaGpQ","h3u8wBxb9sk","aNQhB4NQMr0","AN8FqdgaeFo","k55bn6AaDfs","KTVvFwuiV60","xFTxt97hV0I","PIcuAL90juw","gR4u6kOUN-o","d5yZ0pEsaAc","aNbVt4ifuCQ","EuVYYGNdV9k","bXP2jWx7gDQ","UtTWoSoaRVY","1QPj0yGLR-Y","HMDGVNR0dl4","bzi3zwmsxo4","W_v7aWzhRyc","ki8qm99UpwA","4vUQW4c-KYI","IxtsyrIfRH8"];

    const sb = supabase.createClient("https://cdhpeegsdamxqbldoniw.supabase.co", "sb_publishable_cdkDvyIyVRz75m1MjNd7wA_Cc4iUxqb");
    
    let allVideos = [];
    let currentCategory = 'video';

    async function fetchVideos() {
        const { data } = await sb.from('videos').select('youtube_id, title').order('created_at', { ascending: false });
        if (data) {
            allVideos = data.map(v => ({ id: v.youtube_id.trim(), title: v.title }));
            switchTab('video', document.getElementById('tab-video'));
        }
    }

    function switchTab(type, el) {
        currentCategory = type;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        handleSearch(); // Filtert basierend auf Tab + Suchfeld
    }

    function handleSearch() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        let list = [];

        if (currentCategory === 'live') {
            list = LIVES.map(id => ({ id, title: allVideos.find(v => v.id === id)?.title || "Livestream" }));
        } else if (currentCategory === 'short') {
            list = SHORTS.map(id => ({ id, title: allVideos.find(v => v.id === id)?.title || "Short" }));
        } else {
            list = allVideos.filter(v => !LIVES.includes(v.id) && !SHORTS.includes(v.id));
        }

        const filtered = list.filter(v => v.title.toLowerCase().includes(query));
        renderGrid(filtered);
    }

    function renderGrid(list) {
        const grid = document.getElementById('grid');
        grid.innerHTML = list.map(v => `
            <div class="v-card" onclick="openPlayer('${v.id}')">
                <div class="thumb" style="background-image:url('https://img.youtube.com/vi/${v.id}/mqdefault.jpg')"></div>
                <div class="v-title">${v.title}</div>
            </div>
        `).join('');
    }

    function openPlayer(id) {
        document.getElementById('player').style.display = 'flex';
        document.getElementById('v-frame').src = `https://www.youtube.com/embed/${id}?autoplay=1`;
    }

    function closePlayer() {
        document.getElementById('player').style.display = 'none';
        document.getElementById('v-frame').src = '';
    }

    fetchVideos();
</script>
</body>
</html>
