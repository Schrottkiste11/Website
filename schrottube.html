<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SchrottkisteTube | Warp Speed</title>
    <style>
        :root { --bg: #0f0f0f; --text: #fff; --red: #ff0000; }
        * { box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; display: flex; }

        /* Sidebar Logik bleibt gleich */
        .hamburger-btn { position: fixed; top: 15px; left: 15px; z-index: 1001; background: #222; padding: 10px; border-radius: 5px; cursor: pointer; }
        .custom-sidebar { width: 250px; position: fixed; top: 0; left: -250px; bottom: 0; background: #111; transition: 0.2s; z-index: 1000; padding-top: 60px; border-right: 1px solid #333; }
        #menuToggle:checked ~ .custom-sidebar { left: 0; }
        #menuToggle:checked ~ main { margin-left: 250px; }
        .custom-sidebar nav a { display: block; padding: 15px 20px; text-decoration: none; color: #ccc; border-bottom: 1px solid #222; }
        .custom-sidebar nav a.active { border-left: 4px solid var(--red); background: #1a1a1a; color: white; }

        /* Main Content */
        main { flex: 1; padding: 20px; padding-top: 70px; transition: 0.2s; }
        .tabs { display: flex; gap: 20px; margin-bottom: 20px; border-bottom: 1px solid #333; }
        .tab { padding: 10px 0; cursor: pointer; color: #888; font-size: 14px; font-weight: bold; border-bottom: 2px solid transparent; }
        .tab.active { color: white; border-bottom-color: white; }

        /* Grid Performance */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 15px; contain: content; }
        .v-card { cursor: pointer; background: #111; border-radius: 10px; overflow: hidden; padding-bottom: 10px; }
        .thumb { width: 100%; aspect-ratio: 16/9; background: #222; background-size: cover; background-position: center; }
        .v-title { padding: 10px; font-size: 13px; font-weight: 500; height: 42px; overflow: hidden; }

        #player { position: fixed; inset: 0; background: #000; z-index: 2000; display: none; }
    </style>
</head>
<body>

    <input type="checkbox" id="menuToggle" hidden>
    <label for="menuToggle" class="hamburger-btn">☰ MENÜ</label>

    <aside class="custom-sidebar">
        <nav>
            <a href="index.html">Startseite</a>
            <a href="app.html">App Download</a>
            <a href="ideen.html">Content-Plan</a>
            <a href="minecrafttahin.html">Minecraft-Tahin</a>
            <a href="radio.html">TREASURE RADIO</a>
            <a href="schrottube.html" class="active">SchrottkisteTube</a>
        </nav>
    </aside>

    <main>
        <div class="tabs">
            <div class="tab active" onclick="load('video', this)">VIDEOS</div>
            <div class="tab" onclick="load('short', this)">SHORTS</div>
            <div class="tab" onclick="load('live', this)">LIVE</div>
        </div>
        <div id="grid" class="grid"></div>
    </main>

    <div id="player" onclick="this.style.display='none'; document.querySelector('iframe').src=''">
        <div style="padding:20px; cursor:pointer;">← ZURÜCK</div>
        <iframe width="100%" height="80%" frameborder="0" allowfullscreen></iframe>
    </div>

<script>
    // Direkte API-Werte (keine Library nötig)
    const API_URL = "https://cdhpeegsdamxqbldoniw.supabase.co/rest/v1/youtube";
    const API_KEY = "sb_publishable_cdkDvyIyVRz75m1MjNd7wA_Cc4iUxqb";

    async function load(type = 'video', el = null) {
        const grid = document.getElementById('grid');
        
        if(el) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
        }

        // 1. Sofort-Check Cache
        const cached = localStorage.getItem('yt_' + type);
        if(cached) render(JSON.parse(cached));

        // 2. Fetch mit nacktem HTTP (extrem schnell)
        try {
            const response = await fetch(`${API_URL}?type=eq.${type}&order=created_at.desc&limit=12`, {
                headers: { "apikey": API_KEY, "Authorization": `Bearer ${API_KEY}` }
            });
            const data = await response.json();
            
            if(data && data.length > 0) {
                localStorage.setItem('yt_' + type, JSON.stringify(data));
                render(data);
            }
        } catch(e) { console.error("Netzwerkfehler"); }
    }

    function render(data) {
        document.getElementById('grid').innerHTML = data.map(v => `
            <div class="v-card" onclick="play('${v.youtube_id}')">
                <div class="thumb" style="background-image:url('https://img.youtube.com/vi/${v.youtube_id}/mqdefault.jpg')"></div>
                <div class="v-title">${v.title}</div>
            </div>
        `).join('');
    }

    function play(id) {
        const p = document.getElementById('player');
        p.style.display = 'block';
        p.querySelector('iframe').src = `https://www.youtube.com/embed/${id}?autoplay=1`;
    }

    // Erststart
    load();
</script>
</body>
</html>
