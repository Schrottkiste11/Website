<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SchrottkisteTube | Final Fix</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <style>
        :root { --bg: #0f0f0f; --red: #ff0000; --gray: #888; }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; display: flex; }
        
        /* Sidebar */
        .hamburger-btn { position: fixed; top: 15px; left: 15px; z-index: 1001; background: #222; padding: 10px; border-radius: 5px; cursor: pointer; }
        .custom-sidebar { width: 250px; position: fixed; top: 0; left: -250px; bottom: 0; background: #111; transition: 0.2s; z-index: 1000; padding-top: 60px; border-right: 1px solid #333; }
        #menuToggle:checked ~ .custom-sidebar { left: 0; }
        .custom-sidebar nav a { display: block; padding: 15px 20px; text-decoration: none; color: #ccc; border-bottom: 1px solid #222; }
        .custom-sidebar nav a.active { border-left: 4px solid var(--red); background: #1a1a1a; color: white; }

        /* Content */
        main { flex: 1; padding: 20px; padding-top: 70px; }
        .tabs { display: flex; gap: 20px; margin-bottom: 20px; border-bottom: 1px solid #333; }
        .tab { padding: 10px 0; cursor: pointer; color: var(--gray); font-weight: bold; border-bottom: 2px solid transparent; }
        .tab.active { color: white; border-bottom-color: white; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 15px; }
        .v-card { cursor: pointer; background: #111; border-radius: 10px; overflow: hidden; }
        .thumb { width: 100%; aspect-ratio: 16/9; background: #222; background-size: cover; background-position: center; }
        .v-title { padding: 10px; font-size: 13px; min-height: 40px; }

        #player { position: fixed; inset: 0; background: #000; z-index: 2000; display: none; }
        #error-msg { color: #ff4444; padding: 20px; display: none; background: rgba(255,0,0,0.1); border-radius: 10px; }
    </style>
</head>
<body>

    <input type="checkbox" id="menuToggle" hidden>
    <label for="menuToggle" class="hamburger-btn">☰ MENÜ</label>

    <aside class="custom-sidebar">
        <nav>
            <a href="index.html">Startseite</a>
            <a href="app.html">App Download</a>
            <a href="ideen.html">Content-Plan</a>
            <a href="minecrafttahin.html">Minecraft-Tahin</a>
            <a href="radio.html">TREASURE RADIO</a>
            <a href="schrottube.html" class="active">SchrottkisteTube</a>
        </nav>
    </aside>

    <main>
        <div id="error-msg"></div>
        <div class="tabs">
            <div class="tab active" onclick="load('video', this)">VIDEOS</div>
            <div class="tab" onclick="load('short', this)">SHORTS</div>
            <div class="tab" onclick="load('live', this)">LIVE</div>
        </div>
        <div id="grid" class="grid">Lade Schrottkiste...</div>
    </main>

    <div id="player" onclick="this.style.display='none'; document.querySelector('iframe').src=''">
        <div style="padding:20px; cursor:pointer;">← ZURÜCK</div>
        <iframe width="100%" height="80%" frameborder="0" allowfullscreen></iframe>
    </div>

<script>
    const CONF = {
        url: "https://cdhpeegsdamxqbldoniw.supabase.co",
        key: "sb_publishable_cdkDvyIyVRz75m1MjNd7wA_Cc4iUxqb"
    };

    let sb;

    // Wartet, bis die Library geladen ist
    window.onload = () => {
        if(typeof supabase !== 'undefined') {
            sb = supabase.createClient(CONF.url, CONF.key);
            load('video');
        } else {
            document.getElementById('grid').innerText = "Fehler: Verbindung zum Server fehlgeschlagen.";
        }
    };

    async function load(type, el) {
        const grid = document.getElementById('grid');
        const err = document.getElementById('error-msg');
        err.style.display = 'none';

        if(el) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
        }

        // 1. Cache sofort zeigen
        const cached = localStorage.getItem('yt_' + type);
        if(cached) render(JSON.parse(cached));

        // 2. Live Daten
        try {
            const { data, error } = await sb.from('youtube')
                .select('youtube_id, title')
                .eq('type', type)
                .order('created_at', { ascending: false })
                .limit(12);

            if(error) throw error;

            if(data) {
                localStorage.setItem('yt_' + type, JSON.stringify(data));
                render(data);
            }
        } catch(e) {
            console.error(e);
            err.innerText = "Fehler: " + e.message;
            err.style.display = 'block';
        }
    }

    function render(data) {
        const grid = document.getElementById('grid');
        if(!data || data.length === 0) {
            grid.innerHTML = "Keine Videos gefunden.";
            return;
        }
        grid.innerHTML = data.map(v => `
            <div class="v-card" onclick="play('${v.youtube_id}')">
                <div class="thumb" style="background-image:url('https://img.youtube.com/vi/${v.youtube_id}/mqdefault.jpg')"></div>
                <div class="v-title">${v.title}</div>
            </div>
        `).join('');
    }

    function play(id) {
        const p = document.getElementById('player');
        p.style.display = 'block';
        p.querySelector('iframe').src = `https://www.youtube.com/embed/${id}?autoplay=1`;
    }
</script>
</body>
</html>
