<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SchrottkisteTube | Official Domain Version</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <style>
        :root { --bg: #0f0f0f; --red: #ff0000; --surface: #1e1e1e; --text: #ffffff; --gray: #aaaaaa; }
        * { box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: "Roboto", sans-serif; margin: 0; overflow-x: hidden; }

        /* Navigation */
        header { height: 56px; display: flex; align-items: center; padding: 0 16px; background: var(--bg); position: fixed; top: 0; width: 100%; z-index: 1000; border-bottom: 1px solid #222; }
        .logo { display: flex; align-items: center; gap: 8px; cursor: pointer; text-decoration: none; color: white; }
        
        main { margin-top: 56px; padding: 20px; max-width: 1600px; margin-left: auto; margin-right: auto; }

        /* Tabs */
        .tabs { display: flex; gap: 25px; border-bottom: 1px solid #333; margin-bottom: 25px; position: sticky; top: 56px; background: var(--bg); z-index: 10; padding: 10px 0; }
        .tab { padding: 8px 0; cursor: pointer; color: var(--gray); font-size: 14px; font-weight: bold; border-bottom: 2px solid transparent; transition: 0.2s; }
        .tab.active { color: white; border-bottom-color: white; }

        /* Grid */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; row-gap: 30px; }
        .v-card { cursor: pointer; width: 100%; }
        .thumb { width: 100%; aspect-ratio: 16/9; background: #222; border-radius: 12px; background-size: cover; background-position: center; margin-bottom: 10px; position: relative; }
        .v-title { font-size: 14px; font-weight: 500; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        
        /* Shorts-Anpassung */
        .grid.shorts { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
        .grid.shorts .thumb { aspect-ratio: 9/16; }

        /* Player */
        #player-overlay { position: fixed; inset: 0; background: #000; z-index: 2000; display: none; }
        .close-p { position: absolute; top: 20px; left: 20px; z-index: 2100; cursor: pointer; background: rgba(0,0,0,0.6); padding: 8px 15px; border-radius: 20px; font-weight: bold; }
    </style>
</head>
<body>

<header>
    <a href="#" class="logo" onclick="location.reload()">
        <i class="material-icons-outlined" style="color:var(--red); font-size:28px;">play_circle_filled</i>
        <b>Schrottkiste<span style="font-weight:100">Tube</span></b>
    </a>
    <div id="loader" style="margin-left:auto; font-size:12px; opacity:0.4;">Synchronisiere...</div>
</header>

<main>
    <div class="tabs">
        <div class="tab active" onclick="switchTab('video', this)">VIDEOS</div>
        <div class="tab" onclick="switchTab('short', this)">SHORTS</div>
        <div class="tab" onclick="switchTab('live', this)">LIVE</div>
    </div>

    <div id="grid" class="grid"></div>
</main>

<div id="player-overlay">
    <div class="close-p" onclick="closePlayer()">← ZURÜCK</div>
    <iframe id="main-frame" width="100%" height="100%" frameborder="0" allow="autoplay; fullscreen"></iframe>
</div>

<script>
    // Konfiguration
    const SB_URL = 'https://cdhpeegsdamxqbldoniw.supabase.co';
    const SB_KEY = 'sb_publishable_cdkDvyIyVRz75m1MjNd7wA_Cc4iUxqb';
    const client = supabase.createClient(SB_URL, SB_KEY);

    let currentTab = 'video';
    const limit = 12;

    // 1. Laden (Cache-First-Strategie)
    async function loadContent() {
        const grid = document.getElementById('grid');
        const loader = document.getElementById('loader');
        
        // Tab-Styling anpassen
        grid.className = currentTab === 'short' ? 'grid shorts' : 'grid';

        // Cache prüfen
        const cacheName = `cache_${currentTab}`;
        const local = localStorage.getItem(cacheName);
        if (local) {
            render(JSON.parse(local));
            loader.innerText = "Cache geladen";
        }

        // Live-Daten holen
        try {
            const { data, error } = await client.from('youtube')
                .select('youtube_id, title')
                .eq('type', currentTab)
                .order('created_at', { ascending: false })
                .limit(limit);

            if (error) throw error;

            if (data) {
                localStorage.setItem(cacheName, JSON.stringify(data));
                render(data);
                loader.innerText = "Live aktualisiert";
            }
        } catch (e) {
            console.error("Fehler:", e);
            loader.innerText = "Verbindungsfehler";
        }
    }

    // 2. HTML Erzeugen
    function render(list) {
        const grid = document.getElementById('grid');
        if (list.length === 0) {
            grid.innerHTML = `<p style="opacity:0.5; grid-column: 1/-1; text-align:center;">Noch keine Inhalte im Bereich ${currentTab.toUpperCase()} vorhanden.</p>`;
            return;
        }

        grid.innerHTML = list.map(v => `
            <div class="v-card" onclick="openPlayer('${v.youtube_id}')">
                <div class="thumb" style="background-image:url('https://img.youtube.com/vi/${v.youtube_id}/mqdefault.jpg')">
                    ${currentTab === 'live' ? '<span style="position:absolute; bottom:5px; right:5px; background:red; padding:2px 5px; font-size:10px; border-radius:3px;">LIVE</span>' : ''}
                </div>
                <div class="v-title">${v.title}</div>
            </div>
        `).join('');
    }

    // 3. Navigation & Player
    function switchTab(type, el) {
        currentTab = type;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        loadContent();
    }

    function openPlayer(id) {
        document.getElementById('player-overlay').style.display = 'block';
        document.getElementById('main-frame').src = `https://www.youtube.com/embed/${id}?autoplay=1`;
        document.body.style.overflow = 'hidden';
    }

    function closePlayer() {
        document.getElementById('player-overlay').style.display = 'none';
        document.getElementById('main-frame').src = '';
        document.body.style.overflow = 'auto';
    }

    // Start
    loadContent();
</script>
</body>
</html>
